    case 'flip_100':      return f>=100;
    case 'flip_1000':     return f>=1000;
    case 'flip_10000':    return f>=10000;
    case 'flip_50k':      return f>=50000;
    case 'flip_100k':     return f>=100000;
    // 收益
    case 'earn_100':      return te>=100;
    case 'earn_1k':       return te>=1e3;
    case 'earn_10k':      return te>=1e4;
    case 'earn_100k':     return te>=1e5;
    case 'earn_1m':       return te>=1e6;

    case 'earn_100m':     return te>=1e8;
    case 'earn_1b':       return te>=1e9;
    case 'earn_10b':      return te>=1e10;
    case 'earn_1t':       return te>=1e12;
    // 升級
    case 'first_upgrade': return u>=1;
    case 'upgrade_5':     return u>=5;
    case 'upgrade_20':    return u>=20;
    case 'upgrade_50':    return u>=50;
    case 'upgrade_100':   return u>=100;
    case 'upgrade_200':   return u>=200;
    // 硬幣解鎖
    case 'silver_unlock': return lv('silver_coin')>=1;
    case 'skull_unlock':  return lv('skull_coin')>=1;
    case 'gold_unlock':   return lv('gold_coin')>=1;
    case 'plat_unlock':   return lv('plat_coin')>=1;
    case 'all_coins':     return lv('silver_coin')>=1&&lv('skull_coin')>=1&&lv('gold_coin')>=1&&lv('plat_coin')>=1;
    // 助手
    case 'first_helper':  return lv('helper')>=1;
    case 'helper_5':      return lv('helper')>=5;
    case 'helper_10':     return lv('helper')>=10;
    case 'helper_max':    return lv('helper')>=30;
    // 獻祭
    case 'first_prestige':return pc>=1;
    case 'prestige_3':    return pc>=3;
    case 'prestige_5':    return pc>=5;
    case 'prestige_10':   return pc>=10;
    case 'prestige_20':   return pc>=20;
    // 能力
    case 'first_ability': return ab>=1;
    case 'ability_10':    return ab>=10;
    case 'ability_50':    return ab>=50;
    case 'ability_100':   return ab>=100;
    // 雙倍
    case 'first_double':  return d>=1;
    case 'double_10':     return d>=10;
    case 'double_100':    return d>=100;
    case 'double_1000':   return d>=1000;
    // 消費
    case 'spend_1k':      return sp>=1e3;
    case 'spend_1m':      return sp>=1e6;
    case 'spend_1b':      return sp>=1e9;
    // 特殊
    case 'lucky_skill':   return lv('lucky_echo')>=1;
    case 'big_hands_buy': return lv('bigger_hands')>=1;
    case 'shockwave_buy': return lv('shockwave')>=1;
    case 'muscles_buy':   return lv('muscles')>=1;
    case 'all_specials':  return lv('lucky_echo')>=1&&lv('bigger_hands')>=1&&lv('shockwave')>=1&&lv('muscles')>=1;
  }
  return false;
}
function checkAchievements(gs){
  for(const a of ACHIEVEMENTS){
    if(!gs.achievements[a.id]&&_achCheck(gs,a)){
      gs.achievements[a.id]=true;
      gs.notify('🏆 成就解鎖：'+a.name,'#d4b437');
    }
  }
}

// ═══════════════════════════════════════════════════════
// GAME STATE
// ═══════════════════════════════════════════════════════
class GameState {
  constructor() {
    this.slot=1; this.money=0; this.totalEarned=0;
    this.upgradeLevels={}; this.talentPoints=0; this.prestigeCount=0; this.playerName='';
    this.talentLevels={}; this.selectedTable='classic';
    this.prestigeShopLevels={};
    this.abilities=[]; this.abilityCooldowns={}; this.activeEffects=[]; this.nextDoubleCount=0;
    this.notifications=[]; this.unlockQueue=[];
    this.achievements={}; this.stats={flips:0,upgradeBought:0,abilitiesUsed:0,doubles:0,totalSpent:0};
    this._cache=null;
  }
  invalidate() { this._cache=null; }
  computeStats() {
    if (this._cache) return this._cache;
    const s = {
      coinFlat:    Object.fromEntries(COIN_ORDER.map(c=>[c,0])),
      coinMult:    Object.fromEntries(COIN_ORDER.map(c=>[c,1])),
      coinSpeed:   Object.fromEntries(COIN_ORDER.map(c=>[c,1])),
      flipSpeed:   Object.fromEntries(COIN_ORDER.map(c=>[c,1])),
      coinLucky:   Object.fromEntries(COIN_ORDER.map(c=>[c,0])),
      helperMove:1, manualFlipSpd:1, luckyChance:0, globalMult:1, doubleFlip:false, prestigeBonus:0,
    };
    for (const [uid,lvl] of Object.entries(this.upgradeLevels)) {
      if (lvl<=0) continue;
      const u=getUpg(uid); if(!u) continue;
      const {eff,val=0,coin}=u;
      if      (eff==='coin_flat'   &&coin) s.coinFlat[coin]  +=val*lvl;
      else if (eff==='coin_mult'   &&coin) s.coinMult[coin]  +=val*lvl;
      else if (eff==='coin_speed'  &&coin) s.coinSpeed[coin] *=Math.pow(1-val,lvl);
      else if (eff==='flip_time'   &&coin) s.flipSpeed[coin] *=Math.pow(1-val,lvl);
      else if (eff==='coin_lucky'  &&coin) s.coinLucky[coin]  =Math.min(.9,s.coinLucky[coin]+val*lvl);
      else if (eff==='helper_move')        s.helperMove       +=val*lvl;
      else if (eff==='manual_flip')        s.manualFlipSpd   *=Math.pow(1-val,lvl);
      else if (eff==='lucky_chance')       s.luckyChance      =Math.min(.9,s.luckyChance+val*lvl);
      else if (eff==='global_mult')        s.globalMult       +=val;
      else if (eff==='double_flip')        s.doubleFlip       =true;
    }
    // apply talent effects (talentLevels now stores 0-3)
    for (const [tid,lvl] of Object.entries(this.talentLevels)) {
      if(!lvl||lvl<=0) continue;
      const t=getTalent(tid); if(!t) continue;
      const ev=t.val*lvl;
      if      (t.eff==='talent_global')   s.globalMult      += ev;
      else if (t.eff==='talent_flip')    { for(const c of COIN_ORDER) s.flipSpeed[c] *= (1-ev); }
      else if (t.eff==='talent_speed')   { for(const c of COIN_ORDER) s.coinSpeed[c] *= (1-ev); }
      else if (t.eff==='talent_cd')      { for(const c of COIN_ORDER) s.coinSpeed[c] *= (1-ev); }
      else if (t.eff==='talent_lucky')   s.luckyChance  = Math.min(.9, s.luckyChance + ev);
      else if (t.eff==='talent_helper')  s.helperMove   += ev;
      else if (t.eff==='talent_multi')   s.doubleFlip   = true;
      else if (t.eff==='talent_manual')  s.manualFlipSpd *= (1-ev);
      else if (t.eff==='talent_goldmult')s.coinMult['gold']     += ev;
      else if (t.eff==='talent_coppmult')s.coinMult['copper']   += ev;
      else if (t.eff==='talent_prestige')s.prestigeBonus        += ev;
    }
    // 永恆商店效果
    for(const [pid,lv] of Object.entries(this.prestigeShopLevels||{})){
      if(!lv||lv<=0) continue;
      const item=PRESTIGE_SHOP.find(p=>p.id===pid); if(!item) continue;
      if(item.eff==='ps_global')  s.globalMult+=item.val*lv;
      else if(item.eff==='ps_cd')     {const m=Math.pow(1-item.val,lv);for(const c of COIN_ORDER)s.coinSpeed[c]*=m;}
      else if(item.eff==='ps_lucky')  s.luckyChance=Math.min(.9,s.luckyChance+item.val*lv);
      else if(item.eff==='ps_manual') s.manualFlipSpd*=Math.pow(1-item.val,lv);
      else if(item.eff==='ps_cmult')  {for(const c of COIN_ORDER)s.coinMult[c]+=item.val*lv;}
      else if(item.eff==='ps_helper') s.helperMove+=item.val*lv;
      else if(item.eff==='ps_bonus')  s.prestigeBonus+=item.val*lv;
    }
    // Table bonus
    const tbl=this.selectedTable||'classic';
    if(tbl==='classic')       s.globalMult+=0.2;
    else if(tbl==='billiard') { for(const c of COIN_ORDER) s.coinSpeed[c]*=0.75; }
    else if(tbl==='poker')    { s.luckyChance=Math.min(.9,s.luckyChance+0.20); s.globalMult+=0.3; }
    else if(tbl==='dice')     s.globalMult+=0.5;
    else if(tbl==='wood')     { s.globalMult+=0.25; s.manualFlipSpd*=0.6; }
    return this._cache=s;
  }
  talentUnlocked(id){
    const t=getTalent(id); if(!t) return false;
    if(t.minPrestige && this.prestigeCount<t.minPrestige) return false;
    return t.req.every(r=>(this.talentLevels[r]||0)>=1);
  }
  talentVisible(id){
    const t=getTalent(id); if(!t) return false;
    if(t.minPrestige && this.prestigeCount<t.minPrestige) return false;
    if((this.talentLevels[id]||0)>=1) return true;
    return t.req.every(r=>(this.talentLevels[r]||0)>=1);
  }
  buyTalent(id){
    const t=getTalent(id); if(!t) return false;
    const cur=(this.talentLevels[id]||0);
    if(cur>=t.maxLevel) return false;
    if(!this.talentUnlocked(id)) return false;
    const cost=t.cost[cur];
    if(this.talentPoints<cost) return false;
    this.talentPoints-=cost; this.talentLevels[id]=cur+1; this.invalidate(); return true;
  }
  startingCoinsFromTalents(){
    const coins=[];
    const tl=this.talentLevels;
    for(let i=0;i<(tl['start_si']||0);i++) coins.push(SILVER);
    for(let i=0;i<(tl['start_go']||0);i++) coins.push(GOLD);
    for(let i=0;i<(tl['start_sk']||0);i++) coins.push(SKULL);
    for(let i=0;i<(tl['start_pl']||0);i++) coins.push(PLAT);
    if((this.selectedTable||'classic')==='dice') for(let i=0;i<5;i++) coins.push(COPPER);
    return coins;
  }
  coinValue(t)  { const s=this.computeStats(),b=COIN_VAL[t]; return (b+s.coinFlat[t])*s.coinMult[t]*s.globalMult; }
  flipCooldown(t){ const s=this.computeStats(),m=this.getActiveMults(); const cd={copper:2,silver:2.5,skull:2.8,gold:3,platinum:4}; return Math.max(.3,cd[t]*s.coinSpeed[t]*(1-m.speedReduce)); }
  flipDuration(t){ const s=this.computeStats(); return Math.max(.35,.90*s.flipSpeed[t]); }
  manualFlipDuration(t){ const s=this.computeStats(); return Math.max(.18,this.flipDuration(t)*s.manualFlipSpd); }
  helperInterval(){ return Math.max(.4,HELPER_INTERVAL_BASE*1); }
  helperMoveSpeed(){ const m=this.getActiveMults(); return HELPER_SPEED_BASE*this.computeStats().helperMove*m.helperMult; }
  earnMoney(t) {
    const s=this.computeStats(),m=this.getActiveMults();
    let amt=this.coinValue(t)*m.coinMult*m.globalMult;
    const luck=Math.min(.95,s.luckyChance+s.coinLucky[t]+m.luckyAdd);
    let doubled=Math.random()<luck;
    if(this.nextDoubleCount>0){doubled=true;this.nextDoubleCount--;}
    const earned=doubled?amt*2:amt;
    this.money+=earned; this.totalEarned+=earned;
    return {amount:earned,doubled};
  }
  buyUpgrade(uid,spawnCoin,spawnHelper) {
    const u=getUpg(uid); if(!u) return false;
    const lvl=this.upgradeLevels[uid]||0;
    if(lvl>=u.max) return false;
    if(u.req&&!(this.upgradeLevels[u.req]>0)) return false;
    const cost=upgCost(u,lvl);
    if(this.money<cost) return false;
    this.money-=cost; this.upgradeLevels[uid]=lvl+1; this.invalidate();
    this.stats.upgradeBought=(this.stats.upgradeBought||0)+1;
    this.stats.totalSpent=(this.stats.totalSpent||0)+cost;
    if(lvl===0) for(const u2 of UPGRADES) if(u2.req===uid) this.unlockQueue.push({name:u2.name,desc:u2.desc||''});
    if(u.eff==='add_coin')   spawnCoin(u.coin);
    if(u.eff==='add_helper') spawnHelper();
    checkAchievements(this);
    return true;
  }
  sacrificeThreshold(){
    const base=Math.round(500000*Math.pow(1.4,this.prestigeCount));
    const lv=this.prestigeShopLevels['ps_thresh']||0;
    return lv>0?Math.max(100000,Math.round(base*Math.pow(1-0.08,lv))):base;
  }
  prestigeShopCost(id){
    const item=PRESTIGE_SHOP.find(p=>p.id===id); if(!item) return Infinity;
    return Math.ceil(item.baseCost*Math.pow(item.costMul,this.prestigeShopLevels[id]||0));
  }
  buyPrestigeShop(id){
    const item=PRESTIGE_SHOP.find(p=>p.id===id); if(!item) return false;
    if(this.prestigeCount<item.req) return false;
    const lv=this.prestigeShopLevels[id]||0;
    if(lv>=(item.maxLevel||99)) return false;
    const cost=this.prestigeShopCost(id);
    if(this.talentPoints<cost) return false;
    this.talentPoints-=cost;
    this.prestigeShopLevels[id]=lv+1;
    this.invalidate(); return true;
  }
  sacrifice(rebuildFn) {
    const thresh=this.sacrificeThreshold();
    const base=Math.max(0,Math.floor(this.totalEarned/thresh));
    if(base<=0) return 0;
    const bonus=this.computeStats().prestigeBonus||0;
    const pts=Math.max(1,Math.round(base*(1+bonus)));
    this.talentPoints+=pts; this.prestigeCount+=1;
    this.money=0; this.totalEarned=0; this.upgradeLevels={}; this.invalidate();
    rebuildFn(); this.notify(`Sacrifice! +${pts} talent pts`,'#4bd2d2'); return pts;
  }
  getActiveMults(){
    let coinMult=1,speedReduce=0,luckyAdd=0,helperMult=1,globalMult=1;
    for(const e of this.activeEffects){
      if(e.eff==='coin_mult_temp') coinMult*=e.val;
      else if(e.eff==='speed_temp')  speedReduce=Math.max(speedReduce,e.val);
      else if(e.eff==='lucky_temp')  luckyAdd+=e.val;
      else if(e.eff==='helper_temp') helperMult=Math.max(helperMult,e.val);
      else if(e.eff==='allin_mult')  globalMult*=e.val;
    }
    return {coinMult,speedReduce,luckyAdd,helperMult,globalMult};
  }
  tickAbilities(dt){
    this.activeEffects=this.activeEffects.filter(e=>{e.remaining-=dt;return e.remaining>0;});
    for(const id of Object.keys(this.abilityCooldowns)){
      this.abilityCooldowns[id]=Math.max(0,this.abilityCooldowns[id]-dt);
    }
  }
  addAbility(id){
    if(this.abilities.length>=3||this.abilities.includes(id)) return false;
    this.abilities.push(id); return true;
  }
  notify(text,color='#eeeef8') { this.notifications.push({text,color,timer:2.5}); }
  tickNotifications(dt) { this.notifications=this.notifications.filter(n=>(n.timer-=dt)>0); }
  static slotKey(n) { return `gt_slot_${n}`; }
  static getPreview(n) {
    try { const d=JSON.parse(localStorage.getItem(GameState.slotKey(n))||'null'); return d?{money:d.money||0,totalEarned:d.totalEarned||0,prestigeCount:d.prestigeCount||0}:null; } catch{return null;}
  }
  static getGlobalName()      { return localStorage.getItem('gt_player_name')||''; }
  static setGlobalName(name)  { localStorage.setItem('gt_player_name', name); }
  static deleteSlot(n) { localStorage.removeItem(GameState.slotKey(n)); }
  save() {
    try { localStorage.setItem(GameState.slotKey(this.slot),JSON.stringify({money:this.money,totalEarned:this.totalEarned,upgradeLevels:this.upgradeLevels,talentPoints:this.talentPoints,prestigeCount:this.prestigeCount,talentLevels:this.talentLevels,selectedTable:this.selectedTable||'classic',abilities:this.abilities||[],achievements:this.achievements||{},stats:this.stats||{},prestigeShopLevels:this.prestigeShopLevels||{}})); } catch{}
    syncToServer(this);
  }
  load(slot) {
    this.slot=slot;
    try { const d=JSON.parse(localStorage.getItem(GameState.slotKey(slot))||'null'); if(!d) return; Object.assign(this,{money:d.money||0,totalEarned:d.totalEarned||0,upgradeLevels:d.upgradeLevels||{},talentPoints:d.talentPoints||0,prestigeCount:d.prestigeCount||0,talentLevels:d.talentLevels||{},selectedTable:d.selectedTable||'classic',abilities:d.abilities||[],achievements:d.achievements||{},stats:Object.assign({flips:0,upgradeBought:0,abilitiesUsed:0,doubles:0,totalSpent:0},d.stats||{}),prestigeShopLevels:d.prestigeShopLevels||{}}); } catch{}
  }
}

// ═══════════════════════════════════════════════════════
// COIN
// ═══════════════════════════════════════════════════════
const JUMP_H=160, SPIN_ROTS=7, SQUISH_DUR=.13;

class Coin {
  constructor(type) {
    this.type=type;
    this.x=ri(PLAY_X1+COIN_R+4,PLAY_X2-COIN_R-4);
    const yMin=PLAY_Y1+COIN_R+(PLAY_Y2-PLAY_Y1)*.30;
    this.y=ri(yMin,PLAY_Y2-COIN_R-4);
    this.baseY=this.y; this.curY=this.y;
    this.state='idle'; this.jumpT=0; this.squishT=0;
    this.spinAngle=0; this.spinSpeed=0;
    this.upDur=.45; this.downDur=.45;
    this.driftVX=0; this.driftVY=0;
    this.resolved=false; this.result=null;
    this.earnText=''; this.earnColor='#d4b437'; this.earnTimer=0; this.earnDy=0;
    this.hover=false; this.targeted=false;
  }
  triggerFlip(gs,isManual=false) {
    if(this.state!=='idle') return false;
    AUDIO.sfx('flip');
    const total=gs ? (isManual?gs.manualFlipDuration(this.type):gs.flipDuration(this.type)) : .9;
    this.upDur=this.downDur=total/2;
    this.spinSpeed=360*SPIN_ROTS/total; this.spinAngle=0;
    this.resolved=false; this.result=null;
    const dspd=50+Math.random()*60, dang=Math.random()*Math.PI*2;
    this.driftVX=Math.cos(dang)*dspd; this.driftVY=Math.sin(dang)*dspd*.65;
    this.state='up'; this.jumpT=0; this.curY=this.baseY;
    return true;
  }
  update(dt,gs) {
    if(this.state==='up') {
      this.jumpT+=dt; this.spinAngle+=this.spinSpeed*dt;
      this.x+=this.driftVX*dt;
      this.x=Math.max(PLAY_X1+COIN_R+4,Math.min(PLAY_X2-COIN_R-4,this.x));
      this.baseY+=this.driftVY*dt;
      this.baseY=Math.max(PLAY_Y1+COIN_R+4,Math.min(PLAY_Y2-COIN_R-4,this.baseY));
      const t=Math.min(1,this.jumpT/this.upDur);
      this.curY=this.baseY-JUMP_H*Math.sin(t*Math.PI*.5);
      if(t>=1){if(!this.resolved){this.resolved=true;this.spinSpeed=-this.spinSpeed;this._resolve(gs);}this.state='down';this.jumpT=0;}
    } else if(this.state==='down') {
      this.jumpT+=dt; this.spinAngle+=this.spinSpeed*dt;
      this.x+=this.driftVX*dt;
      this.x=Math.max(PLAY_X1+COIN_R+4,Math.min(PLAY_X2-COIN_R-4,this.x));
      this.baseY+=this.driftVY*dt;
      this.baseY=Math.max(PLAY_Y1+COIN_R+4,Math.min(PLAY_Y2-COIN_R-4,this.baseY));
      const t=Math.min(1,this.jumpT/this.downDur);
      this.curY=this.baseY-JUMP_H*Math.cos(t*Math.PI*.5);
      if(t>=1){this.curY=this.baseY;this.spinAngle=0;this.spinSpeed=0;this.state='squish';this.squishT=0;}
    } else if(this.state==='squish') {
      this.squishT+=dt; if(this.squishT>=SQUISH_DUR) this.state='idle';
    }
    if(this.earnTimer>0){this.earnTimer-=dt;this.earnDy+=dt*28;}
  }
  _resolve(gs) {
    gs.stats.flips=(gs.stats.flips||0)+1;
    checkAchievements(gs);
    if(Math.random()<.5){
      const {amount,doubled}=gs.earnMoney(this.type);
      this.result='heads'; this.earnText=fmt(amount).slice(1); // 移除 fmt 自帶 $ 前綴
      this.earnColor=doubled?'#4bd2d2':'#d4b437'; this.earnTimer=1.2; this.earnDy=0;
      AUDIO.sfx('heads');
      if(doubled){ gs.stats.doubles=(gs.stats.doubles||0)+1; AUDIO.sfx('double'); shockwaves.push({x:this.x,y:this.baseY,t:0}); }
    } else { this.result='tails'; this.earnText=''; AUDIO.sfx('tails'); }
  }
  isClicked(mx,my) { const dx=mx-this.x,dy=my-this.baseY; return dx*dx+dy*dy<=(COIN_R+6)**2; }
  draw() {
    const r=COIN_R,fw=r*2, FLAT_R=.55, fh=Math.max(4,Math.round(fw*FLAT_R));
    const [R,G,B]=COIN_COL[this.type],[DR,DG,DB]=COIN_DARK[this.type];
    const col=rgb(R,G,B),dark=rgb(DR,DG,DB),dk=rgb(DR-30,DG-30,DB-30),hi=rgb(R+38,G+38,B+38);
    const cx=this.x,cy=this.curY;

    // Shadow on floor
    const inAir=this.state==='up'||this.state==='down';
    const ht=Math.max(0,this.baseY-this.curY);
    const sw=inAir?Math.max(5,Math.round(fw*(1-ht/(JUMP_H+1)))):fw;
    ctx.fillStyle='rgba(0,0,0,.35)'; ellipse(cx,this.baseY+4,sw/2,3);

    const THICK=6;
    const T=16,D=2.5; // 16 鋸齒, 2.5px 深度
    const drawFlat=(fy,curH,doFace=true,dimmed=false)=>{
      const rx=fw/2,ry=Math.max(2,curH/2);
      ctx.fillStyle=dk; serrPath(ctx,cx,fy+THICK,rx,ry,T,D); ctx.fill();
      ctx.fillStyle=dark; serrPath(ctx,cx,fy+THICK/2,rx,ry,T,D); ctx.fill();
      ctx.fillStyle=col; serrPath(ctx,cx,fy,rx,ry,T,D); ctx.fill();
      ellipse(cx-1,fy-curH/2+Math.max(1,Math.round(curH*.2)),Math.max(2,(fw-8)/2),Math.max(1,Math.round(curH*.2)),hi);
      ctx.strokeStyle=dark;ctx.lineWidth=1;
      ctx.beginPath();ctx.ellipse(cx,fy,fw/2-3,curH/2-1,0,0,Math.PI*2);ctx.stroke();
      if(doFace&&this.result) this._face(cx,fy,fw,curH);
      if(dimmed){ctx.fillStyle='rgba(0,0,0,.35)'; serrPath(ctx,cx,fy,rx,ry,T,D); ctx.fill();}
    };

    if(this.state==='idle') {
      drawFlat(this.baseY,fh);
    } else if(this.state==='squish') {
      const prog=this.squishT/SQUISH_DUR;
      drawFlat(this.baseY,Math.max(fh,Math.round(fw*(1-(1-FLAT_R)*prog))),prog>.45);
    } else {
      const fc=Math.abs(Math.cos(this.spinAngle*Math.PI/180));
      const ah=Math.max(2,Math.round(r*2*fc));
      ctx.save();ctx.translate(cx,cy);ctx.scale(1,ah/(r*2));
      ctx.fillStyle=dk; serrPath(ctx,0,3,r,r,T,D); ctx.fill();
      ctx.fillStyle=col; serrPath(ctx,0,0,r,r,T,D); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.22)';ctx.beginPath();ctx.ellipse(-3,-4,r*.6,r*.38,-0.3,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=dk;ctx.font=`bold ${Math.round(r*.9)}px sans-serif`;
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(COIN_SYM[this.type]||'$',0,1);
      ctx.restore();
    }

    if(this.hover&&this.state==='idle'){
      ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=2;
      ctx.beginPath();ctx.ellipse(cx,this.baseY,fw/2+5,fh/2+4,0,0,Math.PI*2);ctx.stroke();
    }
    if(this.targeted&&this.state==='idle'){
      ctx.fillStyle='#fff038';ctx.beginPath();ctx.arc(cx,this.baseY-fh/2-5,3,0,Math.PI*2);ctx.fill();
    }
    if(this.earnTimer>0&&this.earnText){
      ctx.save();ctx.globalAlpha=Math.min(1,this.earnTimer/.35);
      ctx.font='15px sans-serif';ctx.textBaseline='bottom';
      const _ey=this.baseY-fh/2-14-this.earnDy;
      const _amtStr=this.earnText+' ';
      const _amtW=ctx.measureText(_amtStr).width;
      const _symW=ctx.measureText('$').width;
      const _ex=cx-(_amtW+_symW)/2;
      ctx.fillStyle=this.earnColor;ctx.textAlign='left';ctx.fillText(_amtStr,_ex,_ey);
      ctx.fillStyle='#ff8020';ctx.fillText('$',_ex+_amtW,_ey);
      ctx.restore();
    }
  }
  _face(cx,fy,fw,fh) {
    const sw=Math.max(8,fw/3),sh=Math.max(4,fh-2);

    // 骷髏幣：畫真實骷髏頭
    if(this.type==='skull'){
      const bone='rgb(218,212,198)', drk='rgb(18,13,28)';
      // 頭蓋骨（橢圓，頂部較寬）
      ctx.fillStyle=bone;
      ctx.beginPath();ctx.ellipse(cx,fy-sh*.05,sw*.45,sh*.38,0,0,Math.PI*2);ctx.fill();
      // 下顎（較窄的圓角矩形）
      ctx.beginPath();ctx.roundRect(cx-sw*.27,fy+sh*.23,sw*.54,sh*.2,2);ctx.fill();
      // 眼窩（左右各一個深色橢圓）
      ctx.fillStyle=drk;
      ctx.beginPath();ctx.ellipse(cx-sw*.17,fy-sh*.07,sw*.12,sh*.15,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(cx+sw*.17,fy-sh*.07,sw*.12,sh*.15,0,0,Math.PI*2);ctx.fill();
      // 鼻腔（倒三角小橢圓）
      ctx.beginPath();ctx.ellipse(cx,fy+sh*.1,sw*.07,sh*.1,0,0,Math.PI*2);ctx.fill();
      // 牙齒（3顆小矩形）
      const tw=sw*.11,th=sh*.09;
      [-sw*.14,0,sw*.14].forEach(ox=>{ctx.fillRect(cx+ox-tw/2,fy+sh*.3,tw,th);});
      return;
    }

    if(this.result==='tails'){
      const [DR,DG,DB]=COIN_DARK[this.type];
      const bone=rgb(Math.min(255,DR+80),Math.min(255,DG+75),Math.min(255,DB+70));
      const drk=rgb(Math.max(0,DR-40),Math.max(0,DG-40),Math.max(0,DB-40));
      ctx.fillStyle=bone;
      ctx.beginPath();ctx.ellipse(cx,fy-sh*.05,sw*.45,sh*.38,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.roundRect(cx-sw*.27,fy+sh*.23,sw*.54,sh*.2,2);ctx.fill();
      ctx.fillStyle=drk;
      ctx.beginPath();ctx.ellipse(cx-sw*.17,fy-sh*.07,sw*.12,sh*.15,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(cx+sw*.17,fy-sh*.07,sw*.12,sh*.15,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(cx,fy+sh*.1,sw*.07,sh*.1,0,0,Math.PI*2);ctx.fill();
      const tw=sw*.11,th=sh*.09;
      [-sw*.14,0,sw*.14].forEach(ox=>{ctx.fillRect(cx+ox-tw/2,fy+sh*.3,tw,th);});
    } else {
      const [DR,DG,DB]=COIN_DARK[this.type];
      ctx.fillStyle=rgb(Math.max(0,DR-20),Math.max(0,DG-20),Math.max(0,DB-20));
      ctx.font=`bold ${Math.max(7,Math.round(fh*.85))}px sans-serif`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(COIN_SYM[this.type]||'$',cx,fy);
    }
  }
}

  const LR=0.092,LH=0.380,LY=-(BH/2+BR)+LR*0.9;
  const HIPY=LY+LH/2+LR, LOY=-(LH/2+LR);
  const APX=-(BR+0.06), APY=0.06;

  const body=mk(new THREE.CapsuleGeometry(BR,BH,14,28),mB); root.add(body);
  const head=mk(new THREE.SphereGeometry(HR,36,36),mB); head.position.y=HY; root.add(head);
  const eL=mk(new THREE.SphereGeometry(0.058,16,16),mE); eL.scale.set(0.88,1.10,0.52); eL.position.set(-0.115,HY+0.03,HR*0.92); root.add(eL);
  const eR=mk(new THREE.SphereGeometry(0.058,16,16),mE); eR.scale.set(0.88,1.10,0.52); eR.position.set( 0.115,HY+0.03,HR*0.92); root.add(eR);
  const apL=new THREE.Group(); apL.position.set(APX,APY,0); root.add(apL);
  const amL=mk(new THREE.CapsuleGeometry(HAND,CAP_H,8,16),mB); amL.position.x=-REACH/2; amL.rotation.z=Math.PI/2; apL.add(amL);
  const apR=new THREE.Group(); apR.position.set(-APX,APY,0); root.add(apR);
  const amR=mk(new THREE.CapsuleGeometry(HAND,CAP_H,8,16),mB); amR.position.x=REACH/2; amR.rotation.z=Math.PI/2; apR.add(amR);
  const lpL=new THREE.Group(); lpL.position.set(-0.145,HIPY,0); root.add(lpL);
  const lmL=mk(new THREE.CapsuleGeometry(LR,LH,10,20),mB); lmL.position.y=LOY; lpL.add(lmL);
  const lpR=new THREE.Group(); lpR.position.set( 0.145,HIPY,0); root.add(lpR);
  const lmR=mk(new THREE.CapsuleGeometry(LR,LH,10,20),mB); lmR.position.y=LOY; lpR.add(lmR);
  const coin=mk(new THREE.CylinderGeometry(0.11,0.11,0.025,24),mC); coin.visible=false; root.add(coin);
  const P=Math.PI;
  const c01=v=>Math.max(0,Math.min(1,v));
  const rm=(v,a,b)=>c01((v-a)/(b-a));
  const lrp=(a,b,t)=>a+(b-a)*t;
  const eO=t=>1-(1-t)*(1-t);
  const eI=t=>t*t;
  function rp(){
    root.position.set(0,0,0); root.rotation.set(0,0,0);
    body.scale.set(1,1,1); head.position.y=HY; head.rotation.set(0,0,0);
    eL.scale.set(0.88,1.10,0.52); eR.scale.set(0.88,1.10,0.52);
    apL.position.set(APX,APY,0); apL.rotation.set(0,0,0);
    apR.position.set(-APX,APY,0); apR.rotation.set(0,0,0);

  function aIdle(t){
    const ph=(t%2)*P*2, s=Math.sin(ph);
    root.position.y=Math.max(0,s)*0.030;
    const br=s*0.013; body.scale.set(1-br*0.4,1+br,1-br*0.4);
    apL.rotation.z=Math.sin(ph*0.5)*0.06; apR.rotation.z=-Math.sin(ph*0.5)*0.06;
  }
  function aWalk(t){
    const ph=(t%1)*P*2;
    root.position.y=Math.abs(Math.sin(ph))*0.050; root.rotation.x=0.05;
    lpL.rotation.x=Math.sin(ph)*0.38; lpR.rotation.x=Math.sin(ph+P)*0.38;
    apL.rotation.y=Math.sin(ph+P)*0.30; apR.rotation.y=Math.sin(ph)*0.30;
  }
  function aFlip(t){
    const n=(t%1.4)/1.4, P1=0.25, P2=0.50, P3=0.82, GZ=0.55, SZ=P*0.82;
    body.scale.set(1,1,1); lpL.rotation.set(0,0,0); lpR.rotation.set(0,0,0);
    let zL=0, zR=0, lu=0;
    if(n<P1){
      const p=eO(rm(n,0,P1)); zL=p*GZ; zR=-p*GZ;
      coin.visible=p>0.55; coin.position.set(0,-0.08,0.28); coin.rotation.set(0,0,0);
    } else if(n<P2){
      const p=eI(rm(n,P1,P2)); zL=lrp(GZ,-SZ,p); zR=lrp(-GZ,SZ,p);
      const lP=rm(n,lrp(P1,P2,0.4),P2);
      coin.visible=true;
      if(lP>0){ coin.position.set(0,lrp(-0.08,0.60,eO(lP)),0.28); coin.rotation.y=lP*P*4; coin.rotation.x=P/2; }
      else coin.position.set(0,-0.08,0.28);

      zL=-SZ; zR=SZ;
      const p=rm(n,P2,P3); lu=-eO(Math.min(p*2.2,1))*0.26;
      coin.visible=true; const arc=Math.sin(p*P);

    } else {

  }
  function aSleep(t){

    eL.scale.set(0.88,0.08,0.52); eR.scale.set(0.88,0.08,0.52);
    apL.rotation.z=0.45; apR.rotation.z=-0.45;
    lpL.rotation.x=-0.12; lpR.rotation.x=-0.12;
    root.rotation.z=-0.32+Math.sin(ph*0.5)*0.025;
  }
  function draw(ctx,cx,cy,state,angle){
    const t=performance.now()/1000;

    else if(state==='flipcoin') aFlip(t);

    ctx.filter='drop-shadow(0 2px 0 #000) drop-shadow(0 -2px 0 #000) drop-shadow(2px 0 0 #000) drop-shadow(-2px 0 0 #000)';
    ctx.drawImage(oc, Math.round(cx-30), Math.round(cy-35), 60, 78);
    ctx.filter='none';
  }
  return {draw};
})();

// HELPER NPC
// ═══════════════════════════════════════════════════════
class Helper {
  constructor(idx) {
    this.x=rf(PLAY_X1+20,PLAY_X2-20); this.y=rf(PLAY_Y1+20,PLAY_Y2-20);
    this.target=null; this.flipTimer=Math.random(); this.walkBob=Math.random()*Math.PI*2;
    this.flipAnim=0; this.facingAngle=0;
    this.sleepTimer=Math.random()*10; this.sleeping=false; this.zzzPhase=Math.random()*Math.PI*2;
  }
  update(dt,coins,gs) {
    // 睡眠系統
    const hwLvl=gs.upgradeLevels?.['hard_worker']||0;
    const sleepInterval=hwLvl>=20?Infinity:30+hwLvl*15;
    if(this.sleeping){this.zzzPhase+=dt;return;}
    this.sleepTimer+=dt;
    if(this.sleepTimer>=sleepInterval){
      this.sleeping=true;this.sleepTimer=0;
      if(this.target){this.target.targeted=false;this.target=null;}
      return;
    }
    if(!this.target||this.target.state!=='idle'){
      const swLvl=gs.upgradeLevels?.['strong_worker']||0;
      const allIdle=coins.filter(c=>c.state==='idle'&&!c.targeted);
      let idle=allIdle;
      if(swLvl>0&&allIdle.length){
        for(let i=Math.min(swLvl,COIN_ORDER.length-1);i>0;i--){
          const pref=allIdle.filter(c=>c.type===COIN_ORDER[i]);
          if(pref.length){idle=pref;break;}
        }
      }
      if(idle.length){this.target=idle[Math.floor(Math.random()*idle.length)];this.target.targeted=true;}
      else this.target=null;
    }
    if(this.target){
      const dx=this.target.x-this.x,dy=this.target.y-this.y,dist=Math.hypot(dx,dy);
      const spd=gs.helperMoveSpeed();
      if(dist>2){
        const step=Math.min(spd*dt,dist);
        this.x+=dx/dist*step; this.y+=dy/dist*step;
        this.walkBob+=dt*9;
        this.facingAngle=Math.atan2(dx,dy);
      }
      if(dist<22){
        this.flipTimer+=dt;
        if(this.flipTimer>=gs.helperInterval()){
          this.flipTimer=0;
          if(this.target.state==='idle'&&this.target.triggerFlip(gs,false)) this.flipAnim=.55;
          this.target.targeted=false; this.target=null;
          if(gs.computeStats().doubleFlip){
            const ex=coins.filter(c=>c.state==='idle'&&!c.targeted);
            if(ex.length) ex[0].triggerFlip(gs,false);
          }
        }
      }
    } else this.flipTimer+=dt;
    if(this.flipAnim>0) this.flipAnim-=dt;
  }
  draw() {
    const cx=Math.round(this.x), cy=Math.round(this.y);
    let state='idle';
    if(this.sleeping) state='sleep';
    else if(this.flipAnim>0) state='flipcoin';
    else if(this.target) state='walk';
    if(_h3) _h3.draw(ctx,cx,cy,state,this.facingAngle||0);
    if(this.sleeping){
      const t=this.zzzPhase;
      ['z','z','Z'].forEach((ch,i)=>{
        const sz=8+i*4,ox=cx-18-i*7,oy=cy-32-i*7+Math.sin(t*1.4+i*1.1)*4;
        ctx.globalAlpha=0.4+0.5*Math.abs(Math.sin(t*.85+i*.9));
        ctx.fillStyle='#7aafff'; ctx.font=`bold ${sz}px sans-serif`;
        ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillText(ch,ox,oy);
      });
      ctx.globalAlpha=1;
      return;
    }
    if(this.flipAnim>0){
      const t=Date.now()/1e3;
      for(let i=0;i<6;i++){
        const a=(i*60+t*180)*Math.PI/180, sr=22+4*Math.sin(t*7+i);
        ctx.fillStyle=i%2?'#ffdc3c':'#ff8c3c';
        ctx.beginPath(); ctx.arc(cx+sr*Math.cos(a),cy+sr*Math.sin(a),3,0,Math.PI*2); ctx.fill();
      }
    }
  }
}

// UTILS
// ═══════════════════════════════════════════════════════
function ri(a,b){return Math.floor(a+Math.random()*(b-a));}
function rf(a,b){return a+Math.random()*(b-a);}
function rgb(r,g,b){return `rgb(${Math.max(0,Math.round(r))},${Math.max(0,Math.round(g))},${Math.max(0,Math.round(b))})`;}
function ellipse(x,y,rx,ry,col){if(col)ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y,Math.max(.5,rx),Math.max(.5,ry),0,0,Math.PI*2);ctx.fill();}
function serrPath(ctx_,cx,cy,rx,ry,teeth,depth){
  const n=teeth*2, dy=depth*(ry/rx);
  ctx_.beginPath();
  for(let i=0;i<n;i++){
    const a=(i/n)*Math.PI*2-Math.PI/2;
    const ot=i%2===0;
    const x=cx+Math.cos(a)*(ot?rx+depth:rx);
    const y=cy+Math.sin(a)*(ot?ry+dy:ry);
    i===0?ctx_.moveTo(x,y):ctx_.lineTo(x,y);
  }
  ctx_.closePath();
}
function rRect(x,y,w,h,r,fill,stroke,lw=1){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}}
function fmt(n){if(n<1e3)return'$'+n.toFixed(0);if(n>=1e12)return'$'+(n/1e12).toFixed(2)+'T';if(n>=1e9)return'$'+(n/1e9).toFixed(2)+'B';if(n>=1e6)return'$'+(n/1e6).toFixed(2)+'M';return'$'+(n/1e3).toFixed(2)+'K';}

// BACKGROUND CACHE
// ═══════════════════════════════════════════════════════
let bgCache=null;
let borderCoins=[];

const BC_ZONES=[
  [0,           HUD_H+BORDER_W, BORDER_W,          H-BORDER_W],
  [GAME_W-BORDER_W, HUD_H+BORDER_W, GAME_W,        H-BORDER_W],
  [BORDER_W,    HUD_H,          GAME_W-BORDER_W,    HUD_H+BORDER_W],
  [BORDER_W,    H-BORDER_W,     GAME_W-BORDER_W,    H],
];
const BC_R=7;
const BC_TYPES=['copper','silver','skull','gold','platinum'];

function initBorderCoins(){
  borderCoins=[];
  const counts=[5,5,8,7];
  for(let z=0;z<4;z++){
    const [x1,y1,x2,y2]=BC_ZONES[z];
    for(let i=0;i<counts[z];i++){
      const spd=14+Math.random()*18, ang=Math.random()*Math.PI*2;
      borderCoins.push({
        x:x1+BC_R+Math.random()*(x2-x1-BC_R*2),
        y:y1+BC_R+Math.random()*(y2-y1-BC_R*2),
        vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd,
        type:BC_TYPES[Math.floor(Math.random()*BC_TYPES.length)],
        phase:Math.random()*Math.PI*2, z
      });
    }
  }
}

function drawBorderCoins(dt){
  for(const bc of borderCoins){
    bc.x+=bc.vx*dt; bc.y+=bc.vy*dt; bc.phase+=dt*1.8;
    const [x1,y1,x2,y2]=BC_ZONES[bc.z];
    if(bc.x<x1+BC_R){bc.x=x1+BC_R;bc.vx=Math.abs(bc.vx);}
    if(bc.x>x2-BC_R){bc.x=x2-BC_R;bc.vx=-Math.abs(bc.vx);}
    if(bc.y<y1+BC_R){bc.y=y1+BC_R;bc.vy=Math.abs(bc.vy);}
    if(bc.y>y2-BC_R){bc.y=y2-BC_R;bc.vy=-Math.abs(bc.vy);}
    const [R,G,B]=COIN_COL[bc.type],[DR,DG,DB]=COIN_DARK[bc.type];
    const al=0.5+Math.sin(bc.phase)*0.15;
    ctx.save(); ctx.globalAlpha=al;
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.beginPath();ctx.ellipse(bc.x+1,bc.y+2,BC_R,BC_R*.35,0,0,Math.PI*2);ctx.fill();
    const g=ctx.createRadialGradient(bc.x-BC_R*.35,bc.y-BC_R*.35,0,bc.x,bc.y,BC_R*1.1);
    g.addColorStop(0,`rgb(${Math.min(255,R+45)},${Math.min(255,G+45)},${Math.min(255,B+45)})`);
    g.addColorStop(.5,`rgb(${R},${G},${B})`);
    g.addColorStop(1,`rgb(${DR},${DG},${DB})`);
    ctx.fillStyle=g; serrPath(ctx,bc.x,bc.y,BC_R,BC_R,10,1.5); ctx.fill();
    ctx.globalAlpha=al*.7;
    ctx.fillStyle=`rgb(${Math.max(0,DR-20)},${Math.max(0,DG-20)},${Math.max(0,DB-20)})`;
    ctx.font=`bold 8px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(COIN_SYM[bc.type]||'$',bc.x,bc.y+1);
    ctx.restore();
  }
}
function buildCoinTile(){
  const SCALE=0.72;
  const r=COIN_R*SCALE, fw=Math.round(r*2), fh=Math.max(3,Math.round(fw*0.36));
  const THICK=Math.max(2,Math.round(5*SCALE));
  const COL_W=fw, ROW_H=fh+THICK;
  const COLS=10, ROWS=Math.ceil(320/ROW_H)+2;
  const SW=COL_W*COLS, SH=ROW_H*ROWS;

  const off=new OffscreenCanvas(SW,SH);
  const c=off.getContext('2d');
  c.fillStyle='#060503';c.fillRect(0,0,SW,SH);

  const TYPES=['copper','silver','skull','gold','platinum'];

  const drawCoin=(cx,cy,type)=>{
    const[R,G,B]=COIN_COL[type],[DR,DG,DB]=COIN_DARK[type];
    const col=rgb(R,G,B),dark=rgb(DR,DG,DB),
          dk=rgb(Math.max(0,DR-30),Math.max(0,DG-30),Math.max(0,DB-30)),
          hi=rgb(Math.min(255,R+38),Math.min(255,G+38),Math.min(255,B+38));
    const el=(ex,ey,rx,ry,fill)=>{c.fillStyle=fill;c.beginPath();c.ellipse(ex,ey,Math.max(.5,rx),Math.max(.5,ry),0,0,Math.PI*2);c.fill();};
    const ser=(ex,ey,rx,ry,fill)=>{c.fillStyle=fill;serrPath(c,ex,ey,Math.max(1,rx),Math.max(1,ry),10,1.5);c.fill();};
    ser(cx,cy+THICK,   fw/2,fh/2,dk);
    ser(cx,cy+THICK/2, fw/2,fh/2,dark);
    ser(cx,cy,         fw/2,fh/2,col);
    el(cx-1,cy-fh/2+Math.max(1,Math.round(fh*.2)),Math.max(2,(fw-8)/2),Math.max(1,Math.round(fh*.2)),hi);
    c.strokeStyle=dark;c.lineWidth=1;
    c.beginPath();c.ellipse(cx,cy,Math.max(.5,fw/2-2),Math.max(.5,fh/2-1),0,0,Math.PI*2);c.stroke();
    c.fillStyle=rgb(Math.max(0,DR-20),Math.max(0,DG-20),Math.max(0,DB-20));
    c.font=`bold ${Math.max(5,Math.round(fh*.9))}px sans-serif`;
    c.textAlign='center';c.textBaseline='middle';
    c.fillText(COIN_SYM[type]||'$',cx,cy);
  };

  // 畫一整層格子，yBase=Y偏移，xBase=X偏移，typeOff=幣種偏移
  const drawGrid=(yBase,xBase,typeOff)=>{
    for(let row=-1;row<ROWS+1;row++){
      const cy=row*ROW_H+fh/2+yBase;
      if(cy+THICK+fh/2<0||cy-fh/2>SH) continue;
      const xOff=(row%2+2)%2*(COL_W/2)+xBase;
      for(let col=-1;col<COLS+2;col++){
        const cx=col*COL_W+xOff;
        if(cx+fw/2<0||cx-fw/2>=SW) continue;
        const t=TYPES[(Math.abs(row)*2+Math.abs(col)*3+typeOff)%5];
        drawCoin(cx,cy,t);
      }
    }
  };

  const ELEV=Math.round(fh/2+THICK+2); // 第二層比第一層高出的像素
  // 第一層（底層）：往下偏移 ELEV，讓第二層疊上來後還看得見底層邊緣
  drawGrid(ELEV, 0, 0);
  // 第二層（上層）：不同 X 位置，疊在第一層上面
  drawGrid(0, Math.round(COL_W/2), 2);

  return off;
}

function buildBG() {
  const off=new OffscreenCanvas(W,H); const c=off.getContext('2d');
  const cx1=CARPET_X1,cx2=CARPET_X2,cy1=PLAY_Y1-6,cy2=PLAY_Y2+6,cw=cx2-cx1,ch=cy2-cy1;
  const tbl=(typeof gs!=='undefined'&&gs.selectedTable)||'classic';

  if(tbl==='classic'){
    // ── 賭桌：實木邊框 + 紅色絨毯 ──
    const WC=['#4a1e08','#5a2810','#3e1806'];
    for(const [rx,ry,rw,rh] of [[0,0,BORDER_W,H],[GAME_W-BORDER_W,0,BORDER_W,H],[0,HUD_H,GAME_W,BORDER_W],[0,H-BORDER_W,GAME_W,BORDER_W]]){
      c.fillStyle=WC[0];c.fillRect(rx,ry,rw,rh);
      for(let bx=rx;bx<rx+rw;bx+=8){c.strokeStyle=WC[(Math.floor(bx/8))%3];c.lineWidth=1;c.beginPath();c.moveTo(bx,ry);c.lineTo(bx,ry+rh);c.stroke();}
      c.strokeStyle='#8a5020';c.lineWidth=2;c.strokeRect(rx+3,ry+3,rw-6,rh-6);
    }
    // 銅角
    for(const [bx,by] of [[0,HUD_H],[GAME_W-BORDER_W,HUD_H],[0,H-BORDER_W],[GAME_W-BORDER_W,H-BORDER_W]]){
      c.fillStyle='#b08030';c.fillRect(bx,by,BORDER_W,BORDER_W);
      c.strokeStyle='#d4a840';c.lineWidth=1.5;c.strokeRect(bx+3,by+3,BORDER_W-6,BORDER_W-6);
      c.beginPath();c.moveTo(bx+6,by+6);c.lineTo(bx+BORDER_W-6,by+BORDER_W-6);c.stroke();
      c.beginPath();c.moveTo(bx+BORDER_W-6,by+6);c.lineTo(bx+6,by+BORDER_W-6);c.stroke();
    }
    // 紅色絨毯
    c.fillStyle='rgba(0,0,0,.28)';c.fillRect(cx1+3,cy1+5,cw+8,ch+8);

    for(let fy=cy1;fy<cy2;fy+=5){c.fillStyle=Math.floor(fy/5)%2===0?'#711721':'#671117';c.fillRect(cx1,fy,cw,1);}
    c.strokeStyle='rgba(200,80,80,0.2)';c.lineWidth=1;
    for(let fy=cy1;fy<cy2+40;fy+=40)for(let fx=cx1;fx<cx2+40;fx+=40){const hw=14,mx2=fx+20,my2=fy+20;c.beginPath();c.moveTo(mx2,my2-hw);c.lineTo(mx2+hw,my2);c.lineTo(mx2,my2+hw);c.lineTo(mx2-hw,my2);c.closePath();c.stroke();}
    const grd=c.createRadialGradient(cx1+cw/2,cy1+ch/2,0,cx1+cw/2,cy1+ch/2,Math.max(cw,ch)*.6);
    grd.addColorStop(0,'rgba(220,40,30,.16)');grd.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=grd;c.fillRect(cx1,cy1,cw,ch);
    c.strokeStyle='#c39828';c.lineWidth=2;c.strokeRect(cx1,cy1,cw,ch);
    c.strokeStyle='#96702088';c.lineWidth=1;c.strokeRect(cx1+8,cy1+8,cw-16,ch-16);
    for(let i=1;i<=18;i++){
      const t=Math.pow(i/18,.6),r2=Math.round(165*(1-t)+40*t),g2=Math.round(52*(1-t)+5*t),b2=Math.round(60*(1-t)+8*t);
      c.strokeStyle=`rgb(${r2},${g2},${b2})`;c.lineWidth=1;
      if(cx1-i>=BORDER_W){c.beginPath();c.moveTo(cx1-i,cy1);c.lineTo(cx1-i,cy2);c.stroke();}

    for(let i=0;i<7;i++){c.strokeStyle=`rgba(0,0,0,${.22-.02*i})`;c.lineWidth=1;['moveTo','lineTo'].forEach(()=>{});
      c.beginPath();c.moveTo(cx1+i,cy1);c.lineTo(cx1+i,cy2);c.stroke();c.beginPath();c.moveTo(cx2-i,cy1);c.lineTo(cx2-i,cy2);c.stroke();
      c.beginPath();c.moveTo(cx1,cy1+i);c.lineTo(cx2,cy1+i);c.stroke();c.beginPath();c.moveTo(cx1,cy2-i);c.lineTo(cx2,cy2-i);c.stroke();}
    for(const [bx,by,sx,sy] of [[cx1,cy1,1,1],[cx2,cy1,-1,1],[cx1,cy2,1,-1],[cx2,cy2,-1,-1]]){
      const hx=sx>0?bx:bx-52,hy=sy>0?by:by-10;
      c.fillStyle='#98741a';c.fillRect(hx,hy,52,10);c.fillStyle='#c69b2c';c.fillRect(hx,hy,52,7);c.fillStyle='#ebc041';c.fillRect(hx+1,hy+1,50,2);
      const vx=sx>0?bx:bx-10,vy=sy>0?by:by-52;
      c.fillStyle='#98741a';c.fillRect(vx,vy,10,52);c.fillStyle='#c69b2c';c.fillRect(vx,vy,7,52);c.fillStyle='#ebc041';c.fillRect(vx+1,vy+1,2,50);
      const sqx=sx>0?bx:bx-10,sqy=sy>0?by:by-10;
      c.fillStyle='#ebc041';c.fillRect(sqx,sqy,10,10);c.strokeStyle='#98741a';c.lineWidth=1;c.strokeRect(sqx,sqy,10,10);
    }

  }else if(tbl==='billiard'){
    // ── 撞球桌：實木邊框 + 亮綠毯 + 6個球袋 ──
    // 實木框（桃花心木）
    const WC=['#4a1e08','#5a2810','#3e1806'];
    for(const [rx,ry,rw,rh] of [[0,0,BORDER_W,H],[GAME_W-BORDER_W,0,BORDER_W,H],[0,HUD_H,GAME_W,BORDER_W],[0,H-BORDER_W,GAME_W,BORDER_W]]){
      c.fillStyle=WC[0];c.fillRect(rx,ry,rw,rh);
      for(let bx=rx;bx<rx+rw;bx+=8){c.strokeStyle=WC[(Math.floor(bx/8))%3];c.lineWidth=1;c.beginPath();c.moveTo(bx,ry);c.lineTo(bx,ry+rh);c.stroke();}
      c.strokeStyle='#8a5020';c.lineWidth=2;c.strokeRect(rx+3,ry+3,rw-6,rh-6);
    }
    // 銅角
    for(const [bx,by] of [[0,HUD_H],[GAME_W-BORDER_W,HUD_H],[0,H-BORDER_W],[GAME_W-BORDER_W,H-BORDER_W]]){
      c.fillStyle='#b08030';c.fillRect(bx,by,BORDER_W,BORDER_W);
      c.strokeStyle='#d4a840';c.lineWidth=1.5;c.strokeRect(bx+3,by+3,BORDER_W-6,BORDER_W-6);
      c.beginPath();c.moveTo(bx+6,by+6);c.lineTo(bx+BORDER_W-6,by+BORDER_W-6);c.stroke();
      c.beginPath();c.moveTo(bx+BORDER_W-6,by+6);c.lineTo(bx+6,by+BORDER_W-6);c.stroke();
    }
    // 橡皮護墊（圍繞球袋）
    c.fillStyle='#2a1008';c.fillRect(cx1-14,cy1-14,cw+28,ch+28);
    c.fillStyle='#1e0c04';c.fillRect(cx1-10,cy1-10,cw+20,ch+20);
    // 亮綠絨毯
    c.fillStyle='#0d5e18';c.fillRect(cx1,cy1,cw,ch);
    for(let fy=cy1;fy<cy2;fy+=4){c.fillStyle=Math.floor(fy/4)%2===0?'#0e6619':'#0c5616';c.fillRect(cx1,fy,cw,2);}
    // 中線 + 中心圓 + 丁字線
    c.strokeStyle='rgba(255,255,255,0.25)';c.lineWidth=1.5;
    c.beginPath();c.moveTo(cx1+cw/2,cy1);c.lineTo(cx1+cw/2,cy2);c.stroke();
    c.beginPath();c.arc(cx1+cw/2,cy1+ch*.25,36,0,Math.PI*2);c.stroke();
    c.beginPath();c.moveTo(cx1,cy1+ch*.25);c.lineTo(cx1+cw/2-36,cy1+ch*.25);c.stroke();
    c.beginPath();c.moveTo(cx1+cw/2+36,cy1+ch*.25);c.lineTo(cx2,cy1+ch*.25);c.stroke();
    const grd2=c.createRadialGradient(cx1+cw/2,cy1+ch/2,0,cx1+cw/2,cy1+ch/2,Math.max(cw,ch)*.55);
    grd2.addColorStop(0,'rgba(255,255,255,.07)');grd2.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=grd2;c.fillRect(cx1,cy1,cw,ch);
    // 6個球袋
    [[cx1,cy1],[cx1+cw/2,cy1],[cx2,cy1],[cx1,cy2],[cx1+cw/2,cy2],[cx2,cy2]].forEach(([px,py])=>{
      c.fillStyle='#080402';c.beginPath();c.arc(px,py,18,0,Math.PI*2);c.fill();
      c.strokeStyle='#b08030';c.lineWidth=2;c.beginPath();c.arc(px,py,18,0,Math.PI*2);c.stroke();
      c.fillStyle='#1a0c04';c.beginPath();c.arc(px,py,13,0,Math.PI*2);c.fill();
    });
    // 護墊外框
    c.strokeStyle='#5a3010';c.lineWidth=3;c.strokeRect(cx1-10,cy1-10,cw+20,ch+20);
    c.strokeStyle='#8a5828';c.lineWidth=1;c.strokeRect(cx1-7,cy1-7,cw+14,ch+14);
    // ── 撞球裝飾（15顆）──
    const BCOL=['#e8c820','#1850c0','#c02020','#7820a0','#d06010','#1a8030','#881020','#101010'];
    // [rx, ry, ball number]  三角形陣列 + 散落
    const BPOS=[[0.20,0.52,1],[0.27,0.47,2],[0.27,0.57,3],[0.34,0.42,4],[0.34,0.52,5],
                [0.34,0.62,6],[0.41,0.37,7],[0.41,0.47,8],[0.41,0.57,9],[0.41,0.67,10],
                [0.65,0.70,11],[0.72,0.35,12],[0.80,0.58,13],[0.55,0.20,14],[0.12,0.65,15]];
    const BR2=15;

      const bx=cx1+cw*rx, by=cy1+ch*ry;
      const isStripe=num>=9;
      const col=BCOL[(num-1)%8];
      c.fillStyle='rgba(0,0,0,0.38)';c.beginPath();c.ellipse(bx+3,by+5,BR2,BR2*0.42,0,0,Math.PI*2);c.fill();
      if(isStripe){
        c.fillStyle='#f0eeea';c.beginPath();c.arc(bx,by,BR2,0,Math.PI*2);c.fill();
        c.save();c.beginPath();c.arc(bx,by,BR2,0,Math.PI*2);c.clip();
        c.fillStyle=col;c.fillRect(bx-BR2,by-BR2*0.44,BR2*2,BR2*0.88);c.restore();
      }else{
        c.fillStyle=col;c.beginPath();c.arc(bx,by,BR2,0,Math.PI*2);c.fill();
      }
      const sh=c.createRadialGradient(bx-BR2*0.38,by-BR2*0.38,0,bx,by,BR2);
      sh.addColorStop(0,'rgba(255,255,255,0.58)');sh.addColorStop(0.5,'rgba(255,255,255,0.10)');sh.addColorStop(1,'rgba(0,0,0,0)');
      c.fillStyle=sh;c.beginPath();c.arc(bx,by,BR2,0,Math.PI*2);c.fill();
      c.fillStyle='rgba(255,255,255,0.90)';c.beginPath();c.arc(bx,by,BR2*0.36,0,Math.PI*2);c.fill();
      c.fillStyle='#111';c.font=`bold ${num>=10?7:8}px sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(num,bx,by+0.5);
      c.strokeStyle='rgba(0,0,0,0.22)';c.lineWidth=1;c.beginPath();c.arc(bx,by,BR2,0,Math.PI*2);c.stroke();
    }

  }else if(tbl==='poker'){
    // ── 撲克桌：金色石磚邊框 + 皮革圓邊 + 深紫絨毯 + 花色符號 ──
    // 金色石磚邊框
    for(const [rx,ry,rw,rh] of [[0,0,BORDER_W,H],[GAME_W-BORDER_W,0,BORDER_W,H],[0,HUD_H,GAME_W,BORDER_W],[0,H-BORDER_W,GAME_W,BORDER_W]]){
      const g=c.createLinearGradient(rx,ry,rx+rw,ry+rh);g.addColorStop(0,'#1a1410');g.addColorStop(0.5,'#2c2018');g.addColorStop(1,'#1a1410');

      c.strokeStyle='#e0c050';c.lineWidth=2;c.beginPath();c.arc(bx+BORDER_W/2,by+BORDER_W/2,BORDER_W/2-4,0,Math.PI*2);c.stroke();
      c.strokeStyle='#a07820';c.lineWidth=1;c.beginPath();c.arc(bx+BORDER_W/2,by+BORDER_W/2,BORDER_W/2-8,0,Math.PI*2);c.stroke();
    }
    // 皮革護墊（橢圓形桌緣感）
    c.fillStyle='#1a0a14';c.fillRect(cx1-16,cy1-16,cw+32,ch+32);
    for(let i=0;i<8;i++){c.strokeStyle=`rgba(80,20,50,${0.6-i*.07})`;c.lineWidth=2;c.strokeRect(cx1-16+i*1.5,cy1-16+i*1.5,cw+32-i*3,ch+32-i*3);}
    c.strokeStyle='#8c3060';c.lineWidth=1;c.strokeRect(cx1-6,cy1-6,cw+12,ch+12);

    c.fillStyle='#280a44';c.fillRect(cx1,cy1,cw,ch);
    for(let fy=cy1;fy<cy2;fy+=5){c.fillStyle=Math.floor(fy/5)%2===0?'#2c0c4c':'#240940';c.fillRect(cx1,fy,cw,2);}
    // 菱形花紋
    c.strokeStyle='rgba(160,80,220,0.18)';c.lineWidth=1;
    for(let fy=cy1;fy<cy2+40;fy+=40)for(let fx=cx1;fx<cx2+40;fx+=40){
      const hw=14,mx2=fx+20,my2=fy+20;c.beginPath();c.moveTo(mx2,my2-hw);c.lineTo(mx2+hw,my2);c.lineTo(mx2,my2+hw);c.lineTo(mx2-hw,my2);c.closePath();c.stroke();
    }
    // 四個角落花色符號
    c.font='28px sans-serif';c.textBaseline='middle';c.textAlign='center';
    [['♠',cx1+36,cy1+36,'#1818c0'],['♥',cx2-36,cy1+36,'#c01818'],['♦',cx1+36,cy2-36,'#c01818'],['♣',cx2-36,cy2-36,'#1818c0']].forEach(([sym,sx,sy,col])=>{
      c.fillStyle=col+'50';c.fillText(sym,sx,sy);
    });
    // 中央橢圓裝飾
    c.strokeStyle='rgba(200,100,255,0.15)';c.lineWidth=2;
    c.beginPath();c.ellipse(cx1+cw/2,cy1+ch/2,cw/3,ch/3,0,0,Math.PI*2);c.stroke();
    const grd3=c.createRadialGradient(cx1+cw/2,cy1+ch/2,0,cx1+cw/2,cy1+ch/2,Math.max(cw,ch)*.55);
    grd3.addColorStop(0,'rgba(180,100,255,.1)');grd3.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=grd3;c.fillRect(cx1,cy1,cw,ch);
    c.strokeStyle='#c8a030';c.lineWidth=2;c.strokeRect(cx1,cy1,cw,ch);
    c.strokeStyle='rgba(200,160,50,0.4)';c.lineWidth=1;c.strokeRect(cx1+8,cy1+8,cw-16,ch-16);
    // ── 散落的撲克牌裝飾 ──
    const pr=(x,y,w,h,r)=>{c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.arcTo(x+w,y,x+w,y+r,r);c.lineTo(x+w,y+h-r);c.arcTo(x+w,y+h,x+w-r,y+h,r);c.lineTo(x+r,y+h);c.arcTo(x,y+h,x,y+h-r,r);c.lineTo(x,y+r);c.arcTo(x,y,x+r,y,r);c.closePath();};
    const dc=(ccx,ccy,rank,suit,ang,fd)=>{
      const cw2=30,ch2=42,rd=3;

      }else{
        const isRed=suit==='♥'||suit==='♦';

        c.font='7px sans-serif';c.fillText(suit,-cw2/2+6,-ch2/2+15);
        c.restore();
      }
      c.restore();
    }
    // [rx, ry, 角度, 數字, 花色, 牌背]
    c.globalAlpha=0.82;
    [[0.10,0.17,-0.38,'A','♠',false],[0.24,0.09, 0.22,'K','♥',false],[0.44,0.11,-0.12,'Q','♦',false],
     [0.66,0.09, 0.38,'J','♣',false],[0.84,0.19,-0.28,'10','♥',false],[0.91,0.45, 0.16,'9','♠',false],
     [0.83,0.71,-0.30,'8','♦',false],[0.63,0.85, 0.44,'7','♣',false],[0.37,0.86,-0.20,'6','♥',false],
     [0.13,0.77, 0.34,'5','♠',false],[0.05,0.51,-0.42,'4','♦',false],[0.91,0.67,-0.16,'3','♣',false],
     [0.30,0.44, 0.08,'2','♥',false],[0.70,0.44,-0.18,'A','♦',false],
     [0.18,0.28, 0.55,'K','♠',true],[0.78,0.28,-0.48,'J','♥',true],[0.50,0.76, 0.50,'Q','♣',true],[0.52,0.09,-0.06,'2','♣',true]
    ].forEach(([rx,ry,ang,rank,suit,fd])=>dc(cx1+cw*rx,cy1+ch*ry,rank,suit,ang,fd));
    c.globalAlpha=1;

  }else if(tbl==='dice'){
    // ── 骰子桌：金屬邊框 + 深藍毯 + 押注區格線 ──
    // 金屬邊框（鉻色）
    for(const [rx,ry,rw,rh] of [[0,0,BORDER_W,H],[GAME_W-BORDER_W,0,BORDER_W,H],[0,HUD_H,GAME_W,BORDER_W],[0,H-BORDER_W,GAME_W,BORDER_W]]){
      const g2=c.createLinearGradient(rx,ry,rx+rw,ry+rh);
      g2.addColorStop(0,'#1c1c2a');g2.addColorStop(0.4,'#2e2e46');g2.addColorStop(0.6,'#1a1a28');g2.addColorStop(1,'#0e0e1c');
      c.fillStyle=g2;c.fillRect(rx,ry,rw,rh);
      c.strokeStyle='#4040a0';c.lineWidth=2;c.strokeRect(rx+2,ry+2,rw-4,rh-4);
      c.strokeStyle='#8080e0';c.lineWidth=0.5;c.strokeRect(rx+4,ry+4,rw-8,rh-8);
    }
    // 角落金屬螺絲
    for(const [bx,by] of [[0,HUD_H],[GAME_W-BORDER_W,HUD_H],[0,H-BORDER_W],[GAME_W-BORDER_W,H-BORDER_W]]){
      const cg=c.createRadialGradient(bx+BORDER_W/2,by+BORDER_W/2,2,bx+BORDER_W/2,by+BORDER_W/2,BORDER_W/2);
      cg.addColorStop(0,'#6060c0');cg.addColorStop(1,'#1a1a38');
      c.fillStyle=cg;c.fillRect(bx,by,BORDER_W,BORDER_W);
      c.strokeStyle='#8080d0';c.lineWidth=1.5;c.beginPath();c.arc(bx+BORDER_W/2,by+BORDER_W/2,BORDER_W/2-4,0,Math.PI*2);c.stroke();
      c.strokeStyle='#4040a0';c.lineWidth=2;c.beginPath();c.moveTo(bx+8,by+BORDER_W/2);c.lineTo(bx+BORDER_W-8,by+BORDER_W/2);c.stroke();
      c.beginPath();c.moveTo(bx+BORDER_W/2,by+8);c.lineTo(bx+BORDER_W/2,by+BORDER_W-8);c.stroke();
    }
    // 金屬護條
    c.fillStyle='#0e0e22';c.fillRect(cx1-12,cy1-12,cw+24,ch+24);
    c.strokeStyle='#4040a0';c.lineWidth=3;c.strokeRect(cx1-12,cy1-12,cw+24,ch+24);
    c.strokeStyle='#8080e0';c.lineWidth=1;c.strokeRect(cx1-8,cy1-8,cw+16,ch+16);
    // 深藍絨毯
    c.fillStyle='#06061c';c.fillRect(cx1,cy1,cw,ch);
    for(let fy=cy1;fy<cy2;fy+=4){c.fillStyle=Math.floor(fy/4)%2===0?'#08081e':'#04041a';c.fillRect(cx1,fy,cw,2);}
    // 押注區格線
    c.strokeStyle='rgba(120,120,255,0.45)';c.lineWidth=1.5;
    const zoneW=cw/3;
    for(let z=1;z<3;z++){c.beginPath();c.moveTo(cx1+zoneW*z,cy1+10);c.lineTo(cx1+zoneW*z,cy2-10);c.stroke();}
    c.beginPath();c.moveTo(cx1+10,cy1+ch/2);c.lineTo(cx2-10,cy1+ch/2);c.stroke();
    // 格內標示點
    c.fillStyle='rgba(100,100,220,0.35)';
    [[0.17,0.28],[0.5,0.28],[0.83,0.28],[0.17,0.72],[0.5,0.72],[0.83,0.72]].forEach(([fx,fy])=>{
      c.beginPath();c.arc(cx1+cw*fx,cy1+ch*fy,6,0,Math.PI*2);c.fill();
    });
    // 骰子圖案（中央裝飾）
    c.strokeStyle='rgba(150,150,255,0.2)';c.lineWidth=1;
    c.strokeRect(cx1+cw/2-25,cy1+ch/2-25,50,50);
    [[-8,-8],[8,-8],[0,0],[-8,8],[8,8]].forEach(([ox,oy])=>{
      c.fillStyle='rgba(180,180,255,0.25)';c.beginPath();c.arc(cx1+cw/2+ox,cy1+ch/2+oy,4,0,Math.PI*2);c.fill();
    });
    const grd4=c.createRadialGradient(cx1+cw/2,cy1+ch/2,0,cx1+cw/2,cy1+ch/2,Math.max(cw,ch)*.55);
    grd4.addColorStop(0,'rgba(60,60,200,.12)');grd4.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=grd4;c.fillRect(cx1,cy1,cw,ch);
    c.strokeStyle='#5050c0';c.lineWidth=2;c.strokeRect(cx1,cy1,cw,ch);
    c.strokeStyle='rgba(100,100,200,0.4)';c.lineWidth=1;c.strokeRect(cx1+6,cy1+6,cw-12,ch-12);
    // ── 骰子裝飾 ──
    const dd=(dx,dy,face,ang,sz)=>{
      c.save();c.translate(dx,dy);c.rotate(ang);
      const s=sz||34,ht=Math.round(s*0.26),dp=Math.round(s*0.17);
      // 陰影
      c.fillStyle='rgba(0,0,0,0.42)';c.fillRect(-s/2+dp+2,-s/2-ht+3,s,s);
      // 右側面
      c.fillStyle='#9090a0';c.beginPath();c.moveTo(s/2,-s/2);c.lineTo(s/2+dp,-s/2-ht);c.lineTo(s/2+dp,s/2-ht);c.lineTo(s/2,s/2);c.closePath();c.fill();
      c.strokeStyle='rgba(0,0,0,0.28)';c.lineWidth=0.8;c.stroke();
      // 上面
      c.fillStyle='#c0c0cc';c.beginPath();c.moveTo(-s/2,-s/2);c.lineTo(-s/2+dp,-s/2-ht);c.lineTo(s/2+dp,-s/2-ht);c.lineTo(s/2,-s/2);c.closePath();c.fill();c.stroke();
      // 正面
      c.fillStyle='#f0eee8';c.fillRect(-s/2,-s/2,s,s);c.strokeStyle='rgba(0,0,0,0.22)';c.lineWidth=1;c.strokeRect(-s/2,-s/2,s,s);
      c.strokeStyle='rgba(0,0,0,0.10)';c.lineWidth=1.5;c.strokeRect(-s/2+2,-s/2+2,s-4,s-4);
      // 點
      const PIPS={1:[[0,0]],2:[[-0.28,-0.28],[0.28,0.28]],3:[[-0.28,-0.28],[0,0],[0.28,0.28]],
        4:[[-0.28,-0.28],[0.28,-0.28],[-0.28,0.28],[0.28,0.28]],
        5:[[-0.28,-0.28],[0.28,-0.28],[0,0],[-0.28,0.28],[0.28,0.28]],
        6:[[-0.28,-0.28],[0.28,-0.28],[-0.28,0],[0.28,0],[-0.28,0.28],[0.28,0.28]]};
      const pr3=s*0.092;c.fillStyle='#18161e';
      for(const [px,py] of (PIPS[face]||[])){c.beginPath();c.arc(px*s,py*s,pr3,0,Math.PI*2);c.fill();}
      c.restore();
    };
    [[0.10,0.18,5, 0.30,38],[0.30,0.10,2,-0.22,34],[0.60,0.13,6, 0.18,36],
     [0.84,0.20,4,-0.35,34],[0.88,0.68,1, 0.25,38],[0.12,0.72,3,-0.18,36],
     [0.48,0.82,6, 0.42,32],[0.72,0.80,5,-0.28,34],[0.06,0.46,2, 0.15,30]
    ].forEach(([rx,ry,face,ang,sz])=>dd(cx1+cw*rx,cy1+ch*ry,face,ang,sz));

  }else if(tbl==='wood'){
    // ── 原木桌：實木邊框 + 木板桌面 + 中央紅毯 ──
    // 實木框
    const WCw=['#4a1e08','#5a2810','#3e1806'];
    for(const [rx,ry,rw,rh] of [[0,0,BORDER_W,H],[GAME_W-BORDER_W,0,BORDER_W,H],[0,HUD_H,GAME_W,BORDER_W],[0,H-BORDER_W,GAME_W,BORDER_W]]){
      c.fillStyle=WCw[0];c.fillRect(rx,ry,rw,rh);
      for(let bx=rx;bx<rx+rw;bx+=8){c.strokeStyle=WCw[(Math.floor(bx/8))%3];c.lineWidth=1;c.beginPath();c.moveTo(bx,ry);c.lineTo(bx,ry+rh);c.stroke();}
      c.strokeStyle='#8a5020';c.lineWidth=2;c.strokeRect(rx+3,ry+3,rw-6,rh-6);
    }
    // 銅角
    for(const [bx,by] of [[0,HUD_H],[GAME_W-BORDER_W,HUD_H],[0,H-BORDER_W],[GAME_W-BORDER_W,H-BORDER_W]]){
      c.fillStyle='#b08030';c.fillRect(bx,by,BORDER_W,BORDER_W);
      c.strokeStyle='#d4a840';c.lineWidth=1.5;c.strokeRect(bx+3,by+3,BORDER_W-6,BORDER_W-6);
      c.beginPath();c.moveTo(bx+6,by+6);c.lineTo(bx+BORDER_W-6,by+BORDER_W-6);c.stroke();
      c.beginPath();c.moveTo(bx+BORDER_W-6,by+6);c.lineTo(bx+6,by+BORDER_W-6);c.stroke();
    }
    // 底色填充（消除 border 與木板之間的暗色 canvas 空隙）
    c.fillStyle='#200d02';c.fillRect(BORDER_W,HUD_H+BORDER_W,GAME_W-2*BORDER_W,H-HUD_H-2*BORDER_W);
    // 木板桌面（水平木紋板條）
    const plkC=['#4a2208','#5a2c0c','#3e1a04','#522610','#482006','#5e3010','#3c1804'];
    const plkH=22;
    for(let py=cy1;py<cy2;py+=plkH){
      const pi=Math.floor((py-cy1)/plkH);
      c.fillStyle=plkC[pi%plkC.length];
      c.fillRect(cx1,py,cw,Math.min(plkH,cy2-py));
      // 板條分隔線
      c.strokeStyle='rgba(30,8,0,0.4)';c.lineWidth=1.5;
      c.beginPath();c.moveTo(cx1,py);c.lineTo(cx2,py);c.stroke();
      // 板條亮面
      c.strokeStyle='rgba(200,120,40,0.12)';c.lineWidth=1;
      c.beginPath();c.moveTo(cx1,py+2);c.lineTo(cx2,py+2);c.stroke();
    }
    // 木紋波紋（用 sin 決定論式生成）
    c.save();c.beginPath();c.rect(cx1,cy1,cw,ch);c.clip();
    for(let i=0;i<50;i++){
      const gy=cy1+i*(ch/50);
      c.strokeStyle=i%4===0?'rgba(70,20,0,0.13)':'rgba(40,10,0,0.07)';
      c.lineWidth=i%7===0?1.5:0.7;
      c.beginPath();
      for(let x=cx1;x<=cx2;x+=4){
        const y=gy+Math.sin((x-cx1)/55+i*1.2)*6+Math.sin((x-cx1)/22+i*0.9)*2;
        if(x===cx1) c.moveTo(x,y); else c.lineTo(x,y);
      }
      c.stroke();
    }
    // 木節（固定位置）
    [[0.18,0.22],[0.72,0.58],[0.42,0.80],[0.85,0.18]].forEach(([fx,fy])=>{
      const kx=cx1+cw*fx, ky=cy1+ch*fy;
      const kg=c.createRadialGradient(kx,ky,2,kx,ky,20);
      kg.addColorStop(0,'rgba(35,8,0,0.6)');kg.addColorStop(0.6,'rgba(35,8,0,0.2)');kg.addColorStop(1,'rgba(35,8,0,0)');
      c.fillStyle=kg;c.beginPath();c.ellipse(kx,ky,20,14,0.3,0,Math.PI*2);c.fill();
      c.strokeStyle='rgba(45,12,0,0.35)';c.lineWidth=1;
      for(let r=5;r<=18;r+=5){c.beginPath();c.ellipse(kx,ky,r,r*0.7,0.3,0,Math.PI*2);c.stroke();}
    });
    // 整體暗角漸層
    const wgrd=c.createRadialGradient(cx1+cw/2,cy1+ch/2,10,cx1+cw/2,cy1+ch/2,Math.max(cw,ch)*0.65);
    wgrd.addColorStop(0,'rgba(255,160,60,0.05)');wgrd.addColorStop(1,'rgba(0,0,0,0.22)');
    c.fillStyle=wgrd;c.fillRect(cx1,cy1,cw,ch);
    // ── 長裂縫 ──
    const CRACKS=[
      // 橫向長裂縫（貫穿大部分桌面）
      [[0.03,0.22],[0.16,0.20],[0.30,0.24],[0.46,0.20],[0.63,0.23],[0.80,0.19],[0.95,0.23]],
      [[0.04,0.70],[0.20,0.68],[0.38,0.72],[0.56,0.67],[0.74,0.71],[0.92,0.67]],
      // 斜向中裂縫
      [[0.12,0.40],[0.22,0.44],[0.34,0.42],[0.46,0.47],[0.56,0.44],[0.64,0.49]],
      // 短裂縫
      [[0.66,0.78],[0.76,0.75],[0.86,0.79],[0.94,0.76]],
      [[0.05,0.86],[0.16,0.83],[0.26,0.87]],
      [[0.72,0.32],[0.80,0.35],[0.90,0.32]],
    ];
    c.save();c.beginPath();c.rect(cx1,cy1,cw,ch);c.clip();
    for(const pts of CRACKS){
      const abs=pts.map(([rx,ry])=>[cx1+cw*rx,cy1+ch*ry]);
      c.lineCap='round';c.lineJoin='round';
      // 裂縫光暈（溫暖木材色）
      c.strokeStyle='rgba(160,75,15,0.16)';c.lineWidth=3.5;
      c.beginPath();abs.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.stroke();
      // 裂縫主線（深黑）
      c.strokeStyle='rgba(6,1,0,0.80)';c.lineWidth=1.4;
      c.beginPath();abs.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.stroke();
      // 裂縫高光（分裂面亮面）
      c.strokeStyle='rgba(230,145,55,0.12)';c.lineWidth=0.7;
      c.beginPath();abs.forEach(([x,y],i)=>i?c.lineTo(x,y-1):c.moveTo(x,y-1));c.stroke();
    }
    c.restore();
    c.restore();
    // 中央紅毯（佔桌面寬度三分之一，垂直條）— 嚴格裁剪在木板範圍內
    const crpx1=Math.round(cx1+cw/3), crpx2=Math.round(cx2-cw/3), crpw=crpx2-crpx1;
    c.save();
    c.beginPath();c.rect(crpx1,cy1,crpw,ch);c.clip();
    c.fillStyle='#6c141a';c.fillRect(crpx1,cy1,crpw,ch);
    for(let fy=cy1;fy<cy2;fy+=5){c.fillStyle=Math.floor(fy/5)%2===0?'#711721':'#671117';c.fillRect(crpx1,fy,crpw,Math.min(5,cy2-fy));}
    // 菱形花紋
    c.strokeStyle='rgba(200,80,80,0.18)';c.lineWidth=1;
    for(let fy=cy1;fy<cy2+40;fy+=40)for(let fx=crpx1;fx<crpx2+40;fx+=40){
      const hw=12,mx2=fx+20,my2=fy+20;
      c.beginPath();c.moveTo(mx2,my2-hw);c.lineTo(mx2+hw,my2);c.lineTo(mx2,my2+hw);c.lineTo(mx2-hw,my2);c.closePath();c.stroke();
    }
    // 中央暗角
    const crgrd=c.createRadialGradient(crpx1+crpw/2,cy1+ch/2,0,crpx1+crpw/2,cy1+ch/2,Math.max(crpw,ch)*0.6);
    crgrd.addColorStop(0,'rgba(220,40,30,0.15)');crgrd.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=crgrd;c.fillRect(crpx1,cy1,crpw,ch);
    c.restore();
    // 金框（三層，clip 解除後畫確保線條不被截斷）
    c.strokeStyle='#d4a830';c.lineWidth=4;c.strokeRect(crpx1,cy1,crpw,ch);
    c.strokeStyle='#f0c850';c.lineWidth=1.5;c.strokeRect(crpx1+6,cy1+6,crpw-12,ch-12);
    c.strokeStyle='#a07820';c.lineWidth=1;c.strokeRect(crpx1+10,cy1+10,crpw-20,ch-20);
  }

  // Panel（固定不變）
  c.fillStyle='#10101a';c.fillRect(GAME_W,0,PANEL_W,H);
  for(let y=0;y<H;y+=8){const sh=Math.floor(y/8)%2===0?210:160;c.fillStyle=`rgb(${sh},${Math.floor(sh*148/210)},${Math.floor(sh*40/210)})`;c.fillRect(GAME_W,y,5,8);}
  return off;
}

// ═══════════════════════════════════════════════════════
// DRAW ICON
// ═══════════════════════════════════════════════════════
function drawIcon(upg,ix,cy2){
  const r=14,eff=upg.eff,ct=upg.coin,cx=ix+r;
  ctx.save();

  function coinShape(coinType,cx2,cy3,rad){
    const [R,G,B]=COIN_COL[coinType],[DR,DG,DB]=COIN_DARK[coinType];
    ctx.fillStyle=rgb(DR,DG,DB);ctx.beginPath();ctx.arc(cx2,cy3+2,rad,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=rgb(R,G,B);ctx.beginPath();ctx.arc(cx2,cy3,rad,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=rgb(DR-20,DG-20,DB-20);ctx.font=`bold ${Math.floor(rad*.8)}px sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(COIN_SYM[coinType]||'$',cx2,cy3);
  }
  function badge(text,col){
    ctx.font='bold 9px sans-serif';ctx.textAlign='left';ctx.textBaseline='top';
    const tw=ctx.measureText(text).width,bx=cx+r-tw-1,by=cy2+r-11;
    ctx.fillStyle='rgba(15,15,25,.92)';ctx.fillRect(bx-1,by-1,tw+4,11);
    ctx.strokeStyle=col;ctx.lineWidth=.7;ctx.strokeRect(bx-1,by-1,tw+4,11);
    ctx.fillStyle=col;ctx.fillText(text,bx,by);
  }
  function personHead(){
    const hR=11,hcy=cy2;
    ctx.fillStyle='rgba(0,0,0,0.15)';ctx.beginPath();ctx.arc(cx+1,hcy+2,hR,0,Math.PI*2);ctx.fill();
    const hg=ctx.createRadialGradient(cx-3,hcy-4,1,cx,hcy,hR);
    hg.addColorStop(0,'#ffffff');hg.addColorStop(0.55,'#f2f5f8');hg.addColorStop(1,'#cdd0d8');
    ctx.fillStyle=hg;ctx.beginPath();ctx.arc(cx,hcy,hR,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(155,168,185,0.42)';ctx.lineWidth=0.8;ctx.stroke();
    ctx.fillStyle='#111122';
    ctx.beginPath();ctx.arc(cx-3.8,hcy+1.5,2.2,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx+3.8,hcy+1.5,2.2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.78)';
    ctx.beginPath();ctx.arc(cx-4.5,hcy+0.8,0.9,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx+3.1,hcy+0.8,0.9,0,Math.PI*2);ctx.fill();
  }
  function strongWorkerIcon(){
    const hR=7,hcx=cx,hcy=cy2+5,coinX=cx,coinY=cy2-8,cR=7;
    // 舉起的手臂
    ctx.strokeStyle='#cccede';ctx.lineWidth=2.5;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(hcx-5,hcy+hR-2);ctx.lineTo(coinX-3,coinY+cR+1);ctx.stroke();
    ctx.beginPath();ctx.moveTo(hcx+5,hcy+hR-2);ctx.lineTo(coinX+3,coinY+cR+1);ctx.stroke();
    // 銅幣
    coinShape('copper',coinX,coinY,cR);
    // 頭（無頭髮無脖子，照遊戲角色）
    ctx.fillStyle='rgba(0,0,0,0.14)';ctx.beginPath();ctx.arc(hcx+1,hcy+2,hR,0,Math.PI*2);ctx.fill();
    const hg=ctx.createRadialGradient(hcx-2,hcy-3,0.5,hcx,hcy,hR);
    hg.addColorStop(0,'#ffffff');hg.addColorStop(0.55,'#f2f5f8');hg.addColorStop(1,'#cdd0d8');
    ctx.fillStyle=hg;ctx.beginPath();ctx.arc(hcx,hcy,hR,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(155,168,185,0.42)';ctx.lineWidth=0.8;ctx.stroke();
    ctx.fillStyle='#111122';
    ctx.beginPath();ctx.arc(hcx-2.5,hcy+1,1.6,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(hcx+2.5,hcy+1,1.6,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.75)';
    ctx.beginPath();ctx.arc(hcx-3.1,hcy+0.3,0.7,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(hcx+1.9,hcy+0.3,0.7,0,Math.PI*2);ctx.fill();
  }
  function starShape(col){
    ctx.fillStyle=col;ctx.beginPath();
    [[-0,-9],[2.6,-2.9],[8.7,-2.9],[4.1,1.1],[5.7,7.6],[0,3.6],[-5.7,7.6],[-4.1,1.1],[-8.7,-2.9],[-2.6,-2.9]].forEach(([px,py],i)=>{
      (i===0?ctx.moveTo:ctx.lineTo).call(ctx,cx+px,cy2+py);
    });ctx.closePath();ctx.fill();
  }

  if(eff==='add_coin'&&ct){        coinShape(ct,cx,cy2,r);badge('+1','#4bc850');
  }else if(eff==='add_helper'){    personHead();badge('+1','#4bc850');
  }else if(eff==='coin_flat'&&ct){ coinShape(ct,cx,cy2,r);badge('$+','#4bc850');
  }else if(eff==='coin_mult'&&ct){ coinShape(ct,cx,cy2,r);badge('×%','#d4b437');
  }else if(eff==='coin_speed'&&ct){coinShape(ct,cx,cy2,r);badge('⚡','#4bd2d2');
  }else if(eff==='coin_lucky'&&ct){coinShape(ct,cx,cy2,r);badge('%+','#d4b437');
  }else if(eff==='lucky_chance'){  starShape('#d4b437');badge('%+','#d4b437');
  }else if(eff==='helper_move'){   personHead();badge('⚡','#4bd2d2');
  }else if(eff==='strong_worker'){ strongWorkerIcon();
  }else if(eff==='flip_time'&&ct){ coinShape(ct,cx,cy2,r);badge('↻+','#4bd2d2');
  }else if(eff==='manual_flip'){
    ctx.fillStyle='#826818';ctx.beginPath();ctx.arc(cx-3,cy2+2,r-5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#d28c3c';ctx.beginPath();ctx.arc(cx-3,cy2,r-5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.9)';const ax=ix+r+4,ay=cy2-r+3;
    ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(ax+7,ay+5);ctx.lineTo(ax+4,ay+5);ctx.lineTo(ax+6,ay+11);ctx.lineTo(ax+3,ay+11);ctx.lineTo(ax+1,ay+5);ctx.lineTo(ax-2,ay+7);ctx.closePath();ctx.fill();
    badge('⚡','#4bd2d2');
  }else if(eff==='shockwave'){
    ctx.strokeStyle='#4bd2d2';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy2,r-2,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='#4bd2d2';ctx.beginPath();ctx.moveTo(cx+4,cy2-r+2);ctx.lineTo(cx+9,cy2-r+6);ctx.lineTo(cx,cy2-r+6);ctx.closePath();ctx.fill();
    badge('NOW','#4bd2d2');
  }else if(eff==='double_flip'){   personHead();badge('×2','#4bc850');
  }else if(eff==='slide_flip'){
    coinShape('copper',cx-1,cy2+2,r-3);
    // 游標指標
    const ax=cx+r-6,ay=cy2-r+1;
    ctx.fillStyle='#f0f0f0';ctx.strokeStyle='#111111';ctx.lineWidth=0.8;ctx.lineJoin='round';ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(ax,ay+9);ctx.lineTo(ax+2.5,ay+6.5);ctx.lineTo(ax+4,ay+10.5);ctx.lineTo(ax+5.5,ay+9.8);ctx.lineTo(ax+4,ay+5.5);ctx.lineTo(ax+6.5,ay+5.5);ctx.closePath();ctx.fill();ctx.stroke();
    badge('滑','#4bd2d2');
  }else if(eff==='global_mult'){   starShape('#d4b437');badge('×%','#d4b437');
  }else if(ct){                    coinShape(ct,cx,cy2,r);
  }else{                           starShape('#d4b437');
  }
  ctx.restore();
}
