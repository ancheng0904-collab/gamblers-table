let sacBtnRect=null;

function getTabRects(){
  const px=GAME_W+6, panW=PANEL_W-6;
  const g1=Math.round((panW-3*TAB_SQ)*1/4);
  const g2=Math.round((panW-3*TAB_SQ)*2/4);
  const g3=Math.round((panW-3*TAB_SQ)*3/4);
  const ty=HUD_H+Math.floor((TAB_H-TAB_SQ)/2);
  return [
    {x:px+g1,      y:ty, w:TAB_SQ, h:TAB_SQ, id:'items'},
    {x:px+g2+TAB_SQ,   y:ty, w:TAB_SQ, h:TAB_SQ, id:'upgrades'},
    {x:px+g3+TAB_SQ*2, y:ty, w:TAB_SQ, h:TAB_SQ, id:'sacrifice'},
  ];
}

function drawTabIcon(tid, cx, cy, act){
  ctx.save();
  ctx.globalAlpha = act ? 1 : 0.5;

  if(tid==='items'){
    // 金幣堆疊
    [[3,4],[0,2],[-3,0]].forEach(([ox,oy],i)=>{
      const [R,G,B]=COIN_COL.gold,[DR,DG,DB]=COIN_DARK.gold;
      ctx.fillStyle=`rgb(${DR},${DG},${DB})`;ctx.beginPath();ctx.ellipse(cx+ox,cy+oy+3,12,4,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=`rgb(${R},${G},${B})`;ctx.beginPath();ctx.ellipse(cx+ox,cy+oy,12,4,0,0,Math.PI*2);ctx.fill();
    });
    // 主幣正面
    ctx.fillStyle='#b07820';ctx.beginPath();ctx.arc(cx-3,cy-8,14,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#d4b437';ctx.beginPath();ctx.arc(cx-3,cy-10,14,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#f5e070';ctx.beginPath();ctx.arc(cx-3,cy-10,10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#8c6010';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('$',cx-3,cy-10);
    // +1 badge
    ctx.globalAlpha=act?1:0.5;
    ctx.fillStyle='#4bc850';ctx.font='bold 11px sans-serif';ctx.textAlign='left';ctx.textBaseline='top';
    ctx.fillText('+1',cx+6,cy-20);

  }else if(tid==='upgrades'){
    // 閃電符號
    ctx.fillStyle='#4bd2d2';
    ctx.beginPath();
    ctx.moveTo(cx+7,cy-20);ctx.lineTo(cx-3,cy-2);ctx.lineTo(cx+4,cy-2);
    ctx.lineTo(cx-7,cy+20);ctx.lineTo(cx+3,cy+2);ctx.lineTo(cx-4,cy+2);
    ctx.closePath();ctx.fill();
    // 星星裝飾
    [[cx+15,cy-12,3],[cx-15,cy-8,2.5]].forEach(([sx,sy,r])=>{
      ctx.fillStyle='#f0d060';ctx.beginPath();ctx.arc(sx,sy,r,0,Math.PI*2);ctx.fill();
    });

  }else if(tid==='sacrifice'){
    // 骷髏頭
    ctx.fillStyle=act?'#d0c0f0':'#907090';
    ctx.beginPath();ctx.arc(cx,cy-8,16,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.roundRect(cx-11,cy+4,22,12,3);ctx.fill();
    // 眼眶
    ctx.fillStyle='#1a1628';
    ctx.beginPath();ctx.arc(cx-6,cy-10,5.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx+6,cy-10,5.5,0,Math.PI*2);ctx.fill();
    // 鼻孔
    ctx.beginPath();ctx.arc(cx,cy-3,2.5,0,Math.PI*2);ctx.fill();
    // 牙齒
    [-8,-2,4].forEach(ox=>{ctx.fillRect(cx+ox,cy+6,4,6);});
    // 頭頂火焰
    ctx.fillStyle='#dc4641';ctx.globalAlpha=(act?1:0.5)*0.9;
    ctx.beginPath();
    ctx.moveTo(cx,cy-26);ctx.quadraticCurveTo(cx+9,cy-18,cx+4,cy-12);
    ctx.quadraticCurveTo(cx+1,cy-17,cx,cy-14);
    ctx.quadraticCurveTo(cx-1,cy-17,cx-4,cy-12);
    ctx.quadraticCurveTo(cx-9,cy-18,cx,cy-26);ctx.fill();
  }
  ctx.restore();
}

function drawPanel(gs) {
  const px=GAME_W+6;
  // 分頁列背景
  ctx.fillStyle='#0e0e1a';
  ctx.fillRect(GAME_W,HUD_H,PANEL_W,TAB_H);
  // 分頁列底線
  ctx.strokeStyle='#2a2a40';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(GAME_W,HUD_H+TAB_H);ctx.lineTo(W,HUD_H+TAB_H);ctx.stroke();

  // 正方形圖示按鈕
  const tabs=getTabRects();
  tabs.forEach(tr=>{
    const act=tab===tr.id;
    rRect(tr.x,tr.y,tr.w,tr.h,8,act?'#1e1e34':'#14141e',null);
    if(act){ctx.strokeStyle='rgba(212,180,55,0.35)';ctx.lineWidth=1.5;ctx.strokeRect(tr.x+0.75,tr.y+0.75,tr.w-1.5,tr.h-1.5);}
    drawTabIcon(tr.id, tr.x+tr.w/2, tr.y+tr.h/2, act);
    if(act){ctx.fillStyle='#d4b437';ctx.fillRect(tr.x+8,tr.y+tr.h-3,tr.w-16,3);}
  });

  // ── 分頁名稱標籤列 ──
  const labelY=HUD_H+TAB_H;
  ctx.fillStyle='#0b0b18';
  ctx.fillRect(GAME_W,labelY,PANEL_W,PANEL_LABEL_H);
  ctx.strokeStyle='#252538';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(GAME_W,labelY);ctx.lineTo(W,labelY);ctx.stroke();
  ctx.beginPath();ctx.moveTo(GAME_W,labelY+PANEL_LABEL_H);ctx.lineTo(W,labelY+PANEL_LABEL_H);ctx.stroke();
  const tabLabel={'items':'🪙  道具 · 物品','upgrades':'📈  能力升級','sacrifice':'✨  獻祭祭壇'};
  ctx.fillStyle='#9090c0';ctx.font='bold 12px sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(tabLabel[tab]||'',GAME_W+PANEL_W/2,labelY+PANEL_LABEL_H/2);

  // 內容區底色（防止舊幀內容透出）
  ctx.fillStyle='#0b0b18';
  ctx.fillRect(GAME_W, labelY+PANEL_LABEL_H, PANEL_W, H-labelY-PANEL_LABEL_H);

  const cr={x:px,y:HUD_H+TAB_H+PANEL_LABEL_H+4,w:PANEL_W-6,h:H-HUD_H-TAB_H-PANEL_LABEL_H-ABILITY_H-20};
  if(tab==='sacrifice'){
    const bigCr={x:px,y:HUD_H+TAB_H+PANEL_LABEL_H+4,w:PANEL_W-6,h:H-HUD_H-TAB_H-PANEL_LABEL_H-12};
    drawSacrifice(gs,bigCr);return;
  }

  const IH=62,pd=6;
  const vis=visUpgrades(gs);
  const totH=vis.length*IH, maxScr=Math.max(0,totH-cr.h);
  scroll=Math.max(0,Math.min(maxScr,scroll));
  ctx.save();ctx.beginPath();ctx.rect(cr.x,cr.y,cr.w,cr.h);ctx.clip();
  let y=cr.y-scroll, hovUpg=null;
  for(const u of vis){
    const lvl=gs.upgradeLevels[u.id]||0,maxed=lvl>=u.max,cost=upgCost(u,lvl),canBuy=!maxed&&gs.money>=cost;
    if(y+IH>cr.y&&y<cr.y+cr.h){
      const ir={x:cr.x+pd,y:y+2,w:cr.w-pd*2,h:IH-4};
      const hov=mx_>=ir.x&&mx_<=ir.x+ir.w&&my_>=ir.y&&my_<=ir.y+ir.h;
      if(hov) hovUpg={u,ir,lvl,maxed};
      rRect(ir.x,ir.y,ir.w,ir.h,4,hov?'#24243a':'#1a1a28','#2a2a32');
      drawIcon(u,ir.x+6,ir.y+ir.h/2);
      const tcx=ir.x+44+(ir.w-44)/2;
      ctx.fillStyle='#eeeef8';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(u.name,tcx,ir.y+ir.h/2-10);
      ctx.fillStyle=maxed?'#d4b437':'#828296';ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.textBaseline='bottom';
      ctx.fillText(maxed?'MAX':`${lvl} / ${u.max}`,tcx,ir.y+ir.h-4);
      if(!maxed){ctx.fillStyle=canBuy?'#4bc850':'#dc4641';ctx.font='12px sans-serif';ctx.textAlign='right';ctx.textBaseline='top';ctx.fillText(fmt(cost),ir.x+ir.w-6,ir.y+6);}
    }
    y+=IH;
  }
  ctx.restore();
  if(totH>cr.h){const ratio=cr.h/totH,bh=Math.max(24,Math.round(cr.h*ratio)),by=cr.y+Math.round(scroll/totH*cr.h);rRect(cr.x+cr.w-5,by,4,bh,2,'#2a2a32',null);}

  // ── 升級項目 Tooltip（左下角固定位置） ──
  if(hovUpg){
    const {u,lvl,maxed}=hovUpg;
    const TW=300, PAD=12, lineH=17;
    const ISCALE=1.5, IR=Math.round(14*ISCALE); // 放大後圖示半徑≈21px
    // 說明文字換行
    ctx.font='12px sans-serif';
    const rawLines=u.desc.split('、').join('、\n').split('（').join('\n（').split('\n');
    const wrapped=[];
    for(const seg of rawLines){
      let ln='';
      for(const ch of seg){
        if(ctx.measureText(ln+ch).width>TW-PAD*2){wrapped.push(ln);ln=ch;}
        else ln+=ch;
      }
      if(ln) wrapped.push(ln);
    }
    const HEADER_H=IR*2+8;
    const DESC_H=Math.max(0,wrapped.length)*lineH+8;
    const HINT_H=maxed?0:lineH+10;
    const TH=PAD+HEADER_H+DESC_H+HINT_H+PAD;
    const tx=10, ty=Math.max(10,H-TH-BORDER_W-8);
    // 背景 + 外框
    ctx.fillStyle='rgba(8,8,18,0.97)';ctx.fillRect(tx,ty,TW,TH);
    ctx.strokeStyle='#50508a';ctx.lineWidth=1.5;ctx.strokeRect(tx,ty,TW,TH);
    // 圖示（放大 ×1.5，左上角）
    const iconCX=tx+PAD+IR, iconCY=ty+PAD+IR;
    ctx.save();
    ctx.translate(iconCX,iconCY);ctx.scale(ISCALE,ISCALE);
    drawIcon(u,-14,0);
    ctx.restore();
    // 名稱 + 等級（圖示右側）
    const nameX=tx+PAD+IR*2+8;
    ctx.fillStyle='#eeeef8';ctx.font='bold 13px sans-serif';
    ctx.textAlign='left';ctx.textBaseline='top';
    ctx.fillText(u.name,nameX,ty+PAD);
    ctx.fillStyle=maxed?'#d4b437':'#6060a0';ctx.font='11px sans-serif';
    ctx.fillText(maxed?'已達上限':`Lv ${lvl} / ${u.max}`,nameX,ty+PAD+18);
    // 分隔線
    const sepY=ty+PAD+HEADER_H;
    ctx.strokeStyle='#2a2a48';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(tx+PAD,sepY);ctx.lineTo(tx+TW-PAD,sepY);ctx.stroke();
    // 說明文字
    ctx.fillStyle='#a8a8d0';ctx.font='12px sans-serif';ctx.textBaseline='top';
    wrapped.forEach((ln,i)=>ctx.fillText(ln,tx+PAD,sepY+6+i*lineH));
    // Ctrl 提示（未滿級才顯示）
    if(!maxed){
      const hintY=ty+TH-PAD-lineH+1;
      ctx.strokeStyle='#2a2a48';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(tx+PAD,hintY-5);ctx.lineTo(tx+TW-PAD,hintY-5);ctx.stroke();
      ctx.fillStyle='rgba(140,140,220,0.9)';ctx.font='bold 11px sans-serif';ctx.textBaseline='top';
      ctx.fillText('Ctrl + 點擊 → 一次購買最多可負擔的數量',tx+PAD,hintY);
    }
  }
}

function drawSacrifice(gs,cr) {
  const cx2=cr.x+cr.w/2;
  ctx.textAlign='center'; ctx.textBaseline='top';

  // ── 獻祭主區（固定在頂部，不受 scroll 影響）──
  let y=cr.y+18;
  ctx.fillStyle='#dc4641'; ctx.font='bold 26px sans-serif';
  ctx.fillText('獻祭', cx2, y); y+=38;
  ctx.fillStyle='#606075'; ctx.font='12px sans-serif';
  ctx.fillText('重置本局，保留天賦點數。', cx2, y); y+=24;

  const thresh=gs.sacrificeThreshold();
  const earned=gs.totalEarned;
  ctx.fillStyle='#828296'; ctx.font='12px sans-serif';
  ctx.fillText(`第 ${gs.prestigeCount+1} 次獻祭門檻`, cx2, y); y+=16;
  ctx.fillStyle='#f0c030'; ctx.font='bold 19px sans-serif';
  ctx.fillText(fmt(thresh), cx2, y); y+=26;

  ctx.fillStyle='#828296'; ctx.font='12px sans-serif';
  ctx.fillText('累積總收益', cx2, y); y+=16;
  ctx.fillStyle='#eeeef8'; ctx.font='bold 17px sans-serif';
  ctx.fillText(fmt(earned), cx2, y); y+=24;

  const barW=Math.round(cr.w*0.84), barX=cx2-barW/2, barH=9;
  const prog=Math.min(1, thresh>0?earned/thresh:0);
  ctx.fillStyle='#1a1a2a'; ctx.beginPath(); ctx.roundRect(barX,y,barW,barH,5); ctx.fill();
  ctx.strokeStyle='#2a2a42'; ctx.lineWidth=1; ctx.beginPath(); ctx.roundRect(barX,y,barW,barH,5); ctx.stroke();
  if(prog>0){ctx.fillStyle=prog>=1?'#dc4641':'#d4b437';ctx.beginPath();ctx.roundRect(barX,y,Math.max(8,Math.round(barW*prog)),barH,5);ctx.fill();}
  y+=barH+5;
  ctx.fillStyle='#606075'; ctx.font='11px sans-serif';
  ctx.fillText(prog>=1?'已達門檻！可進行獻祭':`${Math.min(100,Math.round(prog*100))}%  還需 ${fmt(Math.max(0,thresh-earned))}`,cx2,y);
  y+=20;

  const pts=Math.max(0,Math.floor(earned/thresh));
  ctx.fillStyle='#828296'; ctx.font='12px sans-serif';
  ctx.fillText('天賦點數預覽', cx2, y); y+=18;
  ctx.fillStyle=pts>0?'#4bd2d2':'#404055'; ctx.font='bold 26px sans-serif';
  ctx.fillText(pts>0?`+${pts} 點`:'未達門檻', cx2, y); y+=40;

  sacBtnRect={x:cx2-76,y,w:152,h:40};
  const can=pts>0, hov=mx_>=sacBtnRect.x&&mx_<=sacBtnRect.x+sacBtnRect.w&&my_>=sacBtnRect.y&&my_<=sacBtnRect.y+sacBtnRect.h;
  rRect(sacBtnRect.x,sacBtnRect.y,sacBtnRect.w,sacBtnRect.h,7,can&&hov?'#be3232':can?'#8c2323':'#322323',can?'#dc5050':'#2a2a32',2);
  ctx.fillStyle='#eeeef8'; ctx.font='bold 18px sans-serif'; ctx.textBaseline='middle';
  ctx.fillText('確認獻祭', cx2, sacBtnRect.y+sacBtnRect.h/2);
  ctx.fillStyle='#4bd2d2'; ctx.font='12px sans-serif'; ctx.textBaseline='top';
  ctx.fillText(`天賦總點數：${gs.talentPoints}`, cx2, sacBtnRect.y+sacBtnRect.h+10);
  y=sacBtnRect.y+sacBtnRect.h+28;

  // ── 永恆商店（分隔線 + 標題，永遠顯示）──
  ctx.strokeStyle='#2a2a42'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(cr.x+8,y); ctx.lineTo(cr.x+cr.w-8,y); ctx.stroke();
  y+=8;
  ctx.fillStyle='#d4b437'; ctx.font='bold 13px sans-serif';
  ctx.fillText('✦  永恆商店  ✦', cx2, y); y+=6;
  if(gs.prestigeCount<1){
    ctx.fillStyle='#555570'; ctx.font='11px sans-serif';
    ctx.fillText('完成第一次獻祭後解鎖', cx2, y+14);
  }
  y+=16;

  // 可捲動區域
  const shopAreaY=y, shopAreaH=cr.y+cr.h-y-4;
  const IH=52;
  // 顯示「已解鎖」+「即將解鎖（鎖定預覽）」的商品
  const visibleItems=PRESTIGE_SHOP.filter(p=>p.req<=gs.prestigeCount+1);
  const totalShopH=visibleItems.length*IH;
  const maxScr=Math.max(0,totalShopH-shopAreaH);
  sacScroll=Math.max(0,Math.min(maxScr,sacScroll));

  ctx.save();
  ctx.beginPath(); ctx.rect(cr.x,shopAreaY,cr.w,shopAreaH); ctx.clip();

  sacShopRects=[];
  let sy=shopAreaY-sacScroll;
  for(const item of visibleItems){
    const unlocked=gs.prestigeCount>=item.req;
    const lv=gs.prestigeShopLevels[item.id]||0;
    const maxed=lv>=(item.maxLevel||99);
    const cost=gs.prestigeShopCost(item.id);
    const canBuy=unlocked&&!maxed&&gs.talentPoints>=cost;
    const ir={x:cr.x+4,y:sy+2,w:cr.w-8,h:IH-4};

    if(sy+IH>shopAreaY&&sy<shopAreaY+shopAreaH){
      const hovI=unlocked&&!maxed&&mx_>=ir.x&&mx_<=ir.x+ir.w&&my_>=ir.y&&my_<=ir.y+ir.h;
      rRect(ir.x,ir.y,ir.w,ir.h,6,
        !unlocked?'#0e0e18':maxed?'#1a1a0a':hovI?'#1c1c30':'#14141e',
        !unlocked?'#1e1e2e':maxed?'#b8960030':'#252540',1);

      ctx.font='18px sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
      ctx.globalAlpha=unlocked?1:0.35;
      ctx.fillText(item.icon,ir.x+8,ir.y+ir.h/2-6);
      ctx.globalAlpha=1;

      if(!unlocked){
        // 鎖定預覽
        ctx.fillStyle='#404055'; ctx.font='bold 12px sans-serif'; ctx.textAlign='left'; ctx.textBaseline='top';
        ctx.fillText(item.name,ir.x+32,ir.y+8);
        ctx.fillStyle='#333348'; ctx.font='11px sans-serif';
        ctx.fillText(`第 ${item.req} 次獻祭後解鎖`,ir.x+32,ir.y+24);
        ctx.fillStyle='#2a2a40'; ctx.font='bold 14px sans-serif'; ctx.textAlign='right'; ctx.textBaseline='middle';
        ctx.fillText('🔒',ir.x+ir.w-10,ir.y+ir.h/2);
      } else {
        const nameCol=maxed?'#d4b437':canBuy?'#d0d0f0':'#a0a0c0';
        ctx.fillStyle=nameCol; ctx.font='bold 13px sans-serif'; ctx.textAlign='left'; ctx.textBaseline='top';
        ctx.fillText(`${item.name}  Lv.${lv}/${item.maxLevel}`,ir.x+32,ir.y+7);
        ctx.fillStyle='#808098'; ctx.font='11px sans-serif';
        ctx.fillText(item.desc+(lv>0?` ×${lv}`:''),ir.x+32,ir.y+23);

        const btnW=62,btnX=ir.x+ir.w-btnW-6,btnY=ir.y+ir.h/2-12;
        if(maxed){
          rRect(btnX,btnY,btnW,24,5,'#2a2500','#b89600',1.5);
          ctx.fillStyle='#d4b437'; ctx.font='bold 11px sans-serif';
          ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.fillText('★ MAX',btnX+btnW/2,btnY+12);
        } else {
          rRect(btnX,btnY,btnW,24,5,canBuy?'#1a2a1a':'#1a1a28',canBuy?'#4bc850':'#2a2a42',1.5);
          ctx.fillStyle=canBuy?'#4bc850':'#404058'; ctx.font='bold 11px sans-serif';
          ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.fillText(`${cost} 點`,btnX+btnW/2,btnY+12);
          sacShopRects.push({x:btnX,y:btnY,w:btnW,h:24,id:item.id});
        }
      }
    }
    sy+=IH;
  }

  // 捲動條
  if(maxScr>0){
    const sbH=Math.max(20,shopAreaH*(shopAreaH/totalShopH));
    const sbY=shopAreaY+(sacScroll/maxScr)*(shopAreaH-sbH);
    ctx.fillStyle='#2a2a42'; ctx.fillRect(cr.x+cr.w-5,shopAreaY,4,shopAreaH);
    ctx.fillStyle='#5050a0'; ctx.beginPath(); ctx.roundRect(cr.x+cr.w-5,sbY,4,sbH,2); ctx.fill();
  }
  ctx.restore();
}

function getAbilitySlotRects(){ return abilitySlots; }

function drawAbilitySection(gs){
  if(tab==='sacrifice') return; // 祭壇 tab 時讓出空間給永恆商店
  const ay=H-ABILITY_H-12, px=GAME_W+6, pw=PANEL_W-6;
  const pd=6, IH=56, crY=ay+26, crH=ABILITY_H-30;

  ctx.fillStyle='#0c0c18'; ctx.fillRect(px, ay, pw, ABILITY_H);
  ctx.fillStyle='#d4b437'; ctx.font='bold 13px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText('能  力', px+pw/2, ay+7);

  // 更新可見列快取（供 getAbilitySlotRects 和 click 用）
  const totH=gs.abilities.length*IH, maxScr=Math.max(0,totH-crH);
  abScroll=Math.max(0,Math.min(maxScr,abScroll));
  abilitySlots=[];
  let yi=crY-abScroll;
  for(let i=0;i<gs.abilities.length;i++){
    if(yi+IH>crY&&yi<crY+crH) abilitySlots.push({x:px+pd,y:yi+2,w:pw-pd*2,h:IH-4,idx:i});
    yi+=IH;
  }

  ctx.save(); ctx.beginPath(); ctx.rect(px,crY,pw,crH); ctx.clip();

  let y=crY-abScroll;
  for(let i=0;i<gs.abilities.length;i++){
    const aid=gs.abilities[i];
    const ab=aid?getAbility(aid):null;
    const cd=ab?(gs.abilityCooldowns[aid]||0):0;
    const isActive=ab&&gs.activeEffects.some(e=>e.id===aid);
    const isReady=ab&&cd<=0;

    if(y+IH>crY&&y<crY+crH){
      const ir={x:px+pd,y:y+2,w:pw-pd*2,h:IH-4};
      const hov=mx_>=ir.x&&mx_<=ir.x+ir.w&&my_>=ir.y&&my_<=ir.y+ir.h;

      rRect(ir.x,ir.y,ir.w,ir.h,5,
        ab?(isActive?'#1a281a':hov?'#1e1e30':'#14141e'):'#10101a',
        ab?(isActive?'#4bc850':isReady?ab.col:'#2a2a3a'):'#1e1e2e',
        ab&&(isReady||isActive)?1.5:1);

      if(!ab){
        ctx.fillStyle='#2a2a3a';ctx.font='22px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('+',ir.x+ir.w/2,ir.y+ir.h/2);
      } else {
        ctx.font='28px sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';
        ctx.fillText(AB_ICONS[aid]||'?',ir.x+8,ir.y+ir.h/2);

        ctx.fillStyle=isReady||isActive?ab.col:'#888899';
        ctx.font='bold 13px sans-serif';ctx.textAlign='left';ctx.textBaseline='top';
        ctx.fillText(ab.name,ir.x+44,ir.y+9);

        ctx.fillStyle=isActive?'#4bc850':isReady?'#90b890':'#5a5a7a';
        ctx.font='11px sans-serif';ctx.textBaseline='bottom';
        ctx.fillText(isActive?'啟動中':isReady?'備用':Math.ceil(cd)+'s 冷卻',ir.x+44,ir.y+ir.h-7);

        ctx.fillStyle=isReady||isActive?'#4bc850':'#555570';
        ctx.font='bold 11px sans-serif';ctx.textAlign='right';ctx.textBaseline='middle';
        ctx.fillText(isActive?'啟動':isReady?'READY':Math.ceil(cd)+'s',ir.x+ir.w-7,ir.y+ir.h/2);

        if(cd>0&&ab.cooldown>0){
          const rat=1-cd/ab.cooldown;
          ctx.fillStyle='#222238';ctx.fillRect(ir.x,ir.y+ir.h-3,ir.w,3);
          ctx.fillStyle=ab.col;ctx.fillRect(ir.x,ir.y+ir.h-3,ir.w*rat,3);
        }
        if(isActive){
          ctx.save();ctx.shadowColor='#4bc850';ctx.shadowBlur=10;
          ctx.strokeStyle='#4bc850';ctx.lineWidth=1.5;
          ctx.beginPath();ctx.roundRect(ir.x,ir.y,ir.w,ir.h,5);ctx.stroke();
          ctx.shadowBlur=0;ctx.restore();
        }
      }
    }
    y+=IH;
  }
  ctx.restore();

  // 捲動條（若內容超過高度）
  if(totH>crH){
    const sbH=Math.max(24,crH*crH/totH);
    const sbY=crY+(abScroll/maxScr)*(crH-sbH);
    ctx.fillStyle='rgba(212,180,55,0.18)';ctx.fillRect(px+pw-6,crY,4,crH);
    ctx.fillStyle='rgba(212,180,55,0.55)';ctx.fillRect(px+pw-6,sbY,4,sbH);
  }

  // 金框
  ctx.save();
  const g=ctx.createLinearGradient(px,ay,px,ay+ABILITY_H);
  g.addColorStop(0,'#f0d060');g.addColorStop(0.5,'#d4b437');g.addColorStop(1,'#e8cc50');
  ctx.shadowColor='#d4b437';ctx.shadowBlur=6;
  ctx.strokeStyle=g;ctx.lineWidth=2.5;
  ctx.strokeRect(px+2,ay+2,pw-4,ABILITY_H-4);
  ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(212,180,55,0.2)';ctx.lineWidth=1;
  ctx.strokeRect(px+6,ay+6,pw-12,ABILITY_H-12);
  [[px+4,ay+4],[px+pw-4,ay+4],[px+4,ay+ABILITY_H-4],[px+pw-4,ay+ABILITY_H-4]].forEach(([cx2,cy2])=>{
    ctx.fillStyle='#d4b437';ctx.beginPath();
    ctx.moveTo(cx2,cy2-5);ctx.lineTo(cx2+5,cy2);ctx.lineTo(cx2,cy2+5);ctx.lineTo(cx2-5,cy2);ctx.closePath();ctx.fill();
  });
  ctx.restore();
}

function drawAbilityTooltip(gs){
  const hov=abilitySlots.find(sr=>mx_>=sr.x&&mx_<=sr.x+sr.w&&my_>=sr.y&&my_<=sr.y+sr.h);
  if(!hov) return;
  const aid=gs.abilities[hov.idx];
  if(!aid) return;
  const ab=getAbility(aid);
  if(!ab) return;

  const TW=300, pad=16, lineH=18;
  const lines=[
    ab.desc,
    '冷卻：'+ab.cooldown+' 秒',
    ab.duration>0?'持續：'+ab.duration+' 秒':'（立即生效）',
  ];
  const TH=Math.max(180, pad+22+lines.length*lineH+pad);
  const tx=10, ty=H-TH-10;

  ctx.save();
  ctx.fillStyle='#0a0a1a';ctx.fillRect(tx,ty,TW,TH);
  ctx.strokeStyle=ab.col;ctx.lineWidth=1.5;ctx.strokeRect(tx,ty,TW,TH);

  ctx.fillStyle=ab.col;ctx.font='bold 13px sans-serif';ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillText((AB_ICONS[aid]||'')+' '+ab.name, tx+pad, ty+pad);

  ctx.fillStyle='#c8c8d8';ctx.font='12px sans-serif';
  lines.forEach((line,i)=>ctx.fillText(line, tx+pad, ty+pad+18+i*lineH));
  ctx.restore();
}

function drawPanelBorder() {
  const bx = GAME_W, bw = PANEL_W, bh = H;
  ctx.save();

  // === 左邊主柱（遊戲與面板分隔線，最顯眼） ===
  const pillarGrad = ctx.createLinearGradient(bx-3, 0, bx+8, 0);
  pillarGrad.addColorStop(0,   '#a07010');
  pillarGrad.addColorStop(0.3, '#f5e070');
  pillarGrad.addColorStop(0.6, '#d4b437');
  pillarGrad.addColorStop(1,   '#7a5808');
  ctx.fillStyle = pillarGrad;
  ctx.fillRect(bx - 2, 0, 10, bh);

  // 左柱內嵌暗線
  ctx.strokeStyle = 'rgba(60,30,0,0.6)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(bx+1, 0); ctx.lineTo(bx+1, bh); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx+5, 0); ctx.lineTo(bx+5, bh); ctx.stroke();

  // === 外框三條線（面板四邊） ===
  const frameGrad = ctx.createLinearGradient(bx, 0, bx, bh);
  frameGrad.addColorStop(0,   '#f0d060');
  frameGrad.addColorStop(0.4, '#d4b437');
  frameGrad.addColorStop(0.8, '#b89230');
  frameGrad.addColorStop(1,   '#e8cc50');

  ctx.shadowColor = '#d4b437';
  ctx.shadowBlur = 8;
  ctx.strokeStyle = frameGrad;
  ctx.lineWidth = 3;
  ctx.strokeRect(bx + 10, 2, bw - 13, bh - 4);
  ctx.shadowBlur = 0;

  // 細內框
  ctx.strokeStyle = 'rgba(255,210,60,0.25)';
  ctx.lineWidth = 1;
  ctx.strokeRect(bx + 14, 6, bw - 21, bh - 12);

  // === 角落裝飾（四角花飾） ===
  function rosette(cx, cy) {
    // 外大菱形
    ctx.fillStyle = '#d4b437';
    ctx.strokeStyle = '#7a5000';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx, cy - 11); ctx.lineTo(cx + 11, cy);
    ctx.lineTo(cx, cy + 11); ctx.lineTo(cx - 11, cy);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // 十字臂
    ctx.strokeStyle = '#f5e070'; ctx.lineWidth = 1.5;
    [[0,-16],[16,0],[0,16],[-16,0]].forEach(([dx,dy]) => {
      ctx.beginPath();
      ctx.moveTo(cx + Math.sign(dx||1)*11, cy + Math.sign(dy||1)*11);
      ctx.lineTo(cx + dx, cy + dy); ctx.stroke();
    });
    // 臂端小菱形
    [[0,-16],[16,0],[0,16],[-16,0]].forEach(([dx,dy]) => {
      ctx.fillStyle = '#f0d060';
      ctx.beginPath();
      ctx.moveTo(cx+dx, cy+dy-4); ctx.lineTo(cx+dx+4, cy+dy);
      ctx.lineTo(cx+dx, cy+dy+4); ctx.lineTo(cx+dx-4, cy+dy);
      ctx.closePath(); ctx.fill();
    });
    // 中心白點
    ctx.fillStyle = '#fff8d0';
    ctx.beginPath(); ctx.arc(cx, cy, 2.5, 0, Math.PI*2); ctx.fill();
    // 中心小菱形
    ctx.fillStyle = '#8c6010';
    ctx.beginPath();
    ctx.moveTo(cx, cy-5); ctx.lineTo(cx+5, cy);
    ctx.lineTo(cx, cy+5); ctx.lineTo(cx-5, cy);
    ctx.closePath(); ctx.fill();
  }

  rosette(bx + 12, 12);
  rosette(bx + bw - 5, 12);
  rosette(bx + 12, bh - 12);
  rosette(bx + bw - 5, bh - 12);

  // === 左柱花紋（最顯眼的邊，每隔 36px 一個菱形+藤蔓） ===
  const lx = bx + 3;
  const vStep = 36;
  for (let y = vStep; y < bh - vStep/2; y += vStep) {
    // 主菱形
    ctx.fillStyle = '#f0d060';
    ctx.strokeStyle = '#7a5000'; ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(lx, y-6); ctx.lineTo(lx+6, y);
    ctx.lineTo(lx, y+6); ctx.lineTo(lx-6, y);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // 中心點
    ctx.fillStyle = '#7a5000';
    ctx.beginPath(); ctx.arc(lx, y, 1.5, 0, Math.PI*2); ctx.fill();
    // 上下小點
    if (y + vStep/2 < bh) {
      ctx.fillStyle = 'rgba(212,180,55,0.55)';
      ctx.beginPath(); ctx.arc(lx, y + vStep/2, 2, 0, Math.PI*2); ctx.fill();
    }
  }

  // === 頂部與底部邊條花紋 ===
  const hStep = 38;
  for (let x = bx + 30; x < bx + bw - 20; x += hStep) {
    // 頂部小菱形
    ctx.fillStyle = '#d4b437';
    ctx.beginPath();
    ctx.moveTo(x, 2-4); ctx.lineTo(x+4, 2);
    ctx.lineTo(x, 2+4); ctx.lineTo(x-4, 2);
    ctx.closePath(); ctx.fill();
    // 底部小菱形
    ctx.beginPath();
    ctx.moveTo(x, bh-2-4); ctx.lineTo(x+4, bh-2);
    ctx.lineTo(x, bh-2+4); ctx.lineTo(x-4, bh-2);
    ctx.closePath(); ctx.fill();
  }

  ctx.restore();
}

function drawShockwaves(){
  for(const sw of shockwaves){
    const p1=Math.min(1,sw.t/0.55);
    const p2=Math.min(1,Math.max(0,(sw.t-0.08)/0.42));
    ctx.save();
    // 外圈：慢速擴散，厚線漸消
    if(p1<1){
      ctx.globalAlpha=(1-p1)*0.9;
      ctx.strokeStyle='#4bd2d2';
      ctx.lineWidth=Math.max(1.5,6*(1-p1));
      ctx.shadowColor='#4bd2d2'; ctx.shadowBlur=8*(1-p1);
      ctx.beginPath();ctx.arc(sw.x,sw.y,p1*78,0,Math.PI*2);ctx.stroke();
    }
    // 內圈：稍後出現，較小較細
    if(p2>0&&p2<1){
      ctx.globalAlpha=(1-p2)*0.45;
      ctx.strokeStyle='#ffffff';
      ctx.lineWidth=Math.max(1,3*(1-p2));
      ctx.shadowBlur=0;
      ctx.beginPath();ctx.arc(sw.x,sw.y,p2*52,0,Math.PI*2);ctx.stroke();
    }
    ctx.restore();
  }
}

function showNameScreen(existingName){
  return new Promise(resolve=>{
    const ov=document.getElementById('nameOverlay');
    const inp=document.getElementById('nameInput');
    const btn=document.getElementById('nameConfirm');
    inp.value=existingName||'';
    ov.classList.add('show');
    inp.focus();
    const confirm=()=>{
      const name=(inp.value||'').trim().slice(0,16)||'玩家';
      ov.classList.remove('show');
      btn.removeEventListener('click',confirm);
      inp.removeEventListener('keydown',onKey);
      resolve(name);
    };
    const onKey=e=>{if(e.key==='Enter') confirm();};
    btn.addEventListener('click',confirm);
    inp.addEventListener('keydown',onKey);
  });
}

let _stars=null;
function getStars(){
  if(!_stars) _stars=Array.from({length:220},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()<.15?2.2:Math.random()<.4?1.5:1,a:.4+Math.random()*.6,twinkle:Math.random()*Math.PI*2}));
  return _stars;
}

function drawTalentBG(t){
  // purple starry sky gradient
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0a0415'); g.addColorStop(.5,'#12082a'); g.addColorStop(1,'#1a0838');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // nebula blobs
  [[350,200,180,'rgba(100,30,180,.12)'],[800,350,220,'rgba(60,20,140,.10)'],[500,500,150,'rgba(140,50,200,.08)']].forEach(([nx,ny,nr,nc])=>{
    const ng=ctx.createRadialGradient(nx,ny,0,nx,ny,nr);ng.addColorStop(0,nc);ng.addColorStop(1,'transparent');
    ctx.fillStyle=ng;ctx.fillRect(0,0,W,H);
  });
  // stars
  getStars().forEach(s=>{
    const a=s.a*(.7+.3*Math.sin(s.twinkle+t*2));
    ctx.fillStyle=`rgba(220,200,255,${a})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
  });
}

// ── 蜘蛛網連線 (只畫可見節點之間的線) ──
function drawTalentWeb(gs_){
  ctx.save(); ctx.lineCap='round';
  for(const t of TALENTS){
    if(!gs_.talentVisible(t.id)) continue;
    const tLvl=gs_.talentLevels[t.id]||0;
    const isPr=(t.minPrestige||0)>=2;
    const isPr1=(t.minPrestige||0)===1;
    for(const reqId of t.req){
      const r2=getTalent(reqId); if(!r2||!gs_.talentVisible(reqId)) continue;
      const rLvl=gs_.talentLevels[reqId]||0;
      const active=tLvl>=1&&rLvl>=1;
      if(isPr)      ctx.strokeStyle=active?'rgba(255,120,40,0.80)':'rgba(120,50,10,0.55)';
      else if(isPr1) ctx.strokeStyle=active?'rgba(220,170,30,0.80)':'rgba(100,70,10,0.55)';
      else           ctx.strokeStyle=active?'rgba(140,70,220,0.75)':'rgba(60,30,100,0.55)';
      ctx.lineWidth=active?2.5:1.5;
      ctx.setLineDash(active?[]:[6,5]);
      ctx.beginPath(); ctx.moveTo(t.x,t.y); ctx.lineTo(r2.x,r2.y); ctx.stroke();
    }
  }
  ctx.setLineDash([]); ctx.restore();
}

// ── 單一天賦節點（含3格等級圓點）──
function drawTalentNode(t,gs_,hov){
  const lvl=gs_.talentLevels[t.id]||0;
  const maxed=lvl>=t.maxLevel;
  const unlocked=gs_.talentUnlocked(t.id);
  const canBuy=!maxed&&unlocked&&gs_.talentPoints>=(t.cost[lvl]||0);
  const r=28;
  const pr=(t.minPrestige||0); // 0=普通, 1=獻祭1次, 2=獻祭2次

  // 主題色 (按 prestige 級別)
  let glowCol,ringActive,ringBought,ringUnlocked,ringLocked,fillBase,fillBought,fillMaxed,pipActive,pipMaxed,labelActive,labelBought,labelLocked;
  if(pr>=2){
    // 火焰紅金：二次獻祭
    glowCol='#ff8830'; ringActive='#ff6020'; ringBought='#ff9050'; ringUnlocked='#b04010'; ringLocked='#3a1000';
    fillBase='#200800'; fillBought='#3a1000'; fillMaxed='#5a1800';
    pipActive='#ff8030'; pipMaxed='#ffb060';
    labelActive='#ffb060'; labelBought='#ff9040'; labelLocked='#6a2800';
  } else if(pr>=1){
    // 琥珀金：一次獻祭
    glowCol='#e8c020'; ringActive='#d4a020'; ringBought='#f0c840'; ringUnlocked='#907010'; ringLocked='#302600';
    fillBase='#1a1400'; fillBought='#2e2000'; fillMaxed='#483000';
    pipActive='#d4a030'; pipMaxed='#f8d050';
    labelActive='#f0d060'; labelBought='#d4a830'; labelLocked='#504010';
  } else {
    // 原始紫色主題
    glowCol='#c090ff'; ringActive='#ffd050'; ringBought='#9050e0'; ringUnlocked='#5030a0'; ringLocked='#1a0840';
    fillBase='#0f0820'; fillBought='#1e0c38'; fillMaxed='#3a2200';
    pipActive='#a060e0'; pipMaxed='#ffd050';
    labelActive='#d4b4ff'; labelBought='#d4b4ff'; labelLocked='#4a2870';
  }

  // 光暈
  if(canBuy){ctx.shadowColor=glowCol;ctx.shadowBlur=22;}
  if(pr>=1&&maxed){ctx.shadowColor=glowCol;ctx.shadowBlur=30;}

  // 節點底色和外環
  const fillCol=maxed?fillMaxed:lvl>0?fillBought:fillBase;
  const ringCol=maxed?ringActive:lvl>0?ringBought:unlocked?ringUnlocked:ringLocked;
  ctx.fillStyle=fillCol; ctx.strokeStyle=ringCol; ctx.lineWidth=maxed?3.5:2.5;
  ctx.beginPath(); ctx.arc(t.x,t.y,r,0,Math.PI*2); ctx.fill(); ctx.stroke();

  // prestige 節點加一個外圈裝飾
  if(pr>=1){
    ctx.strokeStyle=maxed?glowCol:`${ringLocked}88`; ctx.lineWidth=1;
    ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.arc(t.x,t.y,r+5,0,Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.shadowBlur=0;

  // Hover 外圈
  if(hov&&!maxed){
    ctx.strokeStyle=pr>=1?glowCol:'#e0c0ff'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(t.x,t.y,r+8,0,Math.PI*2); ctx.stroke();
  }

  // 上方文字（等級 / 費用）
  ctx.textAlign='center'; ctx.textBaseline='middle';
  if(maxed){
    ctx.fillStyle=pipMaxed; ctx.font='bold 17px sans-serif';
    ctx.fillText('★',t.x,t.y-7);
  } else if(lvl>0){
    ctx.fillStyle=ringBought; ctx.font='bold 13px sans-serif';
    ctx.fillText(`${lvl}/${t.maxLevel}`,t.x,t.y-7);
  } else {
    ctx.fillStyle=unlocked?ringUnlocked:ringLocked; ctx.font='bold 12px sans-serif';
    ctx.fillText(`${t.cost[0]}pt`,t.x,t.y-7);
  }

  // 等級圓點
  const pipR=4.5, pipGap=12;
  const px0=t.x-(t.maxLevel-1)*pipGap/2;
  for(let i=0;i<t.maxLevel;i++){
    ctx.fillStyle=i<lvl?(maxed?pipMaxed:pipActive):(pr>=1?`${ringLocked}cc`:'#2a1450');
    ctx.beginPath(); ctx.arc(px0+i*pipGap,t.y+10,pipR,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=i<lvl?(maxed?pipMaxed:ringBought):(pr>=1?ringLocked:'#4a2870'); ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(px0+i*pipGap,t.y+10,pipR,0,Math.PI*2); ctx.stroke();
  }

  // 節點名稱標籤
  const nameCol=maxed?pipMaxed:lvl>0?labelBought:unlocked?labelActive:labelLocked;
  ctx.fillStyle=nameCol; ctx.font=`${maxed||lvl>0?'bold ':''}12px sans-serif`;
  ctx.fillText(t.name,t.x,t.y+r+14);
}

function showAbilitySelect(gs_){
  if(gs_.abilities.length>=3) return Promise.resolve(); // 已滿
  const owned=new Set(gs_.abilities);
  const pool=ABILITIES.filter(a=>a.source==='general'&&!owned.has(a.id));
  if(pool.length===0) return Promise.resolve();
  // 隨機取 3 個選項（不足3個就全取）
  const opts=[];const used=new Set();
  while(opts.length<Math.min(3,pool.length)){const pick=pool[Math.floor(Math.random()*pool.length)];if(!used.has(pick.id)){used.add(pick.id);opts.push(pick);}}

  return new Promise(resolve=>{
    canvas.style.cursor='default';
    let hov=-1;
    const CW=220,CH=160,GAP=28,SY=200;
    const totalW=opts.length*CW+(opts.length-1)*GAP;
    const SX=(W-totalW)/2;

    function draw(){
      ctx.fillStyle='rgba(5,3,18,0.94)';ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#d4b437';ctx.font='bold 36px sans-serif';ctx.textAlign='center';ctx.textBaseline='top';
      ctx.fillText('選擇一個能力',W/2,50);
      ctx.fillStyle='#6a6a88';ctx.font='14px sans-serif';
      ctx.fillText('此能力將永久保存到你的能力欄（最多3個）',W/2,100);
      opts.forEach((ab,i)=>{
        const rx=SX+i*(CW+GAP),ry=SY;
        const h2=hov===i;
        rRect(rx,ry,CW,CH,10,h2?'#1c1c38':'#141422',ab.col,h2?2:1.5);
        ctx.fillStyle=ab.col;ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.textBaseline='top';
        ctx.fillText(ab.name,rx+CW/2,ry+14);
        ctx.font='32px sans-serif';ctx.textBaseline='middle';
        ctx.fillText(AB_ICONS[ab.id]||'⚡',rx+CW/2,ry+CH/2-10);
        ctx.fillStyle='#a0a0b8';ctx.font='12px sans-serif';ctx.textBaseline='top';
        ab.desc.split('，').forEach((line,li)=>ctx.fillText(line,rx+CW/2,ry+CH-46+li*16));
        ctx.fillStyle='#828296';ctx.font='11px sans-serif';ctx.textBaseline='bottom';
        ctx.fillText('冷卻：'+ab.cooldown+'秒',rx+CW/2,ry+CH-4);
      });
      // 跳過按鈕
      ctx.fillStyle='#4a4a6a';ctx.font='14px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('[ 跳過 ]',W/2,SY+CH+50);
    }
    function onMove(e){
      const r=canvas.getBoundingClientRect(),sc=W/r.width;
      const mx=(e.clientX-r.left)*sc,my=(e.clientY-r.top)*sc;
      mx_=mx;my_=my;
      hov=-1;opts.forEach((ab,i)=>{const rx=SX+i*(CW+GAP);if(mx>=rx&&mx<=rx+CW&&my>=SY&&my<=SY+CH)hov=i;});
    }
    function onClick(e){
      const r=canvas.getBoundingClientRect(),sc=W/r.width;
      const mx=(e.clientX-r.left)*sc,my=(e.clientY-r.top)*sc;
      opts.forEach((ab,i)=>{const rx=SX+i*(CW+GAP);if(mx>=rx&&mx<=rx+CW&&my>=SY&&my<=SY+CH){gs_.addAbility(ab.id);done();}});
      if(Math.abs(mx-W/2)<60&&Math.abs(my-(SY+CH+50))<20) done();
    }
    function done(){canvas.removeEventListener('mousemove',onMove);canvas.removeEventListener('click',onClick);cancelAnimationFrame(raf_);canvas.style.cursor='none';resolve();}
    canvas.addEventListener('mousemove',onMove);canvas.addEventListener('click',onClick);
    let raf_;(function lp(){draw();raf_=requestAnimationFrame(lp);})();
  });
}

function showTableSelect(gs_){
  return new Promise(resolve=>{
    canvas.style.cursor='default';
    let hovIdx=-1, chosen=gs_.selectedTable||'classic';
    const CW=256,CH=188,GAP=32;
    const SX=(W-(2*CW+GAP))/2, SY=118;

    function cardRect(i){
      return {x:SX+(i%2)*(CW+GAP), y:SY+Math.floor(i/2)*(CH+GAP), w:CW, h:CH};
    }
    function drawMiniTable(t,mx,my,mw,mh){
      ctx.save();
      ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(mx-mw/2+3,my-mh/2+4,mw,mh);
      ctx.fillStyle=t.felt1;
      if(t.id==='poker'){
        ctx.beginPath();ctx.ellipse(mx,my,mw/2,mh/2,0,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle=t.border;ctx.lineWidth=3;ctx.stroke();
      }else{
        ctx.fillRect(mx-mw/2,my-mh/2,mw,mh);
        if(t.id==='billiard'){
          ctx.fillStyle='rgba(0,0,0,0.75)';
          [[mx-mw/2,my-mh/2],[mx,my-mh/2],[mx+mw/2,my-mh/2],
           [mx-mw/2,my+mh/2],[mx,my+mh/2],[mx+mw/2,my+mh/2]].forEach(([px,py])=>{
            ctx.beginPath();ctx.arc(px,py,6,0,Math.PI*2);ctx.fill();
          });
        }else if(t.id==='dice'){
          ctx.strokeStyle='rgba(100,100,220,0.35)';ctx.lineWidth=1;
          for(let gx=mx-mw/2+12;gx<mx+mw/2;gx+=12){ctx.beginPath();ctx.moveTo(gx,my-mh/2);ctx.lineTo(gx,my+mh/2);ctx.stroke();}
          for(let gy=my-mh/2+10;gy<my+mh/2;gy+=10){ctx.beginPath();ctx.moveTo(mx-mw/2,gy);ctx.lineTo(mx+mw/2,gy);ctx.stroke();}
        }
        ctx.strokeStyle=t.border;ctx.lineWidth=3;ctx.strokeRect(mx-mw/2,my-mh/2,mw,mh);
      }
      ctx.restore();
    }
    function draw(){
      ctx.fillStyle='rgba(5,3,18,0.92)';ctx.fillRect(0,0,W,H);
      // 標題
      ctx.fillStyle='#d4b437';ctx.font='bold 38px sans-serif';ctx.textAlign='center';ctx.textBaseline='top';
      ctx.fillText('選擇你的桌台',W/2,30);
      ctx.fillStyle='#6a6a88';ctx.font='15px sans-serif';
      ctx.fillText('每次獻祭後可以選擇新桌台，桌台能力即刻生效',W/2,82);
      // 卡片
      TABLES.forEach((t,i)=>{
        const r=cardRect(i),sel=chosen===t.id,hov=hovIdx===i;
        rRect(r.x,r.y,r.w,r.h,10,sel?'#1c1c36':hov?'#181830':'#111120',sel?'#d4b437':hov?'#4a4a70':'#252535',sel?2:1);
        drawMiniTable(t,r.x+r.w/2,r.y+62,108,56);
        ctx.fillStyle=sel?'#f5e070':'#eeeef8';ctx.font='bold 17px sans-serif';ctx.textAlign='center';ctx.textBaseline='top';
        ctx.fillText(t.name,r.x+r.w/2,r.y+104);
        ctx.fillStyle='#888899';ctx.font='12px sans-serif';
        ctx.fillText(t.sub,r.x+r.w/2,r.y+125);
        ctx.fillStyle='#4bc850';ctx.font='bold 12px sans-serif';
        t.bonus.split('\n').forEach((line,li)=>ctx.fillText(line,r.x+r.w/2,r.y+145+li*16));
        if(sel){
          ctx.fillStyle='#d4b437';ctx.font='bold 11px sans-serif';
          ctx.fillText('▶ 已選擇',r.x+r.w/2,r.y+9);
        }
      });
      // 確認按鈕
      const bx=W/2-110,by=H-80,bw=220,bh=50;
      const bhov=mx_>=bx&&mx_<=bx+bw&&my_>=by&&my_<=by+bh;
      rRect(bx,by,bw,bh,10,bhov?'#4a3200':'#2c1e00','#d4b437',2);
      ctx.fillStyle='#f5e070';ctx.font='bold 22px sans-serif';ctx.textBaseline='middle';
      ctx.fillText('確認出發',W/2,by+bh/2);
    }
    function onMove(e){
      const r=canvas.getBoundingClientRect(),sc=W/r.width;
      const mx=(e.clientX-r.left)*sc,my=(e.clientY-r.top)*sc;
      mx_=mx;my_=my;
      hovIdx=-1;
      TABLES.forEach((t,i)=>{const cr=cardRect(i);if(mx>=cr.x&&mx<=cr.x+cr.w&&my>=cr.y&&my<=cr.y+cr.h)hovIdx=i;});
    }
    function onClick(e){
      const r=canvas.getBoundingClientRect(),sc=W/r.width;
      const mx=(e.clientX-r.left)*sc,my=(e.clientY-r.top)*sc;
      TABLES.forEach((t,i)=>{const cr=cardRect(i);if(mx>=cr.x&&mx<=cr.x+cr.w&&my>=cr.y&&my<=cr.y+cr.h)chosen=t.id;});
      const bx=W/2-110,by=H-80,bw=220,bh=50;
      if(mx>=bx&&mx<=bx+bw&&my>=by&&my<=by+bh){
        gs_.selectedTable=chosen;gs_.invalidate();
        // 自動加入桌台專屬能力
        const tableAb=ABILITIES.find(a=>a.source==='table'&&a.table===chosen);
        if(tableAb&&!gs_.abilities.includes(tableAb.id)) gs_.addAbility(tableAb.id);
        canvas.removeEventListener('mousemove',onMove);
        canvas.removeEventListener('click',onClick);
        cancelAnimationFrame(raf_);
        canvas.style.cursor='none';
        resolve();
      }
    }
    canvas.addEventListener('mousemove',onMove);
    canvas.addEventListener('click',onClick);
    let raf_;
    (function loop(){draw();raf_=requestAnimationFrame(loop);})();
  });
}

function showTalentTree(gs_){
  const FADE=0.55; // seconds for fade in/out
  return new Promise(resolve=>{
    let raf_,phase='fadein',fadeAlpha=1,hov_=null,t0=performance.now(),closePending=false;
    const DONE={x:W-120,y:H-50,w:100,h:36};

    const onClick=e=>{
      if(phase!=='idle') return;
      const rect=canvas.getBoundingClientRect(),sc=W/rect.width;
      const mx=(e.clientX-rect.left)*sc,my=(e.clientY-rect.top)*sc;
      if(mx>=DONE.x&&mx<=DONE.x+DONE.w&&my>=DONE.y&&my<=DONE.y+DONE.h){
        phase='fadeout'; fadeAlpha=0; return;
      }
      // 只允許點擊可見節點
      for(const t of TALENTS){
        if(!gs_.talentVisible(t.id)) continue;
        if(Math.hypot(mx-t.x,my-t.y)<=32){if(gs_.buyTalent(t.id)) AUDIO.sfx('talent');gs_.save();break;}
      }
    };
    const onMove=e=>{
      const rect=canvas.getBoundingClientRect(),sc=W/rect.width;
      const mx=(e.clientX-rect.left)*sc,my=(e.clientY-rect.top)*sc;
      // 只 hover 可見節點
      hov_=TALENTS.find(t=>gs_.talentVisible(t.id)&&Math.hypot(mx-t.x,my-t.y)<=32)||null;
    };
    canvas.addEventListener('click',onClick);
    canvas.addEventListener('mousemove',onMove);

    let lastT=performance.now();
    const draw=()=>{
      const now=performance.now(),dt=(now-lastT)/1000;lastT=now;
      const t=(now-t0)/1000;

      if(phase==='fadein'){
        fadeAlpha=Math.max(0,fadeAlpha-dt/FADE);
        if(fadeAlpha<=0) phase='idle';
      } else if(phase==='fadeout'){
        fadeAlpha=Math.min(1,fadeAlpha+dt/FADE);
        if(fadeAlpha>=1){canvas.removeEventListener('click',onClick);canvas.removeEventListener('mousemove',onMove);cancelAnimationFrame(raf_);resolve();return;}
      }

      drawTalentBG(t);
      // 先畫網線再畫節點（線在節點下面）
      drawTalentWeb(gs_);
      TALENTS.filter(t2=>gs_.talentVisible(t2.id)).forEach(t2=>drawTalentNode(t2,gs_,hov_===t2));

      // 天賦點數顯示
      rRect(16,14,220,54,8,'rgba(20,10,40,.82)','#8040c0',2);
      ctx.fillStyle='#c090ff';ctx.font='bold 15px sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText('天賦點數',28,30);
      ctx.fillStyle='#ffd050';ctx.font='bold 26px sans-serif';ctx.fillText(`★ ${gs_.talentPoints}`,28,52);
      ctx.fillStyle='rgba(200,160,255,.85)';ctx.font='bold 18px sans-serif';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText('天賦樹',W/2,16);

      // Tooltip（懸停資訊）
      if(hov_){
        const t2=hov_;
        const lvl=gs_.talentLevels[t2.id]||0;
        const maxed=lvl>=t2.maxLevel;
        const nextCost=maxed?null:t2.cost[lvl];
        const canAfford=!maxed&&gs_.talentPoints>=nextCost;
        const tw=280,th=96,tx=Math.min(W-tw-8,Math.max(8,t2.x-tw/2));
        const ty=t2.y-th-44<8?t2.y+42:t2.y-th-44;
        rRect(tx,ty,tw,th,8,'rgba(12,4,32,.95)','#8040c0',2);
        ctx.fillStyle='#e8d0ff';ctx.font='bold 14px sans-serif';ctx.textAlign='left';ctx.textBaseline='top';
        ctx.fillText(t2.name,tx+12,ty+10);
        ctx.fillStyle='#b090d8';ctx.font='13px sans-serif';
        const effLabel={
          talent_global:'全部收益',talent_flip:'翻幣速度',talent_lucky:'雙倍機率',
          talent_helper:'助手移速',talent_manual:'手動翻幣速度',talent_cd:'自動翻幣冷卻',
          talent_goldmult:'金幣收益',talent_coppmult:'銅幣收益',talent_prestige:'獻祭點數',
          start_silver:'重生+銀幣',start_gold:'重生+金幣',start_skull:'重生+骷髏幣',start_plat:'重生+白金幣',
        };
        const isStart=t2.eff.startsWith('start_');
        const descLine=isStart?`每級給予 +1 枚（共 ${(gs_.talentLevels[t2.id]||0)*1} / ${t2.maxLevel} 枚）`:`${effLabel[t2.eff]||t2.desc} +${(t2.val*100).toFixed(0)}% / 級`;
        ctx.fillText(descLine,tx+12,ty+30);
        ctx.fillStyle='#a080c0';
        ctx.fillText(`等級：${lvl} / ${t2.maxLevel}`,tx+12,ty+50);
        const statusTxt=maxed?'已達最高等級':canAfford?`升級費用：${nextCost} pt`:`需要 ${nextCost} pt（點數不足）`;
        ctx.fillStyle=maxed?'#80d080':canAfford?'#ffd050':'#d08080';
        ctx.fillText(statusTxt,tx+12,ty+70);
      }

      const hovDone=phase==='idle'&&mx_>=DONE.x&&mx_<=DONE.x+DONE.w&&my_>=DONE.y&&my_<=DONE.y+DONE.h;
      rRect(DONE.x,DONE.y,DONE.w,DONE.h,7,hovDone?'#3a1a80':'#2a1060','#8040c0',2);
      ctx.fillStyle='#d4b4ff';ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('完成',DONE.x+DONE.w/2,DONE.y+DONE.h/2);

      if(fadeAlpha>0){ctx.fillStyle=`rgba(0,0,0,${fadeAlpha})`;ctx.fillRect(0,0,W,H);}
      drawCursor(mx_,my_,cursorDown);
      raf_=requestAnimationFrame(draw);
    };
    raf_=requestAnimationFrame(draw);
  });
}

function showSlotScreen(){
  return new Promise(resolve=>{
    const CW=580,CH=118,GAP=22,CX=W/2-CW/2,CY0=H/2-(NUM_SLOTS*CH+(NUM_SLOTS-1)*GAP)/2-10;
    const cr=n=>({x:CX,y:CY0+(n-1)*(CH+GAP),w:CW,h:CH});
    const dr=n=>{const r=cr(n);return{x:r.x+r.w-46,y:r.y+12,w:34,h:34};};
    let raf,running=true;

    const onClick=e=>{
      const rect=canvas.getBoundingClientRect(),s=W/rect.width;
      const cmx=(e.clientX-rect.left)*s,cmy=(e.clientY-rect.top)*s;
      for(let n=1;n<=NUM_SLOTS;n++){
        const prev=GameState.getPreview(n),d=dr(n),c=cr(n);
        if(prev&&cmx>=d.x&&cmx<=d.x+d.w&&cmy>=d.y&&cmy<=d.y+d.h){GameState.deleteSlot(n);return;}
        if(cmx>=c.x&&cmx<=c.x+c.w&&cmy>=c.y&&cmy<=c.y+c.h){running=false;cancelAnimationFrame(raf);canvas.removeEventListener('click',onClick);resolve(n);return;}
      }
    };
    canvas.addEventListener('click',onClick);

    const draw=()=>{
      // 黑色背景
      ctx.fillStyle='#080600';ctx.fillRect(0,0,W,H);

      // 背景放射漸層（中間微亮金）
      const bg2=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.7);
      bg2.addColorStop(0,'rgba(60,44,0,0.55)');bg2.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=bg2;ctx.fillRect(0,0,W,H);

      // 外邊框（三層）
      const bx=18,by=18,bw=W-36,bh=H-36;
      ctx.strokeStyle='#7a5c10';ctx.lineWidth=1;ctx.strokeRect(bx-6,by-6,bw+12,bh+12);
      ctx.strokeStyle='#c8981e';ctx.lineWidth=2.5;ctx.strokeRect(bx,by,bw,bh);
      ctx.strokeStyle='#f0d060';ctx.lineWidth=1;ctx.strokeRect(bx+6,by+6,bw-12,bh-12);

      // 四角裝飾
      const corners=[[bx,by],[bx+bw,by],[bx,by+bh],[bx+bw,by+bh]];
      for(const [cx2,cy2] of corners){
        ctx.strokeStyle='#f0d060';ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(cx2,cy2,10,0,Math.PI*2);ctx.stroke();
        ctx.fillStyle='#c8981e';ctx.beginPath();ctx.arc(cx2,cy2,4,0,Math.PI*2);ctx.fill();
      }

      // 標題區
      ctx.fillStyle='#f5d840';ctx.font='bold 32px serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.shadowColor='#c8981e';ctx.shadowBlur=18;
      ctx.fillText("GAMBLER'S TABLE",W/2,72);
      ctx.shadowBlur=0;

      // 標題下分隔線（金色菱形花紋）
      const lY=108;
      ctx.strokeStyle='#c8981e';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(bx+20,lY);ctx.lineTo(W/2-60,lY);ctx.stroke();
      ctx.beginPath();ctx.moveTo(W/2+60,lY);ctx.lineTo(bx+bw-20,lY);ctx.stroke();
      // 中間菱形
      ctx.fillStyle='#f0d060';ctx.beginPath();ctx.moveTo(W/2,lY-7);ctx.lineTo(W/2+7,lY);ctx.lineTo(W/2,lY+7);ctx.lineTo(W/2-7,lY);ctx.closePath();ctx.fill();

      ctx.fillStyle='#c8b060';ctx.font='14px sans-serif';ctx.textBaseline='middle';ctx.fillText('選擇存檔槽',W/2,lY+24);

      // 存檔卡
      for(let n=1;n<=NUM_SLOTS;n++){
        const prev=GameState.getPreview(n),c=cr(n);
        const hov=mx_>=c.x&&mx_<=c.x+c.w&&my_>=c.y&&my_<=c.y+c.h;
        // 卡片底色
        const cardBg=ctx.createLinearGradient(c.x,c.y,c.x,c.y+c.h);
        cardBg.addColorStop(0,hov?'#1e1800':'#120f00');
        cardBg.addColorStop(1,hov?'#0a0800':'#050400');
        ctx.fillStyle=cardBg;ctx.beginPath();ctx.roundRect(c.x,c.y,c.w,c.h,8);ctx.fill();
        // 卡片外框
        ctx.strokeStyle=prev?(hov?'#f5d840':'#c8981e'):(hov?'#8a7030':'#4a3c10');
        ctx.lineWidth=hov?2.5:1.5;ctx.beginPath();ctx.roundRect(c.x,c.y,c.w,c.h,8);ctx.stroke();

        // 左側號碼框
        const nb={x:c.x+16,y:c.y+CH/2-24,w:44,h:44};
        const nbBg=ctx.createLinearGradient(nb.x,nb.y,nb.x,nb.y+nb.h);
        nbBg.addColorStop(0,prev?'#2a1e00':'#181400');nbBg.addColorStop(1,prev?'#1a1200':'#100c00');
        ctx.fillStyle=nbBg;ctx.beginPath();ctx.roundRect(nb.x,nb.y,nb.w,nb.h,6);ctx.fill();
        ctx.strokeStyle=prev?'#c8981e':'#4a3c10';ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(nb.x,nb.y,nb.w,nb.h,6);ctx.stroke();
        ctx.fillStyle=prev?'#f5d840':'#6a5a30';ctx.font='bold 26px serif';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(n,nb.x+nb.w/2,nb.y+nb.h/2);

        const ix=c.x+76;
        if(prev){
          ctx.fillStyle='#f5d840';ctx.font='bold 18px sans-serif';ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText(`Slot ${n}`,ix,c.y+14);

      const t=ac.currentTime;[[_D4,.18],[_F4,.18],[_A4,.18],[_D5,.55]].forEach(([freq,dur],i)=>{const d=i*.2;const o=ac.createOscillator(),g=ac.createGain();o.type='square';const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=2000;o.frequency.value=freq;g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.32,t+d+.02);g.gain.setValueAtTime(.32,t+d+dur-.04);g.gain.linearRampToValueAtTime(0,t+d+dur);o.connect(f);f.connect(g);g.connect(ac.destination);o.start(t+d);o.stop(t+d+dur+.05);});
      const t2=t+.6;[_D4,_A4,_D5].forEach((freq,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.18/(i+1),t2);g.gain.exponentialRampToValueAtTime(.001,t2+1);o.connect(g);g.connect(ac.destination);o.start(t2);o.stop(t2+1.1);});
    },
  };
  // ── BGM 播放器 ──
  const bgm={current:null,playing:false,timer:null,next:0};
  let bgmGain=null;
  function _runBGM(which){
    const ac=getAC();
    // 為這次 BGM 建立獨立 GainNode，方便立即淡出
    bgmGain=ac.createGain();
    bgmGain.gain.setValueAtTime(1,ac.currentTime);
    bgmGain.connect(ac.destination);
    bgm.current=which;bgm.playing=true;bgm.next=ac.currentTime+.05;
    const fn=which==='main'?scheduleMain:scheduleTalent;
    const dest=bgmGain;
    const tick=()=>{
      if(!bgm.playing) return;
      while(bgm.next<ac.currentTime+.4) bgm.next+=fn(ac,dest,bgm.next);
      bgm.timer=setTimeout(tick,120);
    };
    tick();
  }
  return {
    start(){ if(!bgm.playing) _runBGM('main'); },
    switchBGM(which){
      if(bgm.current===which&&bgm.playing) return;
      clearTimeout(bgm.timer); bgm.playing=false;
      // 把舊 BGM 的 GainNode 快速淡出（80ms），讓已排程的音符靜音
      if(bgmGain){ const ac=getAC(); bgmGain.gain.setTargetAtTime(0,ac.currentTime,0.025); }
      _runBGM(which);
    },
    sfx(name){ try{ const ac=getAC(); SFX[name]?.(ac); }catch(_){} },
  };
})();

function drawCursor(mx,my,down){
  const dx=down?3:0, dy=down?3:0;
  ctx.save();
  ctx.translate(Math.round(mx+dx),Math.round(my+dy));
  ctx.rotate(-Math.PI/4);
  ctx.lineJoin='round'; ctx.lineCap='round';

  const W_='#ffffff', DK='#cccccc', OL='#333333';
  function fill(lw){
    ctx.fillStyle=W_; ctx.fill();
    ctx.strokeStyle=OL; ctx.lineWidth=lw||2; ctx.stroke();
  }

  // 拳頭主體（掌心）
  ctx.beginPath(); ctx.roundRect(0,17,20,15,6); fill();

  // 三個捲指關節凸起
  ctx.beginPath(); ctx.ellipse(3, 16,4,6.5,0,0,Math.PI*2); fill();
  ctx.beginPath(); ctx.ellipse(10,15,4,6.0,0,0,Math.PI*2); fill();
  ctx.beginPath(); ctx.ellipse(17,16,3.5,5.5,0,0,Math.PI*2); fill();

  // 食指
  ctx.beginPath(); ctx.roundRect(-4,0,8,21,[4,4,2,2]); fill();

  // 關節橫紋
  ctx.strokeStyle=DK; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(-2.5,7);  ctx.lineTo(2.5,7);  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-2.5,13); ctx.lineTo(2.5,13); ctx.stroke();

  ctx.restore();
}

function initEvents(){
  canvas.style.cursor='none';
  canvas.addEventListener('mousedown',e=>{
    cursorDown=true;
    if(settingsOpen){
      const r=canvas.getBoundingClientRect(),s=W/r.width,cmx=(e.clientX-r.left)*s,cmy=(e.clientY-r.top)*s;
      for(const sr of settingsCtrlRects){
        if(sr.type==='slider'&&cmx>=sr.x&&cmx<=sr.x+sr.w&&cmy>=sr.y&&cmy<=sr.y+sr.h){
          draggingSlider=sr; CFG[sr.key]=Math.max(0,Math.min(1,(cmx-sr.sx)/sr.sw)); break;
        }
      }
    }
  });
  document.addEventListener('mouseup',()=>{cursorDown=false;draggingSlider=null;});
  canvas.addEventListener('mousemove',e=>{
    const r=canvas.getBoundingClientRect(),s=W/r.width;
    mx_=(e.clientX-r.left)*s; my_=(e.clientY-r.top)*s;
    if(draggingSlider) CFG[draggingSlider.key]=Math.max(0,Math.min(1,(mx_-draggingSlider.sx)/draggingSlider.sw));
  });
  canvas.addEventListener('click',e=>{
    const r=canvas.getBoundingClientRect(),s=W/r.width,cmx=(e.clientX-r.left)*s,cmy=(e.clientY-r.top)*s;
    // 齒輪按鈕（左下角）
    if(cmx>=BORDER_W&&cmx<=BORDER_W+56&&cmy>=H-BORDER_W&&cmy<=H){settingsOpen=!settingsOpen;achievementsOpen=false;infoOpen=false;return;}
    // 獎盃按鈕（成就系統）
    if(cmx>=BORDER_W+62&&cmx<=BORDER_W+102&&cmy>=H-BORDER_W&&cmy<=H){achievementsOpen=!achievementsOpen;settingsOpen=false;infoOpen=false;return;}
    // i 資訊按鈕
    if(cmx>=BORDER_W+108&&cmx<=BORDER_W+143&&cmy>=H-BORDER_W&&cmy<=H){infoOpen=!infoOpen;settingsOpen=false;achievementsOpen=false;return;}
    // 點擊空白關閉資訊框
    if(infoOpen){infoOpen=false;return;}
    // 成就面板點擊
    if(achievementsOpen){
      const MW=660,MH=580,MX=(W-MW)/2,MY=(H-MH)/2;
      const inside=cmx>=MX&&cmx<=MX+MW&&cmy>=MY&&cmy<=MY+MH;
      if(inside){
        for(const ar of achCtrlRects){
          if(cmx>=ar.x&&cmx<=ar.x+ar.w&&cmy>=ar.y&&cmy<=ar.y+ar.h){
            if(ar.type==='close') achievementsOpen=false;
            else if(ar.type==='cat') achOpenCats[ar.key]=!achOpenCats[ar.key];
            return;
          }
        }
      } else { achievementsOpen=false; }
      return;
    }
    // 設定面板點擊
    if(settingsOpen){
      const MW=1100,MH=660,MX=(W-MW)/2,MY=(H-MH)/2;
      const inside=cmx>=MX&&cmx<=MX+MW&&cmy>=MY&&cmy<=MY+MH;
      if(inside){
        for(const sr of settingsCtrlRects){
          if(cmx>=sr.x&&cmx<=sr.x+sr.w&&cmy>=sr.y&&cmy<=sr.y+sr.h){
            if(sr.type==='close') settingsOpen=false;
            else if(sr.type==='tab') settingTab=sr.val;
            else if(sr.type==='toggle') CFG[sr.key]=!CFG[sr.key];
            else if(sr.type==='btn') CFG[sr.key]=sr.val;
            else if(sr.type==='slider') CFG[sr.key]=Math.max(0,Math.min(1,(cmx-sr.sx)/sr.sw));
            else if(sr.type==='ach_cat') achOpenCats[sr.key]=!achOpenCats[sr.key];
            return;
          }
        }
      } else { settingsOpen=false; }
      return;
    }
    if(gs.unlockQueue.length){gs.unlockQueue.shift();return;}
    const res=getClickTarget(cmx,cmy);
    if(res){
      if(res.kind==='tab'){if(res.val!==tab){tab=res.val;scroll=0;}}
      else if(res.kind==='upgrade'){
        const prevLen=gs.unlockQueue.length;
        if(e.ctrlKey){
          // Ctrl+click：連續購買直到買不起為止
          let bought=false;
          while(gs.buyUpgrade(res.val,spawnCoin,spawnHelper)) bought=true;
          if(bought){ gs.save(); AUDIO.sfx('buy'); if(gs.unlockQueue.length>prevLen) AUDIO.sfx('unlock'); }
        } else {
          if(gs.buyUpgrade(res.val,spawnCoin,spawnHelper)){
            gs.save(); AUDIO.sfx('buy');
            if(gs.unlockQueue.length>prevLen) AUDIO.sfx('unlock');
          }
        }
      }
      else if(res.kind==='ability'){
        const ab=getAbility(res.val);
        if(!ab||(gs.abilityCooldowns[res.val]||0)>0) return;
        gs.abilityCooldowns[res.val]=ab.cooldown;
        if(ab.duration>0) gs.activeEffects.push({id:res.val,eff:ab.eff,val:ab.val,remaining:ab.duration});
        if(ab.eff==='instant_money'){
          let ps=0;for(const c of coins) ps+=gs.coinValue(c.type)/gs.flipCooldown(c.type);
          const gained=ps*ab.val;gs.money+=gained;gs.totalEarned+=gained;gs.notify('+'+fmt(gained)+'$','#e05020');
        }else if(ab.eff==='next_double'){
          gs.nextDoubleCount+=ab.val;gs.notify('下'+ab.val+'枚必定雙倍！','#d4b437');
        }else if(ab.eff==='instant_resolve'){
          for(const c of coins) if(c.state==='up'||c.state==='down'){c.state='squish';c.squishT=0;c.spinAngle=0;c.spinSpeed=0;c.curY=c.baseY;if(!c.resolved){c.resolved=true;c._resolve(gs);}}
          gs.notify('全部硬幣瞬間結算！','#4bc850');
        }else if(ab.eff==='spawn_high'){
          const tiers=[PLAT,GOLD,SKULL,SILVER,COPPER];
          const best=tiers.find(t=>(gs.upgradeLevels[t+'_coin']||0)>0)||COPPER;
          for(let i=0;i<ab.val;i++) spawnCoin(best);gs.notify('生成高等硬幣！','#5080ff');
        }else if(ab.eff==='spawn_skull'){
          for(let i=0;i<ab.val;i++) spawnCoin(SKULL);gs.notify('骷髏幣降臨！','#9966dd');
        }else if(ab.duration>0) gs.notify(ab.name+' 啟動！',ab.col);
        gs.stats.abilitiesUsed=(gs.stats.abilitiesUsed||0)+1;
        checkAchievements(gs);
        triggerAbilityFX(ab);
        AUDIO.sfx('talent');
      }
      else if(res.kind==='prestige_shop'){
        if(gs.buyPrestigeShop(res.val)){gs.save();AUDIO.sfx('buy');gs.notify('永恆加成購買！','#d4b437');}
      }
      else if(res.kind==='sacrifice'){
        const testPts=Math.max(0,Math.floor(gs.totalEarned/gs.sacrificeThreshold()));
        if(testPts<=0) return;
        // 截圖目前畫面作為動畫背景
        const bgSnap=document.createElement('canvas');
        bgSnap.width=W;bgSnap.height=H;
        bgSnap.getContext('2d').drawImage(canvas,0,0);
        // 快照硬幣與助手位置
        const snapC=coins.map(c=>({x:c.x,y:c.baseY,type:c.type}));
        const snapH=helpers.map(h=>({x:h.x,y:h.y}));
        AUDIO.sfx('sacrifice');
        gamePaused=true;
        new Promise(resolve=>{
          blackHoleFX={bgSnap,snapC,snapH,t:0,ang:0,lastTs:performance.now(),onDone:resolve};
        }).then(()=>{
          const pts=gs.sacrifice(rebuild);bgCache=null;checkAchievements(gs);gs.save();
          if(pts>0){
            if(gs.prestigeCount===1) setTimeout(()=>AUDIO.sfx('milestone'),200);
            AUDIO.switchBGM('talent');
            showTalentTree(gs).then(()=>showTableSelect(gs)).then(()=>showAbilitySelect(gs)).then(()=>{bgCache=null;AUDIO.switchBGM('main');gamePaused=false;rebuild();gs.save();});
          } else { gamePaused=false; }
        });
      }
      return;
    }
    if(cmx<GAME_W){
      // 技能樹進度條點擊（底部）
      const sbX=(GAME_W-400)/2,sbY=H-BORDER_W-64;
      if(cmx>=sbX&&cmx<=sbX+400&&cmy>=sbY&&cmy<=sbY+64&&!gamePaused){
        gamePaused=true;
        AUDIO.switchBGM('talent');
        showTalentTree(gs).then(()=>{AUDIO.switchBGM('main');gamePaused=false;});
        return;
      }
      const woken=helpers.find(h=>h.sleeping&&Math.hypot(h.x-cmx,h.y-cmy)<30);
      if(woken){woken.sleeping=false;woken.sleepTimer=0;return;}
      let best=null,bd=Infinity;for(const c of coins){if(c.isClicked(cmx,cmy)){const d=(c.x-cmx)**2+(c.y-cmy)**2;if(d<bd){bd=d;best=c;}}}if(best) best.triggerFlip(gs,true);
    }
  });
  canvas.addEventListener('wheel',e=>{
    if(achievementsOpen){
      const MW=660,MH=580,MX=(W-MW)/2,MY=(H-MH)/2;
      if(mx_>=MX&&mx_<=MX+MW&&my_>=MY&&my_<=MY+MH){
        let contentH=0;
        for(const cat of ACH_CATS){contentH+=47;if(achOpenCats[cat.key])contentH+=cat.ids.length*47;}
        const maxScroll=Math.max(0,contentH-(MH-52));
        achScroll=Math.max(0,Math.min(maxScroll,achScroll+e.deltaY*.5));
        e.preventDefault(); return;
      }
    }
    if(settingsOpen&&settingTab==='成就'){
      const MW=1100,MH=660,MX=(W-MW)/2,MY=(H-MH)/2;
      if(mx_>=MX&&mx_<=MX+MW&&my_>=MY+98&&my_<=MY+MH){
        let contentH=0;
        for(const cat of ACH_CATS){contentH+=47;if(achOpenCats[cat.key])contentH+=cat.ids.length*45;}
        const maxScroll=Math.max(0,contentH-490);
        sAchScroll=Math.max(0,Math.min(maxScroll,sAchScroll+e.deltaY*.5));
        e.preventDefault(); return;
      }
    }
    if(mx_>=GAME_W){
      if(tab==='sacrifice'){
        const shopItems=PRESTIGE_SHOP.filter(p=>gs.prestigeCount>=p.req);
        const IH=52, totH=shopItems.length*IH;
        const shopAreaH=H-HUD_H-TAB_H-PANEL_LABEL_H-12-280; // approx shop area
        sacScroll=Math.max(0,Math.min(Math.max(0,totH-shopAreaH),sacScroll+e.deltaY*.5));
      } else {
        const ay=H-ABILITY_H-12;
        if(my_>=ay){
          const IH=56,totH=gs.abilities.length*IH,crH=ABILITY_H-30,max=Math.max(0,totH-crH);
          abScroll=Math.max(0,Math.min(max,abScroll+e.deltaY*.5));
        } else {
          const vis=visUpgrades(gs),tot=vis.length*62,max=Math.max(0,tot-(H-HUD_H-TAB_H-PANEL_LABEL_H-ABILITY_H-20));
          scroll=Math.max(0,Math.min(max,scroll+e.deltaY*.5));
        }
      }
    }
    e.preventDefault();
  },{passive:false});
  document.addEventListener('keydown',e=>{if(e.key==='Escape') gs.save();});
  window.addEventListener('beforeunload',()=>{if(gs) gs.save();});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&gs) gs.save();});
}

const STABS=['通用','音效','顯示','成就','補助功能'];
const ROW_H=80;

function _sRow(x,y,label,sub){
  ctx.fillStyle='#e8e8e8';ctx.font='bold 16px sans-serif';ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText(label,x,y+12);
  if(sub){ctx.fillStyle='#888';ctx.font='12px sans-serif';ctx.fillText(sub,x,y+35);}
}
function _sToggle(x,y,w,val,label,sub,key){
  _sRow(x,y,label,sub);
  const tw=58,th=32,tx=x+w-tw,ty=y+(ROW_H-th)/2;
  ctx.fillStyle=val?'#4bc850':'#484848';ctx.beginPath();ctx.roundRect(tx,ty,tw,th,16);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(val?tx+tw-16:tx+16,ty+16,12,0,Math.PI*2);ctx.fill();
  settingsCtrlRects.push({type:'toggle',key,x:tx,y:ty,w:tw,h:th});
}
function _sSlider(x,y,w,val,label,key){
  _sRow(x,y,label+' — '+Math.round(val*100)+'%',null);
  const sw=220,sh=8,sx=x+w-sw,sy=y+52;
  ctx.fillStyle='#3a3a3a';ctx.beginPath();ctx.roundRect(sx,sy,sw,sh,4);ctx.fill();
  ctx.fillStyle='#d4b437';ctx.beginPath();ctx.roundRect(sx,sy,sw*val,sh,4);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(sx+sw*val,sy+sh/2,11,0,Math.PI*2);ctx.fill();
  settingsCtrlRects.push({type:'slider',key,val,sx,sy:sy-11,sw,x:sx,y:sy-11,w:sw,h:sh+22});
}
function _sBtns(x,y,w,opts,val,label,sub,key){
  _sRow(x,y,label,sub);
  const BW=72,BH=36,gap=6,startX=x+w-opts.length*(BW+gap)+gap;
  opts.forEach((o,i)=>{
    const bx=startX+i*(BW+gap),by=y+(ROW_H-BH)/2;const act=val===o.v;
    ctx.fillStyle=act?'#d4b437':'#2e2e2e';ctx.beginPath();ctx.roundRect(bx,by,BW,BH,5);ctx.fill();
    ctx.strokeStyle=act?'#f0c820':'#555';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(bx,by,BW,BH,5);ctx.stroke();
    ctx.fillStyle=act?'#111':'#bbb';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(o.l,bx+BW/2,by+BH/2);
    settingsCtrlRects.push({type:'btn',key,val:o.v,x:bx,y:by,w:BW,h:BH});
  });
}
function _sDivider(x,y,w){ctx.strokeStyle='#2a2a2a';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w,y);ctx.stroke();}

function _drawSettingsContent(x,y,w){
  ctx.save();ctx.textAlign='left';
  const R=ROW_H, D=8;
  switch(settingTab){
    case '通用':
      _sToggle(x,y,w,CFG.showNotifs,'通知提示','獲得收益時顯示飄字','showNotifs');

    case '音效':

      _sDivider(x,y+R*3+D*2,w);

      _sDivider(x,y+R,w);
      _sToggle(x,y+R+D,w,CFG.particleFX,'粒子特效','背景粒子與動態效果','particleFX');
      _sDivider(x,y+R*2+D,w);
      _sToggle(x,y+R*2+D*2,w,CFG.bgAnim,'背景動畫','滾動硬幣背景圖案','bgAnim');

      _sToggle(x,y+R*3+D*3,w,CFG.showFPS,'顯示 FPS','在右上角顯示幀率','showFPS');
      break;
    case '成就':{
      // 總覽列
      const achTotal=ACHIEVEMENTS.length;
      const achUnlocked=ACHIEVEMENTS.filter(a=>gs.achievements[a.id]).length;
      ctx.fillStyle='#aaaaaa';ctx.font='bold 13px sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';
      ctx.fillText(`🏆  已解鎖 ${achUnlocked} / ${achTotal} 個成就`,x,y+12);
      const opbx=x+240,opby=y+7,opbw=320,opbh=10;
      ctx.fillStyle='#181818';ctx.beginPath();ctx.roundRect(opbx,opby,opbw,opbh,4);ctx.fill();
      if(achUnlocked>0){ctx.fillStyle=achUnlocked===achTotal?'#4bc850':'#d4b437';ctx.beginPath();ctx.roundRect(opbx,opby,Math.round(opbw*achUnlocked/achTotal),opbh,4);ctx.fill();}
      // 分類列表
      const CAT_H=44,ACH_H=42,GAP=3,listY=y+30;
      const availH=490;
      let totalH=0;
      for(const cat of ACH_CATS){totalH+=CAT_H+GAP;if(achOpenCats[cat.key])totalH+=cat.ids.length*(ACH_H+GAP);}
      const maxSc=Math.max(0,totalH-availH);
      sAchScroll=Math.max(0,Math.min(sAchScroll,maxSc));
      ctx.save();ctx.beginPath();ctx.rect(x,listY,w,availH);ctx.clip();
      let ly=listY-sAchScroll;
      for(const cat of ACH_CATS){
        const open=!!achOpenCats[cat.key];
        const catAchs=cat.ids.map(id=>ACHIEVEMENTS.find(a=>a.id===id)).filter(Boolean);
        const catDone=catAchs.filter(a=>gs.achievements[a.id]).length;
        const allDone=catDone===catAchs.length;
        if(ly+CAT_H>listY&&ly<listY+availH){
          const hov=mx_>=x&&mx_<=x+w&&my_>=ly&&my_<=ly+CAT_H;
          ctx.fillStyle=allDone?'#2d2510':hov?'#2a2a2a':'#222222';
          ctx.strokeStyle=allDone?'#7a6010':'#383838';ctx.lineWidth=1;
          ctx.beginPath();ctx.roundRect(x,ly,w,CAT_H,5);ctx.fill();ctx.stroke();
          ctx.font='18px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
          ctx.fillText(cat.icon,x+22,ly+CAT_H/2);
          ctx.fillStyle=allDone?'#e8d060':'#cccccc';ctx.font='bold 13px sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';
          ctx.fillText(cat.name,x+42,ly+CAT_H/2);

    case '補助功能':

      break;
  }
  ctx.restore();
}

function drawSacrificeBar(gs, ts){
  const barW=400, barH=60;
  const barX=Math.round((GAME_W-barW)/2);
  const barY=H-BORDER_W-barH-4;
  const cr=6;

  const thresh=gs.sacrificeThreshold();
  const progress=thresh>0?Math.min(1,Math.max(0,gs.totalEarned/thresh)):0;

  const fillW=barW*progress;
  const fillX=barX+fillW; // 血液右邊界

  const phase=ts*0.004; // 加快流動速度
  const waveAmp=4;
  const surfBase=barY+barH*0.20; // 血液高度佔 80%，表面在上方 20%

  const waveY=(x)=>{
    const relX=x-barX;
    return surfBase
      +Math.sin(relX*0.038+phase      )*waveAmp
      +Math.sin(relX*0.022-phase*1.6  )*waveAmp*0.45;
  };

  ctx.save();
  ctx.beginPath(); ctx.roundRect(barX,barY,barW,barH,cr); ctx.clip();

  // ── 深紅底色 ──
  ctx.fillStyle='#1a0202'; ctx.fillRect(barX,barY,barW,barH);

  // ── 血液（左往右，上表面是跨全寬波浪，下方填到底）──
  if(progress>0.005){
    ctx.beginPath();
    ctx.moveTo(barX, barY+barH);
    ctx.lineTo(fillX, barY+barH);
    ctx.lineTo(fillX, waveY(fillX));
    for(let x=fillX; x>=barX; x-=2) ctx.lineTo(x, waveY(x));
    ctx.closePath();

    const bg=ctx.createLinearGradient(barX,barY,barX,barY+barH);
    bg.addColorStop(0,'#cc1010');
    bg.addColorStop(0.4,'#a80c0c');
    bg.addColorStop(1,'#5c0404');
    ctx.fillStyle=bg; ctx.fill();

    // 波浪表面高光
    ctx.beginPath();
    for(let x=barX; x<=fillX; x+=2){
      x===barX?ctx.moveTo(x,waveY(x)):ctx.lineTo(x,waveY(x));
    }
    ctx.strokeStyle='rgba(255,120,80,0.60)'; ctx.lineWidth=2; ctx.stroke();

    // 內部流紋
    for(let i=0;i<3;i++){
      const lineBase=barY+barH*(0.30+i*0.25);
      const lph=phase*(0.85+i*0.38)+i*1.9;
      ctx.beginPath();
      for(let x=barX; x<=fillX; x+=3){
        const y=lineBase+Math.sin((x-barX)*0.030+lph)*2.5;
        x===barX?ctx.moveTo(x,y):ctx.lineTo(x,y);
      }
      ctx.strokeStyle=`rgba(60,0,0,${0.22-i*0.05})`; ctx.lineWidth=1; ctx.stroke();
    }

    // ── 血色泡泡（用時間＋索引產生偽隨機，不存 state）──
    const BUBBLE_N=14;
    for(let i=0;i<BUBBLE_N;i++){
      // 每顆泡泡有固定 X 位置（在血液範圍內）和各自週期
      const bx=barX+((i*97+31)%Math.max(1,Math.floor(fillW)));
      if(bx>=fillX) continue;
      const period=1800+i*260;          // 每顆週期不同（ms）
      const t=(ts+i*370)%period;        // 各自時間偏移
      const lifeRatio=t/period;         // 0→1 為一個生命週期
      const r=1.5+((i*53)%3)*0.8;      // 半徑 1.5~3.9
      // Y：從血液底部往上浮，接近波浪面時消失
      const bottomY=barY+barH-2;
      const topY=waveY(bx)+r+1;
      const by=bottomY-(bottomY-topY)*lifeRatio;
      const alpha=lifeRatio<0.15
        ? lifeRatio/0.15               // 淡入
        : lifeRatio>0.80
          ? (1-lifeRatio)/0.20         // 淡出
          : 1;
      if(by<topY) continue;
      ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI*2);
      ctx.fillStyle=`rgba(200,30,30,${alpha*0.70})`;  ctx.fill();
      ctx.strokeStyle=`rgba(255,90,60,${alpha*0.55})`; ctx.lineWidth=0.8; ctx.stroke();
    }
  }

  // 上下內陰影
  const sg=ctx.createLinearGradient(barX,barY,barX,barY+barH);
  sg.addColorStop(0,'rgba(0,0,0,0.50)');
  sg.addColorStop(0.20,'rgba(0,0,0,0)');
  sg.addColorStop(0.80,'rgba(0,0,0,0)');
  sg.addColorStop(1,'rgba(0,0,0,0.50)');
  ctx.fillStyle=sg; ctx.fillRect(barX,barY,barW,barH);

  // ── 白色大字「技能樹 N」──
  const prestige=gs.prestigeCount||0;
  ctx.shadowColor='rgba(0,0,0,0.85)'; ctx.shadowBlur=7;
  ctx.fillStyle='rgba(255,255,255,0.95)';
  ctx.font='bold 24px sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(`技能樹  ${prestige}`, barX+barW/2, barY+barH/2);
  ctx.shadowBlur=0;

  ctx.restore();

  // 細金框
  ctx.strokeStyle='#c4a020'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.roundRect(barX,barY,barW,barH,cr); ctx.stroke();
}

  const unlocked=ACHIEVEMENTS.filter(a=>gs.achievements[a.id]).length;

  // 裁剪區域
  ctx.save();ctx.beginPath();ctx.rect(MX,MY+50,MW,visH);ctx.clip();
  let cy=MY+52-achScroll;

  for(const cat of ACH_CATS){
    const open=!!achOpenCats[cat.key];
    const catAchs=cat.ids.map(id=>ACHIEVEMENTS.find(a=>a.id===id)).filter(Boolean);
    const catDone=catAchs.filter(a=>gs.achievements[a.id]).length;
    const allDone=catDone===catAchs.length;

      ctx.fillText(cat.name,MX+44,cy+CAT_H/2);

        ctx.beginPath();ctx.roundRect(pbx,pby,Math.round(pbw*catDone/catAchs.length),pbh,4);ctx.fill();
      }
      // 進度數字

      ctx.fillStyle=allDone?'#d4b437':'#555555';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(open?'▲':'▼',MX+MW-18,cy+CAT_H/2);
      achCtrlRects.push({type:'cat',key:cat.key,x:MX+6,y:cy,w:MW-12,h:CAT_H});

    cy+=CAT_H+GAP;

    // 成就列表（展開時）
    if(open){

        if(cy+ACH_H>MY+50&&cy<MY+MH){
          const done=!!gs.achievements[a.id];
          ctx.fillStyle=done?'#1e1c10':'#181818';
          ctx.strokeStyle=done?'#4a3d10':'#252525';ctx.lineWidth=1;
          ctx.beginPath();ctx.roundRect(MX+20,cy,MW-40,ACH_H,4);ctx.fill();ctx.stroke();

          else{ctx.font='12px sans-serif';ctx.fillStyle='#2e2e2e';ctx.fillText('🔒',MX+MW-24,cy+ACH_H/2);}
        }

  ctx.restore();

  // 捲軸
  if(maxScroll>0){

    const bt=MY+52+(th-bh)*(achScroll/maxScroll);

    ctx.fillStyle='#505050';ctx.beginPath();ctx.roundRect(MX+MW-8,bt,5,bh,2);ctx.fill();
  }

function _star5(x,y,r,col){
  ctx.fillStyle=col;ctx.beginPath();
  for(let i=0;i<5;i++){const a=i*Math.PI*0.4-Math.PI/2,a2=a+Math.PI/5;
    i===0?ctx.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r):ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);

}

      screenFX.push({type:'particles',t:0,dur:2.2,pts});

      screenFX.push({type:'particles',t:0,dur:2.0,pts});

function drawScreenFX(dt){
  if(!screenFX.length) return;
  ctx.save();
  ctx.beginPath();ctx.rect(0,HUD_H,GAME_W,H-HUD_H);ctx.clip();
  screenFX=screenFX.filter(e=>{
    e.t+=dt; const p=e.t/e.dur; if(p>=1) return false;
    switch(e.type){
      case 'flash':
        ctx.globalAlpha=e.alpha*(1-p);ctx.fillStyle=e.col;
        ctx.fillRect(0,HUD_H,GAME_W,H-HUD_H);ctx.globalAlpha=1;
        break;
      case 'particles':
        e.pts.forEach(pt=>{
          pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; pt.vy+=110*dt;
          const lp=Math.max(0,1-p); ctx.globalAlpha=lp;
          if(pt.sh==='circle'){
            ctx.fillStyle=pt.col;ctx.beginPath();ctx.arc(pt.x,pt.y,pt.sz*(.3+lp*.7),0,Math.PI*2);ctx.fill();
          } else if(pt.sh==='star'){
            _star5(pt.x,pt.y,pt.sz,pt.col);
          } else {
            ctx.fillStyle=pt.col;ctx.font=`bold ${pt.sz}px sans-serif`;
            ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(pt.sh,pt.x,pt.y);
          }
        });
        ctx.globalAlpha=1;
        break;
      case 'speed_lines':
        ctx.strokeStyle=e.col;ctx.lineWidth=1.5;
        e.lines.forEach(ln=>{
          ln.x+=ln.sp*dt;
          ctx.globalAlpha=(1-p)*.75;ctx.beginPath();
          ctx.moveTo(Math.max(0,ln.x-ln.len),ln.y);ctx.lineTo(Math.min(GAME_W,ln.x),ln.y);ctx.stroke();
        });
        ctx.globalAlpha=1;
        break;
      case 'rings':
        for(let i=0;i<e.n;i++){
          const rp=(p+i/e.n)%1;
          ctx.globalAlpha=(1-rp)*.75;ctx.strokeStyle=e.col;ctx.lineWidth=2.5;
          ctx.beginPath();ctx.arc(e.cx,e.cy,rp*440,0,Math.PI*2);ctx.stroke();
        }
        ctx.globalAlpha=1;
        break;
      case 'shockwave':
        ctx.globalAlpha=(1-p)*.9;ctx.strokeStyle=e.col;ctx.lineWidth=4*(1-p*.55);
        ctx.beginPath();ctx.arc(e.cx,e.cy,p*520,0,Math.PI*2);ctx.stroke();
        ctx.globalAlpha=1;
        break;
      case 'lightning':
        ctx.globalAlpha=Math.random()*(1-p)*.85;ctx.strokeStyle=e.col;
        for(let i=0;i<6;i++){
          ctx.lineWidth=.5+Math.random()*2;
          const x0=Math.random()*GAME_W; let cx2=x0,cy2=HUD_H;
          ctx.beginPath();ctx.moveTo(cx2,cy2);
          for(let j=0;j<8;j++){cx2+=(Math.random()-.5)*110;cy2+=(H-HUD_H)/8;ctx.lineTo(cx2,cy2);}
          ctx.stroke();
        }
        ctx.globalAlpha=1;
        break;
    }
    return true;
  });
  ctx.restore();
}

// ═══════════════════════════════════════════════════════
// BLACK HOLE SACRIFICE FX
// ═══════════════════════════════════════════════════════
function _drawBH(cx,cy,r,p,ang){
  for(let i=4;i>=1;i--){
    ctx.globalAlpha=0.08*(5-i)*p;
    ctx.strokeStyle='#aa44ff';ctx.lineWidth=3+i;
    ctx.beginPath();ctx.arc(cx,cy,r*(1+i*0.38),0,Math.PI*2);ctx.stroke();
  }
  ctx.globalAlpha=1;
  const N=16;
  for(let i=0;i<N;i++){
    const a=ang+i*(Math.PI*2/N);
    const r1=r*0.82,r2=r*1.5;
    const g=ctx.createLinearGradient(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1,cx+Math.cos(a+0.5)*r2,cy+Math.sin(a+0.5)*r2);
    g.addColorStop(0,`rgba(230,110,255,${0.9*p})`);g.addColorStop(1,'rgba(0,0,60,0)');
    ctx.strokeStyle=g;ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);ctx.lineTo(cx+Math.cos(a+0.5)*r2,cy+Math.sin(a+0.5)*r2);ctx.stroke();
  }
  const dg=ctx.createRadialGradient(cx,cy,r*0.68,cx,cy,r*1.55);
  dg.addColorStop(0,`rgba(210,80,255,${0.95*p})`);dg.addColorStop(0.3,`rgba(130,50,210,${0.6*p})`);
  dg.addColorStop(0.65,`rgba(40,8,90,${0.22*p})`);dg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=dg;ctx.beginPath();ctx.arc(cx,cy,r*1.55,0,Math.PI*2);ctx.fill();
  const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,r*1.08);
  cg.addColorStop(0,'#000000');cg.addColorStop(0.64,'#000000');
  cg.addColorStop(0.9,'rgba(18,0,42,0.92)');cg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=cg;ctx.beginPath();ctx.arc(cx,cy,r*1.08,0,Math.PI*2);ctx.fill();
  if(r>18){
    const es=Math.min(r*1.2,80);
    ctx.globalAlpha=Math.min(1,p*2.5)*Math.min(1,(r-18)/25);
    ctx.font=`${Math.round(es)}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('👁',cx,cy);ctx.globalAlpha=1;
  }
}

function updateAndDrawBlackHoleFX(ts){
  const bh=blackHoleFX; if(!bh) return;
  const dt=Math.min(0.05,(ts-bh.lastTs)/1000); bh.lastTs=ts; bh.t+=dt;
  const SUCK=2.2, COLLAPSE=0.7, FADE=0.55;
  const {bgSnap,snapC,snapH,t}=bh;
  const CX=(PLAY_X1+PLAY_X2)/2, CY=(PLAY_Y1+PLAY_Y2)/2;
  ctx.globalAlpha=1; ctx.drawImage(bgSnap,0,0);

  if(t<SUCK){
    const p=t/SUCK;
    // 三次方 ease-in：開頭慢、後段急速衝入
    const ep=p*p*p;
    const bhR=8+ep*100;
    bh.ang=(bh.ang||0)+dt*2.2;

    // 強烈暗化遮罩——讓背景靜態硬幣消失，只剩動畫物件清楚可見
    ctx.fillStyle=`rgba(0,0,10,${0.45+ep*0.45})`;
    ctx.fillRect(0,0,W,H);

    // 先畫黑洞（在物件後面）
    if(bhR>4) _drawBH(CX,CY,bhR,Math.min(1,ep*5),bh.ang);

    // 硬幣：直線加速衝向黑洞
    for(const c of snapC){
      const ang=Math.atan2(c.y-CY,c.x-CX);
      const d0=Math.hypot(c.x-CX,c.y-CY);
      const dist=Math.max(0,d0*(1-ep));
      const sx=CX+Math.cos(ang)*dist, sy=CY+Math.sin(ang)*dist;
      // 進入黑洞半徑後消失
      const edgeFade=Math.max(0,Math.min(1,(dist-bhR)/22));
      if(edgeFade<0.01) continue;
      const [R,G,B]=COIN_COL[c.type]||[200,180,80];
      // 速度拖影（沿運動反方向）
      for(let k=1;k<=7;k++){
        const td=dist+k*14, tx=CX+Math.cos(ang)*td, ty=CY+Math.sin(ang)*td;
        if(td>d0) break;
        ctx.globalAlpha=edgeFade*(0.35-k*0.045);
        ctx.fillStyle=`rgba(${R},${G},${B},1)`;
        ctx.beginPath();ctx.arc(tx,ty,COIN_R*(1-k*0.1),0,Math.PI*2);ctx.fill();
      }
      // 主體
      ctx.globalAlpha=edgeFade;
      ctx.fillStyle=`rgb(${R},${G},${B})`;
      ctx.beginPath();ctx.arc(sx,sy,COIN_R,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.55)';
      ctx.beginPath();ctx.arc(sx-COIN_R*0.28,sy-COIN_R*0.28,COIN_R*0.32,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;

    // 助手：同樣直線衝入
    for(const h of snapH){
      const ang=Math.atan2(h.y-CY,h.x-CX);
      const d0=Math.hypot(h.x-CX,h.y-CY);
      const dist=Math.max(0,d0*(1-ep));
      const hx=CX+Math.cos(ang)*dist, hy=CY+Math.sin(ang)*dist;
      const edgeFade=Math.max(0,Math.min(1,(dist-bhR)/22));
      if(edgeFade<0.01) continue;
      ctx.globalAlpha=edgeFade;
      ctx.fillStyle='#cce8ff';ctx.beginPath();ctx.arc(hx,hy,16,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(hx,hy,9,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  else if(t<SUCK+COLLAPSE){
    const p=(t-SUCK)/COLLAPSE;
    bh.ang=(bh.ang||0)+dt*5.5;
    const bhR=108*(1-p*p);
    ctx.fillStyle='rgba(0,0,10,0.88)';ctx.fillRect(0,0,W,H);
    if(p>0.6){ctx.fillStyle=`rgba(210,150,255,${(p-0.6)/0.4*0.7})`;ctx.fillRect(0,0,W,H);}
    if(bhR>1) _drawBH(CX,CY,bhR,1-p*0.5,bh.ang);
    ctx.strokeStyle=`rgba(200,120,255,${Math.max(0,0.85-p)})`;ctx.lineWidth=5;
    ctx.beginPath();ctx.arc(CX,CY,110+p*240,0,Math.PI*2);ctx.stroke();
  }
  else if(t<SUCK+COLLAPSE+FADE){
    const p=(t-SUCK-COLLAPSE)/FADE;
    ctx.fillStyle='rgba(0,0,10,0.88)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle=`rgba(0,0,0,${p*p})`;ctx.fillRect(0,0,W,H);
  }
  else { blackHoleFX=null; bh.onDone(); }
}

function loop(ts){
  if(gamePaused){
    if(blackHoleFX) updateAndDrawBlackHoleFX(ts);
    lastTs=ts;requestAnimationFrame(loop);return;
  }
  const dt=Math.min(.05,(ts-lastTs)/1e3)*CFG.gameSpeed; lastTs=ts;
  fpsCtr++;fpsTime+=dt/CFG.gameSpeed;if(fpsTime>=0.5){fpsVal=Math.round(fpsCtr/fpsTime);fpsCtr=0;fpsTime=0;}
  for(const c of coins) c.update(dt,gs);
  for(const h of helpers) h.update(dt,coins,gs);
  gs.tickNotifications(dt);
  gs.tickAbilities(dt);
  for(const c of coins) c.hover=c.isClicked(mx_,my_);
  if(!gamePaused&&(gs.upgradeLevels?.['slide_flip']||0)>0){
    for(const c of coins) if(c.hover) c.triggerFlip(gs,false);
  }
  saveTimer+=dt; if(saveTimer>=5){saveTimer=0;gs.save();}

  for(let i=shockwaves.length-1;i>=0;i--){shockwaves[i].t+=dt;if(shockwaves[i].t>=0.55)shockwaves.splice(i,1);}

  // ── 滾動硬幣背景 ──
  if(!coinTile) coinTile=buildCoinTile();
  const TSW=coinTile.width,TSH=coinTile.height;
  bgScrollX=(bgScrollX+10*dt)%TSW;
  bgScrollY=(bgScrollY+10*dt)%TSH;
  ctx.save();
  ctx.beginPath();ctx.rect(0,HUD_H,GAME_W,H-HUD_H);ctx.clip();
  for(let ty=HUD_H+bgScrollY-TSH;ty<H;ty+=TSH)
    for(let tx=bgScrollX-TSW;tx<GAME_W;tx+=TSW)
      ctx.drawImage(coinTile,tx,ty);
  ctx.restore();

  if(!bgCache) bgCache=buildBG();
  ctx.drawImage(bgCache,0,0);
  drawBorderCoins(dt);
  drawShockwaves();
  for(const c of coins) c.draw();
  for(const h of helpers) h.draw();
  drawScreenFX(dt);
  drawSacrificeBar(gs,ts);
  drawHUD(gs);
  drawPanel(gs);
  drawAbilitySection(gs);
  drawAbilityTooltip(gs);
  drawPanelBorder();
  drawNotifs(gs);
  if(gs.unlockQueue.length) drawUnlock(gs);
  drawGearBtn();
  drawTrophyBtn();
  drawInfoBtn();
  drawSettings();
  drawAchievementsModal();
  drawInfoModal();
  drawCursor(mx_,my_,cursorDown);
  requestAnimationFrame(loop);
}

async function init(){
  const slot=await showSlotScreen();
  gs=new GameState(); gs.load(slot);
  let name=GameState.getGlobalName();
  if(!name){ name=await showNameScreen(''); GameState.setGlobalName(name); }
  gs.playerName=name;
  initBorderCoins(); rebuild(); initEvents(); lastTs=performance.now();
  canvas.addEventListener('click',()=>AUDIO.start(),{once:true});
  requestAnimationFrame(loop);
}
init();
