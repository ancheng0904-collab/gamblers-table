<!DOCTYPE html>
<html lang="zh-TW">
<head>

<style>

</style>
</head>
<body>
<canvas id="c"></canvas>

</div>

  const s = Math.min(window.innerWidth/W, window.innerHeight/H);
  canvas.style.width  = (W*s)+'px';
  canvas.style.height = (H*s)+'px';
}
window.addEventListener('resize', resize);
resize();

// ═══════════════════════════════════════════════════════
// TALENT TREE DATA
// ═══════════════════════════════════════════════════════
const TALENTS = [

  {id:'time_stop',     name:'時間停止',  desc:'所有冷卻-50%',                 cost:120,x:990, y:315, req:['super_lucky','lightning'],   eff:'talent_speed',  val:0.50, tree:'right'},

function getTalent(id){ return TALENTS.find(t=>t.id===id); }
function upgCost(u, lvl)   { return u.max===1 ? u.base : Math.floor(u.base * Math.pow(u.mult, lvl)); }

// ═══════════════════════════════════════════════════════
// GAME STATE
// ═══════════════════════════════════════════════════════
class GameState {
  constructor() {
    this.slot=1; this.money=0; this.totalEarned=0;
    this.upgradeLevels={}; this.talentPoints=0; this.prestigeCount=0; this.playerName='';
    this.talentLevels={};
    this.notifications=[]; this.unlockQueue=[];
    this._cache=null;
  }
  invalidate() { this._cache=null; }
  computeStats() {
    if (this._cache) return this._cache;
    const s = {
      coinFlat:    Object.fromEntries(COIN_ORDER.map(c=>[c,0])),
      coinMult:    Object.fromEntries(COIN_ORDER.map(c=>[c,1])),
      coinSpeed:   Object.fromEntries(COIN_ORDER.map(c=>[c,1])),
      flipSpeed:   Object.fromEntries(COIN_ORDER.map(c=>[c,1])),
      coinLucky:   Object.fromEntries(COIN_ORDER.map(c=>[c,0])),
      helperMove:1, manualFlipSpd:1, luckyChance:0, globalMult:1, doubleFlip:false,
    };
    for (const [uid,lvl] of Object.entries(this.upgradeLevels)) {
      if (lvl<=0) continue;
      const u=getUpg(uid); if(!u) continue;
      const {eff,val=0,coin}=u;
      if      (eff==='coin_flat'   &&coin) s.coinFlat[coin]  +=val*lvl;
      else if (eff==='coin_mult'   &&coin) s.coinMult[coin]  +=val*lvl;
      else if (eff==='coin_speed'  &&coin) s.coinSpeed[coin] *=Math.pow(1-val,lvl);
      else if (eff==='flip_time'   &&coin) s.flipSpeed[coin] *=Math.pow(1-val,lvl);
      else if (eff==='coin_lucky'  &&coin) s.coinLucky[coin]  =Math.min(.9,s.coinLucky[coin]+val*lvl);
      else if (eff==='helper_move')        s.helperMove       +=val*lvl;
      else if (eff==='manual_flip')        s.manualFlipSpd   *=Math.pow(1-val,lvl);
      else if (eff==='lucky_chance')       s.luckyChance      =Math.min(.9,s.luckyChance+val*lvl);
      else if (eff==='global_mult')        s.globalMult       +=val;
      else if (eff==='double_flip')        s.doubleFlip       =true;
    }
    // apply talent effects
    for (const [tid,bought] of Object.entries(this.talentLevels)) {
      if(!bought) continue;
      const t=getTalent(tid); if(!t) continue;
      const {eff,val}=t;
      if      (eff==='talent_global') s.globalMult  +=val;
      else if (eff==='talent_flip')   { for(const c of COIN_ORDER) s.flipSpeed[c]*=(1-val); }
      else if (eff==='talent_speed')  { for(const c of COIN_ORDER) s.coinSpeed[c]*=(1-val); }
      else if (eff==='talent_lucky')  s.luckyChance =Math.min(.9,s.luckyChance+val);
      else if (eff==='talent_helper') s.helperMove  +=val;
      else if (eff==='talent_multi')  s.doubleFlip  =true;
    }
    return this._cache=s;
  }
  talentUnlocked(id){
    const t=getTalent(id); if(!t) return false;
    return t.req.every(r=>this.talentLevels[r]);
  }
  buyTalent(id){
    const t=getTalent(id); if(!t||this.talentLevels[id]) return false;
    if(!this.talentUnlocked(id)) return false;
    if(this.talentPoints<t.cost) return false;
    this.talentPoints-=t.cost; this.talentLevels[id]=1; this.invalidate(); return true;
  }
  startingCoinsFromTalents(){
    const coins=[];
    if(this.talentLevels['copper_root']) for(let i=0;i<2;i++) coins.push(COPPER);
    if(this.talentLevels['silver_bud'])  coins.push(SILVER);
    if(this.talentLevels['skull_branch'])coins.push(SKULL);
    if(this.talentLevels['gold_leaf'])   coins.push(GOLD);
    if(this.talentLevels['plat_root'])   for(let i=0;i<2;i++) coins.push(PLAT);
    return coins;
  }
  coinValue(t)  { const s=this.computeStats(),b=COIN_VAL[t]; return (b+s.coinFlat[t])*s.coinMult[t]*s.globalMult; }
  flipCooldown(t){ const s=this.computeStats(); const cd={copper:2,silver:2.5,skull:2.8,gold:3,platinum:4}; return Math.max(.3,cd[t]*s.coinSpeed[t]); }
  flipDuration(t){ const s=this.computeStats(); return Math.max(.35,.90*s.flipSpeed[t]); }
  manualFlipDuration(t){ const s=this.computeStats(); return Math.max(.18,this.flipDuration(t)*s.manualFlipSpd); }
  helperInterval(){ return Math.max(.4,HELPER_INTERVAL_BASE*1); }
  helperMoveSpeed(){ return HELPER_SPEED_BASE*this.computeStats().helperMove; }
  earnMoney(t) {
    const s=this.computeStats(), amt=this.coinValue(t);
    const luck=Math.min(.95,s.luckyChance+s.coinLucky[t]);
    const doubled=Math.random()<luck;
    const earned=doubled?amt*2:amt;
    this.money+=earned; this.totalEarned+=earned;
    return {amount:earned,doubled};
  }
  buyUpgrade(uid,spawnCoin,spawnHelper) {
    const u=getUpg(uid); if(!u) return false;
    const lvl=this.upgradeLevels[uid]||0;
    if(lvl>=u.max) return false;
    if(u.req&&!(this.upgradeLevels[u.req]>0)) return false;
    const cost=upgCost(u,lvl);
    if(this.money<cost) return false;
    this.money-=cost; this.upgradeLevels[uid]=lvl+1; this.invalidate();
    if(lvl===0) for(const u2 of UPGRADES) if(u2.req===uid) this.unlockQueue.push({name:u2.name,desc:u2.desc||''});
    if(u.eff==='add_coin')   spawnCoin(u.coin);
    if(u.eff==='add_helper') spawnHelper();
    return true;
  }
  sacrifice(rebuildFn) {
    const pts=Math.max(0,Math.floor(this.totalEarned/1e6));
    if(pts<=0) return 0;
    this.talentPoints+=pts; this.prestigeCount+=1;
    this.money=0; this.totalEarned=0; this.upgradeLevels={}; this.invalidate();
    rebuildFn(); this.notify(`Sacrifice! +${pts} talent pts`,'#4bd2d2'); return pts;
  }
  notify(text,color='#eeeef8') { this.notifications.push({text,color,timer:2.5}); }
  tickNotifications(dt) { this.notifications=this.notifications.filter(n=>(n.timer-=dt)>0); }
  static slotKey(n) { return `gt_slot_${n}`; }
  static getPreview(n) {
    try { const d=JSON.parse(localStorage.getItem(GameState.slotKey(n))||'null'); return d?{money:d.money||0,totalEarned:d.totalEarned||0,prestigeCount:d.prestigeCount||0}:null; } catch{return null;}
  }
  static getGlobalName()      { return localStorage.getItem('gt_player_name')||''; }
  static setGlobalName(name)  { localStorage.setItem('gt_player_name', name); }
  static deleteSlot(n) { localStorage.removeItem(GameState.slotKey(n)); }
  save() {
    try { localStorage.setItem(GameState.slotKey(this.slot),JSON.stringify({money:this.money,totalEarned:this.totalEarned,upgradeLevels:this.upgradeLevels,talentPoints:this.talentPoints,prestigeCount:this.prestigeCount,talentLevels:this.talentLevels})); } catch{}
    syncToServer(this);
  }
  load(slot) {
    this.slot=slot;
    try { const d=JSON.parse(localStorage.getItem(GameState.slotKey(slot))||'null'); if(!d) return; Object.assign(this,{money:d.money||0,totalEarned:d.totalEarned||0,upgradeLevels:d.upgradeLevels||{},talentPoints:d.talentPoints||0,prestigeCount:d.prestigeCount||0,talentLevels:d.talentLevels||{}}); } catch{}
  }
}

// ═══════════════════════════════════════════════════════
// COIN
// ═══════════════════════════════════════════════════════
const JUMP_H=160, SPIN_ROTS=7, SQUISH_DUR=.13;

class Coin {
  constructor(type) {
    this.type=type;
    this.x=ri(PLAY_X1+COIN_R+4,PLAY_X2-COIN_R-4);
    const yMin=PLAY_Y1+COIN_R+(PLAY_Y2-PLAY_Y1)*.30;
    this.y=ri(yMin,PLAY_Y2-COIN_R-4);
    this.baseY=this.y; this.curY=this.y;
    this.state='idle'; this.jumpT=0; this.squishT=0;
    this.spinAngle=0; this.spinSpeed=0;
    this.upDur=.45; this.downDur=.45;
    this.resolved=false; this.result=null;
    this.earnText=''; this.earnColor='#d4b437'; this.earnTimer=0; this.earnDy=0;
    this.hover=false; this.targeted=false;
  }
  triggerFlip(gs,isManual=false) {
    if(this.state!=='idle') return false;
    AUDIO.sfx('flip');
    const total=gs ? (isManual?gs.manualFlipDuration(this.type):gs.flipDuration(this.type)) : .9;
    this.upDur=this.downDur=total/2;
    this.spinSpeed=360*SPIN_ROTS/total; this.spinAngle=0;
    this.resolved=false; this.result=null;
    this.state='up'; this.jumpT=0; this.curY=this.baseY;
    return true;
  }
  update(dt,gs) {
    if(this.state==='up') {
      this.jumpT+=dt; this.spinAngle+=this.spinSpeed*dt;
      const t=Math.min(1,this.jumpT/this.upDur);
      this.curY=this.baseY-JUMP_H*Math.sin(t*Math.PI*.5);
      if(t>=1){if(!this.resolved){this.resolved=true;this.spinSpeed=-this.spinSpeed;this._resolve(gs);}this.state='down';this.jumpT=0;}
    } else if(this.state==='down') {
      this.jumpT+=dt; this.spinAngle+=this.spinSpeed*dt;
      const t=Math.min(1,this.jumpT/this.downDur);
      this.curY=this.baseY-JUMP_H*Math.cos(t*Math.PI*.5);
      if(t>=1){this.curY=this.baseY;this.spinAngle=0;this.spinSpeed=0;this.state='squish';this.squishT=0;}
    } else if(this.state==='squish') {
      this.squishT+=dt; if(this.squishT>=SQUISH_DUR) this.state='idle';
    }
    if(this.earnTimer>0){this.earnTimer-=dt;this.earnDy+=dt*28;}
  }
  _resolve(gs) {
    if(Math.random()<.5){
      const {amount,doubled}=gs.earnMoney(this.type);
      this.result='heads'; this.earnText=fmt(amount)+' $';
      this.earnColor=doubled?'#4bd2d2':'#d4b437'; this.earnTimer=1.2; this.earnDy=0;
      AUDIO.sfx('heads');
      if(doubled) AUDIO.sfx('double');
    } else { this.result='tails'; this.earnText=''; AUDIO.sfx('tails'); }
  }
  isClicked(mx,my) { const dx=mx-this.x,dy=my-this.baseY; return dx*dx+dy*dy<=(COIN_R+6)**2; }
  draw() {
    const r=COIN_R,fw=r*2, FLAT_R=.36, fh=Math.max(4,Math.round(fw*FLAT_R));
    const [R,G,B]=COIN_COL[this.type],[DR,DG,DB]=COIN_DARK[this.type];
    const col=rgb(R,G,B),dark=rgb(DR,DG,DB),dk=rgb(DR-30,DG-30,DB-30),hi=rgb(R+38,G+38,B+38);
    const cx=this.x,cy=this.curY;

    // Shadow on floor
    const inAir=this.state==='up'||this.state==='down';
    const ht=Math.max(0,this.baseY-this.curY);
    const sw=inAir?Math.max(5,Math.round(fw*(1-ht/(JUMP_H+1)))):fw;
    ctx.fillStyle='rgba(0,0,0,.35)'; ellipse(cx,this.baseY+4,sw/2,3);

    const THICK=6;
    const drawFlat=(fy,curH,doFace=true,dimmed=false)=>{
      ellipse(cx,fy+THICK,fw/2,curH/2,dk);
      ellipse(cx,fy+THICK/2,fw/2,curH/2,dark);
      ellipse(cx,fy,fw/2,curH/2,col);
      ellipse(cx-1,fy-curH/2+Math.max(1,Math.round(curH*.2)),Math.max(2,(fw-8)/2),Math.max(1,Math.round(curH*.2)),hi);
      ctx.strokeStyle=dark;ctx.lineWidth=1;
      ctx.beginPath();ctx.ellipse(cx,fy,fw/2-3,curH/2-1,0,0,Math.PI*2);ctx.stroke();
      if(doFace&&this.result) this._face(cx,fy,fw,curH);
      if(dimmed){ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(cx,fy,fw/2,curH/2,0,0,Math.PI*2);ctx.fill();}
    };

    if(this.state==='idle') {
      drawFlat(this.baseY,fh);
    } else if(this.state==='squish') {
      const prog=this.squishT/SQUISH_DUR;
      drawFlat(this.baseY,Math.max(fh,Math.round(fw*(1-(1-FLAT_R)*prog))),prog>.45);
    } else {
      const fc=Math.abs(Math.cos(this.spinAngle*Math.PI/180));
      const aw=Math.max(2,Math.round(fw*fc));
      ctx.save();ctx.translate(cx,cy);ctx.scale(aw/fw,1);
      ctx.fillStyle=dk;ctx.beginPath();ctx.arc(0,3,r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=col;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.22)';ctx.beginPath();ctx.ellipse(-3,-4,r*.6,r*.38,-0.3,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=dk;ctx.font=`bold ${Math.round(r*.9)}px sans-serif`;
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(COIN_SYM[this.type]||'$',0,1);
      ctx.restore();
    }

    if(this.hover&&this.state==='idle'){
      ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=2;
      ctx.beginPath();ctx.ellipse(cx,this.baseY,fw/2+5,fh/2+4,0,0,Math.PI*2);ctx.stroke();
    }
    if(this.targeted&&this.state==='idle'){
      ctx.fillStyle='#fff038';ctx.beginPath();ctx.arc(cx,this.baseY-fh/2-5,3,0,Math.PI*2);ctx.fill();
    }
    if(this.earnTimer>0&&this.earnText){
      ctx.save();ctx.globalAlpha=Math.min(1,this.earnTimer/.35);
      ctx.fillStyle=this.earnColor;ctx.font='15px sans-serif';
      ctx.textAlign='center';ctx.textBaseline='bottom';
      ctx.fillText(this.earnText,cx,this.baseY-fh/2-14-this.earnDy);ctx.restore();
    }
  }
  _face(cx,fy,fw,fh) {
    const sw=Math.max(8,fw/3),sh=Math.max(4,fh-2);
    if(this.result==='tails'){
      const er=Math.max(1,Math.round(sh/4));
      ellipse(cx,fy,sw/2,sh/2,'rgb(210,200,185)');
      ellipse(cx-sw/4,fy-sh/8,er,er,'rgb(18,13,28)');
      ellipse(cx+sw/4,fy-sh/8,er,er,'rgb(18,13,28)');
      ellipse(cx,fy+sh/8,Math.max(1,er-1),Math.max(1,er-1),'rgb(18,13,28)');
    } else {
      const [DR,DG,DB]=COIN_DARK[this.type];
      ctx.fillStyle=rgb(Math.max(0,DR-20),Math.max(0,DG-20),Math.max(0,DB-20));
      ctx.font=`bold ${Math.max(7,Math.round(fh*.85))}px sans-serif`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(COIN_SYM[this.type]||'$',cx,fy);
    }
  }
}

// ═══════════════════════════════════════════════════════
// HELPER NPC
// ═══════════════════════════════════════════════════════
class Helper {
  constructor(idx) {
    this.x=rf(PLAY_X1+20,PLAY_X2-20); this.y=rf(PLAY_Y1+20,PLAY_Y2-20);
    this.target=null; this.flipTimer=Math.random(); this.walkBob=Math.random()*Math.PI*2;
    this.flipAnim=0; this.facingDir='front';
    this.sleepTimer=Math.random()*10; this.sleeping=false; this.zzzPhase=Math.random()*Math.PI*2;
  }
  update(dt,coins,gs) {
    // 睡眠系統
    const hwLvl=gs.upgradeLevels?.['hard_worker']||0;
    const sleepInterval=hwLvl>=20?Infinity:30+hwLvl*15;
    if(this.sleeping){this.zzzPhase+=dt;return;}
    this.sleepTimer+=dt;
    if(this.sleepTimer>=sleepInterval){
      this.sleeping=true;this.sleepTimer=0;
      if(this.target){this.target.targeted=false;this.target=null;}
      return;
    }
    if(!this.target||this.target.state!=='idle'){
      const idle=coins.filter(c=>c.state==='idle'&&!c.targeted);
      if(idle.length){this.target=idle[Math.floor(Math.random()*idle.length)];this.target.targeted=true;}
      else this.target=null;
    }
    if(this.target){
      const dx=this.target.x-this.x,dy=this.target.y-this.y,dist=Math.hypot(dx,dy);
      const spd=gs.helperMoveSpeed();
      if(dist>2){
        const step=Math.min(spd*dt,dist);
        this.x+=dx/dist*step; this.y+=dy/dist*step;
        this.walkBob+=dt*9;
        if(Math.abs(dx)>=Math.abs(dy)) this.facingDir=dx>0?'right':'left';
        else this.facingDir=dy>0?'front':'back';
      }
      if(dist<22){
        this.flipTimer+=dt;
        if(this.flipTimer>=gs.helperInterval()){
          this.flipTimer=0;
          if(this.target.state==='idle'&&this.target.triggerFlip(gs,false)) this.flipAnim=.55;
          this.target.targeted=false; this.target=null;
          if(gs.computeStats().doubleFlip){
            const ex=coins.filter(c=>c.state==='idle'&&!c.targeted);
            if(ex.length) ex[0].triggerFlip(gs,false);
          }
        }
      }
    } else this.flipTimer+=dt;
    if(this.flipAnim>0) this.flipAnim-=dt;
  }
  draw() {
    const cx=Math.round(this.x),cy=Math.round(this.y);
    // ── 睡著狀態 ──
    if(this.sleeping){
      const SKIN='rgb(228,222,215)',SHADE='rgb(162,155,147)',SHINE='rgb(246,242,237)';
      const o=(x,y,rw,rh)=>{
        ctx.fillStyle=SHADE;ctx.beginPath();ctx.ellipse(x+2,y+3,rw/2,rh/2,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle=SKIN; ctx.beginPath();ctx.ellipse(x,y,rw/2,rh/2,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle=SHINE;ctx.beginPath();ctx.ellipse(x+2,y+1,Math.max(2,(rw-5)/2),Math.max(1,rh/6),0,0,Math.PI*2);ctx.fill();
      };
      ctx.save();ctx.translate(cx,cy);
      // 腿橫著伸出（坐姿）
      o(-13,10,18,9); o(13,10,18,9);
      // 身體
      o(0,1,22,16);
      // 手臂自然下垂
      o(-14,5,9,14); o(14,5,9,14);
      // 頭往下垂
      o(0,-13,19,19);
      // 閉眼（∩ 弧線）
      ctx.strokeStyle='rgb(44,42,62)';ctx.lineWidth=1.8;ctx.lineCap='round';
      ctx.beginPath();ctx.arc(-3,-17,2.8,Math.PI,0,false);ctx.stroke();
      ctx.beginPath();ctx.arc( 3,-17,2.8,Math.PI,0,false);ctx.stroke();
      ctx.restore();
      // zzz 浮動文字
      const t=this.zzzPhase;
      ['z','z','Z'].forEach((ch,i)=>{
        const sz=8+i*4,ox=22+i*9,oy=-10-i*11+Math.sin(t*1.4+i*1.1)*4;
        ctx.globalAlpha=0.35+0.5*Math.abs(Math.sin(t*.85+i*.9));
        ctx.fillStyle='#7aafff';ctx.font=`bold ${sz}px sans-serif`;
        ctx.textAlign='left';ctx.textBaseline='middle';
        ctx.fillText(ch,cx+ox,cy+oy);
      });
      ctx.globalAlpha=1;
      return;
    }
    const wp=this.walkBob;
    const ll=Math.round(Math.sin(wp)*4), lr=Math.round(Math.sin(wp+Math.PI)*4);
    let al=Math.round(Math.sin(wp+Math.PI)*3), ar=Math.round(Math.sin(wp)*3);
    const bd=Math.round(Math.sin(wp*2)*1);
    if(this.flipAnim>0){const t=Math.min(1,this.flipAnim/.20);al=-Math.round(14*t);ar=-Math.round(14*t);}

    const fd=this.facingDir, flipH=fd==='left';
    ctx.save();
    ctx.translate(cx,cy);
    if(flipH) ctx.scale(-1,1);

    const SKIN='rgb(228,222,215)',SHADE='rgb(162,155,147)',SHINE='rgb(246,242,237)';
    const o=(x,y,rw,rh)=>{
      ctx.fillStyle=SHADE;ctx.beginPath();ctx.ellipse(x+2,y+3,rw/2,rh/2,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=SKIN; ctx.beginPath();ctx.ellipse(x,y,rw/2,rh/2,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=SHINE;ctx.beginPath();ctx.ellipse(x+2,y+1,Math.max(2,(rw-5)/2),Math.max(1,rh/6),0,0,Math.PI*2);ctx.fill();
    };
    // draw body (lx=0, ly=0 is waist relative to cx,cy)
    o(-4, 9+ll,8,15); o(4, 9+lr,8,15);       // legs
    o(0, 0+bd,22,16);                          // body
    o(-14,-1+al,9,14);                         // left arm
    ctx.fillStyle=SKIN;ctx.beginPath();ctx.ellipse(0,bd,11,8,0,0,Math.PI*2);ctx.fill(); // shoulder cover
    ctx.fillStyle=SHINE;ctx.beginPath();ctx.ellipse(-1,-4+bd,7.5,2.5,0,0,Math.PI*2);ctx.fill();
    o(14,-1+ar,9,14);                          // right arm
    o(0,-19+bd,19,19);                         // head

    const EY='rgb(44,42,62)',WH='white',BL='rgba(215,168,158,.8)';
    if(fd==='front'){
      ctx.fillStyle=EY;ctx.beginPath();ctx.arc(-3,-23+bd,2,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(3,-23+bd,2,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=WH;ctx.beginPath();ctx.arc(-2,-24+bd,1,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(4,-24+bd,1,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=BL;ctx.beginPath();ctx.ellipse(-8,-18+bd,2.5,1.5,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(8,-18+bd,2.5,1.5,0,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgb(190,120,110)';ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(0,-13+bd,4,0,Math.PI);ctx.stroke();
    } else if(fd==='right'||fd==='left'){
      ctx.fillStyle=EY;ctx.beginPath();ctx.arc(3,-23+bd,2,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=WH;ctx.beginPath();ctx.arc(4,-24+bd,1,0,Math.PI*2);ctx.fill();
    } else {
      ctx.fillStyle='rgb(192,172,150)';ctx.beginPath();ctx.ellipse(0,-27+bd,5.5,4,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=SHADE;ctx.beginPath();ctx.ellipse(-12,-21+bd,3.5,3,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(12,-21+bd,3.5,3,0,0,Math.PI*2);ctx.fill();
    }
    if(this.flipAnim>0){
      const ral=Math.round(Math.min(1,this.flipAnim/.20)*14);
      ctx.strokeStyle='#fff064';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(-14,-1-ral,4,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.arc(14,-1-ral,4,0,Math.PI*2);ctx.stroke();
    }
    ctx.restore();
    if(this.flipAnim>0){
      const t=Date.now()/1e3;
      for(let i=0;i<5;i++){
        const a=(i*72+t*200)*Math.PI/180,sr=22+4*Math.sin(t*8+i);
        ctx.fillStyle='#ffdc3c';ctx.beginPath();ctx.arc(cx+sr*Math.cos(a),cy+sr*Math.sin(a),3,0,Math.PI*2);ctx.fill();
      }
    }
  }
}

// UTILS
// ═══════════════════════════════════════════════════════
function ri(a,b){return Math.floor(a+Math.random()*(b-a));}
function rf(a,b){return a+Math.random()*(b-a);}
function rgb(r,g,b){return `rgb(${Math.max(0,Math.round(r))},${Math.max(0,Math.round(g))},${Math.max(0,Math.round(b))})`;}
function ellipse(x,y,rx,ry,col){if(col)ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y,Math.max(.5,rx),Math.max(.5,ry),0,0,Math.PI*2);ctx.fill();}
function rRect(x,y,w,h,r,fill,stroke,lw=1){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}}
function fmt(n){if(n<1e3)return'$'+n.toFixed(0);if(n>=1e12)return'$'+(n/1e12).toFixed(2)+'T';if(n>=1e9)return'$'+(n/1e9).toFixed(2)+'B';if(n>=1e6)return'$'+(n/1e6).toFixed(2)+'M';return'$'+(n/1e3).toFixed(2)+'K';}

// BACKGROUND CACHE
// ═══════════════════════════════════════════════════════
let bgCache=null;
function buildBG() {
  const off=new OffscreenCanvas(W,H); const c=off.getContext('2d');
  // Wood planks
  const PC=['#764c26','#6c4420','#80542c','#69411e','#7a502a'];
  for(let row=0;row*38<H;row++){
    c.fillStyle=PC[row%5];c.fillRect(0,HUD_H+row*38,GAME_W,38);
    c.strokeStyle='#482c12';c.lineWidth=2;c.beginPath();c.moveTo(0,HUD_H+row*38);c.lineTo(GAME_W,HUD_H+row*38);c.stroke();
    for(let gx=0;gx<GAME_W;gx+=80){const ofs=(row*37+gx)%25;c.strokeStyle='#482c12';c.lineWidth=1;c.beginPath();c.moveTo(gx+ofs,HUD_H+row*38+6);c.lineTo(gx+ofs+30,HUD_H+row*38+16);c.stroke();}
  }
  // Stone borders
  const STC=['#1e1e24','#2a2a32','#373741'];
  for(const [rx,ry,rw,rh] of [[0,0,BORDER_W,H],[GAME_W-BORDER_W,0,BORDER_W,H],[0,HUD_H,GAME_W,BORDER_W],[0,H-BORDER_W,GAME_W,BORDER_W]]){
    for(let bx=rx;bx<rx+rw;bx+=20)for(let by=ry;by<ry+rh;by+=20){
      c.fillStyle=STC[(Math.floor(bx/20)+Math.floor(by/20))%3];
      c.fillRect(bx,by,Math.min(20,rx+rw-bx),Math.min(20,ry+rh-by));
      c.strokeStyle='#16161c';c.lineWidth=1;c.strokeRect(bx,by,Math.min(20,rx+rw-bx),Math.min(20,ry+rh-by));
    }
  }
  for(const [bx,by] of [[0,HUD_H],[GAME_W-BORDER_W,HUD_H],[0,H-BORDER_W],[GAME_W-BORDER_W,H-BORDER_W]]){
    c.fillStyle='#be9428';c.fillRect(bx,by,BORDER_W,BORDER_W);
    c.strokeStyle='#e6b432';c.lineWidth=2;c.strokeRect(bx+4,by+4,BORDER_W-8,BORDER_W-8);
  }
  // Carpet
  const cx1=CARPET_X1,cx2=CARPET_X2,cy1=PLAY_Y1-6,cy2=PLAY_Y2+6,cw=cx2-cx1,ch=cy2-cy1;
  c.fillStyle='rgba(0,0,0,.28)';c.fillRect(cx1+3,cy1+5,cw+8,ch+8);
  c.fillStyle='#6c141a';c.fillRect(cx1,cy1,cw,ch);
  for(let fy=cy1;fy<cy2;fy+=5){c.fillStyle=Math.floor(fy/5)%2===0?'#711721':'#671117';c.fillRect(cx1,fy,cw,1);}
  c.strokeStyle='#801e24';c.lineWidth=1;
  for(let fy=cy1;fy<cy2+40;fy+=40)for(let fx=cx1;fx<cx2+40;fx+=40){
    const hw=14,mx2=fx+20,my2=fy+20;
    c.beginPath();c.moveTo(mx2,my2-hw);c.lineTo(mx2+hw,my2);c.lineTo(mx2,my2+hw);c.lineTo(mx2-hw,my2);c.closePath();c.stroke();
  }
  const grd=c.createRadialGradient(cx1+cw/2,cy1+ch/2,0,cx1+cw/2,cy1+ch/2,Math.max(cw,ch)*.6);
  grd.addColorStop(0,'rgba(220,40,30,.16)');grd.addColorStop(1,'rgba(220,40,30,0)');
  c.fillStyle=grd;c.fillRect(cx1,cy1,cw,ch);
  c.strokeStyle='#c39828';c.lineWidth=2;c.strokeRect(cx1,cy1,cw,ch);
  c.strokeStyle='#967020';c.lineWidth=1;c.strokeRect(cx1+8,cy1+8,cw-16,ch-16);
  // Draping
  for(let i=1;i<=18;i++){
    const t=Math.pow(i/18,.6),r2=Math.round(165*(1-t)+40*t),g2=Math.round(52*(1-t)+5*t),b2=Math.round(60*(1-t)+8*t);
    c.strokeStyle=`rgb(${r2},${g2},${b2})`;c.lineWidth=1;
    if(cx1-i>=BORDER_W){c.beginPath();c.moveTo(cx1-i,cy1);c.lineTo(cx1-i,cy2);c.stroke();}
    if(cx2+i<=GAME_W-BORDER_W){c.beginPath();c.moveTo(cx2+i,cy1);c.lineTo(cx2+i,cy2);c.stroke();}
    if(cy1-i>=HUD_H+BORDER_W){c.beginPath();c.moveTo(cx1,cy1-i);c.lineTo(cx2,cy1-i);c.stroke();}
    if(cy2+i<=H-BORDER_W){c.beginPath();c.moveTo(cx1,cy2+i);c.lineTo(cx2,cy2+i);c.stroke();}
  }
  c.strokeStyle='rgb(172,62,70)';c.lineWidth=2;
  [[cx1,cy1,cx1,cy2],[cx2,cy1,cx2,cy2],[cx1,cy1,cx2,cy1],[cx1,cy2,cx2,cy2]].forEach(([x1,y1,x2,y2])=>{c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();});
  for(let i=0;i<7;i++){c.strokeStyle=`rgba(0,0,0,${.22-.02*i})`;c.lineWidth=1;c.beginPath();c.moveTo(cx1+i,cy1);c.lineTo(cx1+i,cy2);c.stroke();c.beginPath();c.moveTo(cx2-i,cy1);c.lineTo(cx2-i,cy2);c.stroke();c.beginPath();c.moveTo(cx1,cy1+i);c.lineTo(cx2,cy1+i);c.stroke();c.beginPath();c.moveTo(cx1,cy2-i);c.lineTo(cx2,cy2-i);c.stroke();}
  // L-corners
  for(const [bx,by,sx,sy] of [[cx1,cy1,1,1],[cx2,cy1,-1,1],[cx1,cy2,1,-1],[cx2,cy2,-1,-1]]){
    const hx=sx>0?bx:bx-52,hy=sy>0?by:by-10;
    c.fillStyle='#98741a';c.fillRect(hx,hy,52,10);c.fillStyle='#c69b2c';c.fillRect(hx,hy,52,7);c.fillStyle='#ebc041';c.fillRect(hx+1,hy+1,50,2);
    const vx=sx>0?bx:bx-10,vy=sy>0?by:by-52;
    c.fillStyle='#98741a';c.fillRect(vx,vy,10,52);c.fillStyle='#c69b2c';c.fillRect(vx,vy,7,52);c.fillStyle='#ebc041';c.fillRect(vx+1,vy+1,2,50);
    const sqx=sx>0?bx:bx-10,sqy=sy>0?by:by-10;
    c.fillStyle='#ebc041';c.fillRect(sqx,sqy,10,10);c.strokeStyle='#98741a';c.lineWidth=1;c.strokeRect(sqx,sqy,10,10);
  }
  // Panel
  c.fillStyle='#10101a';c.fillRect(GAME_W,0,PANEL_W,H);
  for(let y=0;y<H;y+=8){const sh=Math.floor(y/8)%2===0?210:160;c.fillStyle=`rgb(${sh},${Math.floor(sh*148/210)},${Math.floor(sh*40/210)})`;c.fillRect(GAME_W,y,5,8);}
  return off;
}

let tab='items', scroll=0, mx_=0, my_=0;
const ITEM_EFFS=new Set(['add_coin','add_helper']);
function visUpgrades(gs){return UPGRADES.filter(u=>(!u.req||gs.upgradeLevels[u.req]>0)&&(tab==='items'?ITEM_EFFS.has(u.eff):!ITEM_EFFS.has(u.eff)));}

// ═══════════════════════════════════════════════════════
function drawIcon(upg,ix,cy2){
  const r=14,eff=upg.eff,ct=upg.coin,cx=ix+r;
  ctx.save();

  function coinShape(coinType,cx2,cy3,rad){
    const [R,G,B]=COIN_COL[coinType],[DR,DG,DB]=COIN_DARK[coinType];
    ctx.fillStyle=rgb(DR,DG,DB);ctx.beginPath();ctx.arc(cx2,cy3+2,rad,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=rgb(R,G,B);ctx.beginPath();ctx.arc(cx2,cy3,rad,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=rgb(DR-20,DG-20,DB-20);ctx.font=`bold ${Math.floor(rad*.8)}px sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(COIN_SYM[coinType]||'$',cx2,cy3);
  }
  function badge(text,col){
    ctx.font='bold 9px sans-serif';ctx.textAlign='left';ctx.textBaseline='top';
    const tw=ctx.measureText(text).width,bx=cx+r-tw-1,by=cy2+r-11;
    ctx.fillStyle='rgba(15,15,25,.92)';ctx.fillRect(bx-1,by-1,tw+4,11);
    ctx.strokeStyle=col;ctx.lineWidth=.7;ctx.strokeRect(bx-1,by-1,tw+4,11);
    ctx.fillStyle=col;ctx.fillText(text,bx,by);
  }
  function personBody(){
    ctx.fillStyle='#d2d2e1';ctx.beginPath();ctx.ellipse(cx,cy2,9,12,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#282834';ctx.beginPath();ctx.arc(cx-3,cy2-2,2.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx+3,cy2-2,2.5,0,Math.PI*2);ctx.fill();
  }
  function starShape(col){
    ctx.fillStyle=col;ctx.beginPath();
    [[-0,-9],[2.6,-2.9],[8.7,-2.9],[4.1,1.1],[5.7,7.6],[0,3.6],[-5.7,7.6],[-4.1,1.1],[-8.7,-2.9],[-2.6,-2.9]].forEach(([px,py],i)=>{
      (i===0?ctx.moveTo:ctx.lineTo).call(ctx,cx+px,cy2+py);
    });ctx.closePath();ctx.fill();
  }

  if(eff==='add_coin'&&ct){        coinShape(ct,cx,cy2,r);badge('+1','#4bc850');
  }else if(eff==='add_helper'){    personBody();badge('+1','#4bc850');
  }else if(eff==='coin_flat'&&ct){ coinShape(ct,cx,cy2,r);badge('$+','#4bc850');
  }else if(eff==='coin_mult'&&ct){ coinShape(ct,cx,cy2,r);badge('×%','#d4b437');
  }else if(eff==='coin_speed'&&ct){coinShape(ct,cx,cy2,r);badge('⚡','#4bd2d2');
  }else if(eff==='coin_lucky'&&ct){coinShape(ct,cx,cy2,r);badge('%+','#d4b437');
  }else if(eff==='lucky_chance'){  starShape('#d4b437');badge('%+','#d4b437');
  }else if(eff==='helper_move'){   personBody();badge('⚡','#4bd2d2');
  }else if(eff==='flip_time'&&ct){ coinShape(ct,cx,cy2,r);badge('↻+','#4bd2d2');
  }else if(eff==='manual_flip'){
    ctx.fillStyle='#826818';ctx.beginPath();ctx.arc(cx-3,cy2+2,r-5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#d28c3c';ctx.beginPath();ctx.arc(cx-3,cy2,r-5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.9)';const ax=ix+r+4,ay=cy2-r+3;
    ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(ax+7,ay+5);ctx.lineTo(ax+4,ay+5);ctx.lineTo(ax+6,ay+11);ctx.lineTo(ax+3,ay+11);ctx.lineTo(ax+1,ay+5);ctx.lineTo(ax-2,ay+7);ctx.closePath();ctx.fill();
    badge('⚡','#4bd2d2');
  }else if(eff==='shockwave'){
    ctx.strokeStyle='#4bd2d2';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy2,r-2,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='#4bd2d2';ctx.beginPath();ctx.moveTo(cx+4,cy2-r+2);ctx.lineTo(cx+9,cy2-r+6);ctx.lineTo(cx,cy2-r+6);ctx.closePath();ctx.fill();
    badge('NOW','#4bd2d2');
  }else if(eff==='double_flip'){   personBody();badge('×2','#4bc850');
  }else if(eff==='global_mult'){   starShape('#d4b437');badge('×%','#d4b437');
  }else if(ct){                    coinShape(ct,cx,cy2,r);
  }else{                           starShape('#d4b437');
  }
  ctx.restore();
}

let sacBtnRect=null;

function drawPanel(gs) {
  const px=GAME_W+6, tabW=Math.floor((PANEL_W-6)/3);
  const tabDefs=[['items','Items'],['upgrades','Upgrade'],['sacrifice','Sacrifice']];
  tabDefs.forEach(([tid,tn],i)=>{
    const tx=px+i*tabW,act=tab===tid;
    rRect(tx,0,tabW,HUD_H,0,act?'#1e1e30':'#12121c',act?'#be9428':'#1e1e24');
    ctx.fillStyle=act?'#eeeef8':'#828296';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(tn,tx+tabW/2,HUD_H/2);
  });
  const cr={x:px,y:HUD_H+4,w:PANEL_W-6,h:H-HUD_H-4};
  if(tab==='sacrifice'){drawSacrifice(gs,cr);return;}

  const IH=62,pd=6;
  const vis=visUpgrades(gs);
  const totH=vis.length*IH, maxScr=Math.max(0,totH-cr.h);
  scroll=Math.max(0,Math.min(maxScr,scroll));
  ctx.save();ctx.beginPath();ctx.rect(cr.x,cr.y,cr.w,cr.h);ctx.clip();
  let y=cr.y-scroll;
  for(const u of vis){
    const lvl=gs.upgradeLevels[u.id]||0,maxed=lvl>=u.max,cost=upgCost(u,lvl),canBuy=!maxed&&gs.money>=cost;
    if(y+IH>cr.y&&y<cr.y+cr.h){
      const ir={x:cr.x+pd,y:y+2,w:cr.w-pd*2,h:IH-4};
      const hov=mx_>=ir.x&&mx_<=ir.x+ir.w&&my_>=ir.y&&my_<=ir.y+ir.h;
      rRect(ir.x,ir.y,ir.w,ir.h,4,hov?'#24243a':'#1a1a28','#2a2a32');
      drawIcon(u,ir.x+6,ir.y+ir.h/2);
      ctx.fillStyle='#eeeef8';ctx.font='15px sans-serif';ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText(u.name,ir.x+44,ir.y+8);
      ctx.fillStyle='#828296';ctx.font='12px sans-serif';ctx.fillText(maxed?'MAX':`${lvl}/${u.max}`,ir.x+44,ir.y+28);
      if(!maxed){ctx.fillStyle=canBuy?'#4bc850':'#dc4641';ctx.font='15px sans-serif';ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText(fmt(cost),ir.x+ir.w-8,ir.y+ir.h/2);}
    }
    y+=IH;
  }
  ctx.restore();
  if(totH>cr.h){const ratio=cr.h/totH,bh=Math.max(24,Math.round(cr.h*ratio)),by=cr.y+Math.round(scroll/totH*cr.h);rRect(cr.x+cr.w-5,by,4,bh,2,'#2a2a32',null);}
}

  [['Reset your run. Keep talent points.','#828296'],['',''],[`Total earned: ${fmt(gs.totalEarned)}`,'#eeeef8'],['',''],['Talent preview:','#828296']].forEach(([t,c])=>{if(t){ctx.fillStyle=c;ctx.font='15px sans-serif';ctx.fillText(t,cx2,y);}y+=24;});

function showNameScreen(existingName){
  return new Promise(resolve=>{
    const ov=document.getElementById('nameOverlay');
    const inp=document.getElementById('nameInput');
    const btn=document.getElementById('nameConfirm');
    inp.value=existingName||'';
    ov.classList.add('show');
    inp.focus();
    const confirm=()=>{
      const name=(inp.value||'').trim().slice(0,16)||'玩家';
      ov.classList.remove('show');
      btn.removeEventListener('click',confirm);
      inp.removeEventListener('keydown',onKey);
      resolve(name);
    };
    const onKey=e=>{if(e.key==='Enter') confirm();};
    btn.addEventListener('click',confirm);
    inp.addEventListener('keydown',onKey);
  });
}

let _stars=null;
function getStars(){
  if(!_stars) _stars=Array.from({length:220},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()<.15?2.2:Math.random()<.4?1.5:1,a:.4+Math.random()*.6,twinkle:Math.random()*Math.PI*2}));
  return _stars;
}

function drawTalentBG(t){
  // purple starry sky gradient
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0a0415'); g.addColorStop(.5,'#12082a'); g.addColorStop(1,'#1a0838');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // nebula blobs
  [[350,200,180,'rgba(100,30,180,.12)'],[800,350,220,'rgba(60,20,140,.10)'],[500,500,150,'rgba(140,50,200,.08)']].forEach(([nx,ny,nr,nc])=>{
    const ng=ctx.createRadialGradient(nx,ny,0,nx,ny,nr);ng.addColorStop(0,nc);ng.addColorStop(1,'transparent');
    ctx.fillStyle=ng;ctx.fillRect(0,0,W,H);
  });
  // stars
  getStars().forEach(s=>{
    const a=s.a*(.7+.3*Math.sin(s.twinkle+t*2));
    ctx.fillStyle=`rgba(220,200,255,${a})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
  });
}

function drawTrunk(cx){
  ctx.strokeStyle='#4a2e0a';ctx.lineWidth=28;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx,H);ctx.bezierCurveTo(cx,580,cx-5,520,cx,400);ctx.stroke();
  ctx.strokeStyle='#6b4418';ctx.lineWidth=18;
  ctx.beginPath();ctx.moveTo(cx,H);ctx.bezierCurveTo(cx,580,cx-5,520,cx,400);ctx.stroke();
  ctx.strokeStyle='rgba(255,200,100,.08)';ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(cx-5,H);ctx.bezierCurveTo(cx-5,580,cx-9,520,cx-4,400);ctx.stroke();
}
function drawBranches(pairs,col){
  ctx.strokeStyle=col||'#3d1f08';ctx.lineWidth=7;ctx.lineCap='round';
  pairs.forEach(([x1,y1,x2,y2])=>{
    const mx=(x1+x2)/2,my=(y1+y2)/2-18;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(mx,my,x2,y2);ctx.stroke();
  });
}
function drawTree(){
  ctx.save();
  // LEFT tree trunk
  drawTrunk(425);
  drawBranches([
    [425,420,390,590],[425,420,590,590],

    [160,315,285,175],[400,315,285,175],
    [650,315,565,175],[400,315,565,175],
    [285,175,425,55],[565,175,425,55],
  ]);

  drawTrunk(880);

    [790,590,710,450],[880,420,880,450],
    [970,590,1055,450],[970,590,880,450],
    [710,450,750,315],[880,450,750,315],
    [880,450,990,315],[1055,450,990,315],
    [750,315,810,175],
    [990,315,1010,175],
    [810,175,900,55],[1010,175,900,55],

function drawTalentNode(t,gs_,hov){
  const bought=gs_.talentLevels[t.id];
  const unlocked=gs_.talentUnlocked(t.id);
  const canAfford=gs_.talentPoints>=t.cost;
  const r=28;
  // glow for available
  if(unlocked&&!bought&&canAfford){
    ctx.shadowColor='#c090ff';ctx.shadowBlur=18;
  }
  // outer ring
  const ringCol=bought?'#c8a020':unlocked?'#8a50d8':'#2a1a4a';
  ctx.strokeStyle=ringCol;ctx.lineWidth=3;
  ctx.fillStyle=bought?'#2a1a00':unlocked?'#1a0a2e':'#0d0820';
  ctx.beginPath();ctx.arc(t.x,t.y,r,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.shadowBlur=0;
  // hover ring
  if(hov&&!bought){ctx.strokeStyle='#d4b4ff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(t.x,t.y,r+5,0,Math.PI*2);ctx.stroke();}
  // icon / check
  ctx.textAlign='center';ctx.textBaseline='middle';
  if(bought){
    ctx.fillStyle='#ffd050';ctx.font='bold 20px sans-serif';ctx.fillText('✓',t.x,t.y);
  } else {
    ctx.fillStyle=unlocked?'#c090ff':'#4a3060';ctx.font='bold 13px sans-serif';ctx.fillText(`${t.cost}pt`,t.x,t.y);
  }
  // name label
  ctx.fillStyle=bought?'#ffd050':unlocked?'#d4b4ff':'#5a3880';
  ctx.font=`${bought?'bold ':''} 12px sans-serif`;ctx.fillText(t.name,t.x,t.y+r+12);
}

function showTalentTree(gs_){
  const FADE=0.55; // seconds for fade in/out
  return new Promise(resolve=>{
    let raf_,phase='fadein',fadeAlpha=1,hov_=null,t0=performance.now(),closePending=false;
    const DONE={x:W-120,y:H-50,w:100,h:36};

    const onClick=e=>{
      if(phase!=='idle') return;
      const rect=canvas.getBoundingClientRect(),sc=W/rect.width;
      const mx=(e.clientX-rect.left)*sc,my=(e.clientY-rect.top)*sc;
      if(mx>=DONE.x&&mx<=DONE.x+DONE.w&&my>=DONE.y&&my<=DONE.y+DONE.h){
        phase='fadeout'; fadeAlpha=0; return;
      }
      for(const t of TALENTS){
        if(Math.hypot(mx-t.x,my-t.y)<=30){if(gs_.buyTalent(t.id)) AUDIO.sfx('talent');gs_.save();break;}
      }
    };
    const onMove=e=>{
      const rect=canvas.getBoundingClientRect(),sc=W/rect.width;
      const mx=(e.clientX-rect.left)*sc,my=(e.clientY-rect.top)*sc;
      hov_=TALENTS.find(t=>Math.hypot(mx-t.x,my-t.y)<=30)||null;
    };
    canvas.addEventListener('click',onClick);
    canvas.addEventListener('mousemove',onMove);

    let lastT=performance.now();
    const draw=()=>{
      const now=performance.now(),dt=(now-lastT)/1000;lastT=now;
      const t=(now-t0)/1000;

      // update fade
      if(phase==='fadein'){
        fadeAlpha=Math.max(0,fadeAlpha-dt/FADE);
        if(fadeAlpha<=0) phase='idle';
      } else if(phase==='fadeout'){
        fadeAlpha=Math.min(1,fadeAlpha+dt/FADE);
        if(fadeAlpha>=1){canvas.removeEventListener('click',onClick);canvas.removeEventListener('mousemove',onMove);cancelAnimationFrame(raf_);resolve();return;}
      }

      drawTalentBG(t);
      drawTree();
      // talent point display
      rRect(16,14,220,54,8,'rgba(20,10,40,.75)','#8040c0',2);
      ctx.fillStyle='#c090ff';ctx.font='bold 15px sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText('天賦點數',28,30);
      ctx.fillStyle='#ffd050';ctx.font='bold 26px sans-serif';ctx.fillText(`★ ${gs_.talentPoints}`,28,52);
      ctx.fillStyle='rgba(200,160,255,.85)';ctx.font='bold 18px sans-serif';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText('天賦樹',W/2,16);
      TALENTS.forEach(t2=>drawTalentNode(t2,gs_,hov_===t2));
      if(hov_){
        const t2=hov_;const bought=gs_.talentLevels[t2.id];

function showSlotScreen(){
  return new Promise(resolve=>{
    const CW=580,CH=118,GAP=22,CX=W/2-CW/2,CY0=H/2-(NUM_SLOTS*CH+(NUM_SLOTS-1)*GAP)/2-10;
    const cr=n=>({x:CX,y:CY0+(n-1)*(CH+GAP),w:CW,h:CH});
    const dr=n=>{const r=cr(n);return{x:r.x+r.w-46,y:r.y+12,w:34,h:34};};
    let raf,running=true;

    const onClick=e=>{
      const rect=canvas.getBoundingClientRect(),s=W/rect.width;
      const cmx=(e.clientX-rect.left)*s,cmy=(e.clientY-rect.top)*s;
      for(let n=1;n<=NUM_SLOTS;n++){
        const prev=GameState.getPreview(n),d=dr(n),c=cr(n);
        if(prev&&cmx>=d.x&&cmx<=d.x+d.w&&cmy>=d.y&&cmy<=d.y+d.h){GameState.deleteSlot(n);return;}
        if(cmx>=c.x&&cmx<=c.x+c.w&&cmy>=c.y&&cmy<=c.y+c.h){running=false;cancelAnimationFrame(raf);canvas.removeEventListener('click',onClick);resolve(n);return;}
      }
    };
    canvas.addEventListener('click',onClick);

    const draw=()=>{
      ctx.fillStyle='#26223a';ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#37325a';ctx.fillRect(0,0,W,130);
      ctx.strokeStyle='#be9428';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,130);ctx.lineTo(W,130);ctx.stroke();
      ctx.fillStyle='#d4b437';ctx.font='bold 28px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText("GAMBLER'S TABLE",W/2,52);
      ctx.fillStyle='#c8c3dc';ctx.font='15px sans-serif';ctx.fillText('Choose a Save Slot',W/2,88);

      for(let n=1;n<=NUM_SLOTS;n++){
        const prev=GameState.getPreview(n),c=cr(n);
        const hov=mx_>=c.x&&mx_<=c.x+c.w&&my_>=c.y&&my_<=c.y+c.h;
        rRect(c.x,c.y,c.w,c.h,8,hov?'#484266':'#343052',prev?'#be9428':'#6e6891',2);
        const bg={x:c.x+16,y:c.y+CH/2-22,w:44,h:44};
        rRect(bg.x,bg.y,bg.w,bg.h,6,prev?'#5f558c':'#414060',prev?'#be9428':'#82809f',1);
        ctx.fillStyle=prev?'#d4b437':'#b4b0cf';ctx.font='bold 28px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(n,bg.x+bg.w/2,bg.y+bg.h/2);
        const ix=c.x+76;
        if(prev){
          ctx.fillStyle='#eeeef8';ctx.font='bold 20px sans-serif';ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText(`Slot ${n}`,ix,c.y+14);
          ctx.fillStyle='#c8c3dc';ctx.font='15px sans-serif';ctx.fillText(`Total: ${fmt(prev.totalEarned)}   ×${prev.prestigeCount} Prestige`,ix,c.y+44);
          ctx.fillStyle='#4bc850';ctx.fillText(`Money: ${fmt(prev.money)}`,ix,c.y+70);
          const d=dr(n);const hovD=mx_>=d.x&&mx_<=d.x+d.w&&my_>=d.y&&my_<=d.y+d.h;
          rRect(d.x,d.y,d.w,d.h,5,hovD?'#6e2020':'#411414','#d24b4b',1);
          ctx.fillStyle='#e65f5f';ctx.font='20px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('×',d.x+d.w/2,d.y+d.h/2);
          ctx.fillStyle='#a04848';ctx.font='12px sans-serif';ctx.textBaseline='top';ctx.fillText('reset',d.x+d.w/2,d.y+d.h+2);
        } else {
          ctx.fillStyle='#c8c3dc';ctx.font='20px sans-serif';ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText(`Slot ${n}`,ix,c.y+18);
          ctx.fillStyle='#a09fbf';ctx.font='15px sans-serif';ctx.fillText('— Empty —',ix,c.y+48);
          ctx.fillStyle='#9190b0';ctx.font='12px sans-serif';ctx.fillText('Click to start new game',ix,c.y+80);
        }
      }
      ctx.fillStyle='#a0a0bf';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText('Click a slot to play  •  [×] reset  •  ESC quit',W/2,H-10);
      if(running) raf=requestAnimationFrame(draw);
    };
    raf=requestAnimationFrame(draw);
  });
}

    },
    buy(ac){
      const t=ac.currentTime;const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.setValueAtTime(600,t);o.frequency.exponentialRampToValueAtTime(350,t+.08);g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.25);const o2=ac.createOscillator(),g2=ac.createGain();o2.type='sine';o2.frequency.value=880;g2.gain.setValueAtTime(.16,t+.04);g2.gain.exponentialRampToValueAtTime(.001,t+.28);o2.connect(g2);g2.connect(ac.destination);o2.start(t+.04);o2.stop(t+.32);
    },
    unlock(ac){
      const t=ac.currentTime;[[_C5,.38],[_E5,.36]].forEach(([freq,vol],i)=>{const delay=i*.22;[1,2,3].forEach((h,j)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=freq*h;g.gain.setValueAtTime(vol/(j+1),t+delay);g.gain.exponentialRampToValueAtTime(.001,t+delay+.5-j*.1);o.connect(g);g.connect(ac.destination);o.start(t+delay);o.stop(t+delay+.6);});});
    },
    double(ac){
      const t=ac.currentTime;[_A4,_C5,_E5,_A4*2].forEach((freq,i)=>{const d=i*.07;const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.32,t+d);g.gain.exponentialRampToValueAtTime(.001,t+d+.3);o.connect(g);g.connect(ac.destination);o.start(t+d);o.stop(t+d+.35);});
    },
    sacrifice(ac){
      const t=ac.currentTime;const o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(55,t);o.frequency.linearRampToValueAtTime(80,t+1.2);const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=300;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.5,t+.3);g.gain.linearRampToValueAtTime(.6,t+.8);g.gain.exponentialRampToValueAtTime(.001,t+1.4);o.connect(f);f.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+1.5);
      const buf=ac.createBuffer(1,Math.ceil(ac.sampleRate*1.2),ac.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*.4;const ns=ac.createBufferSource();ns.buffer=buf;const nf=ac.createBiquadFilter();nf.type='bandpass';nf.frequency.setValueAtTime(200,t);nf.frequency.exponentialRampToValueAtTime(4000,t+1.2);nf.Q.value=4;const ng=ac.createGain();ng.gain.setValueAtTime(0,t);ng.gain.linearRampToValueAtTime(.28,t+.2);ng.gain.exponentialRampToValueAtTime(.001,t+1.2);ns.connect(nf);nf.connect(ng);ng.connect(ac.destination);ns.start(t);ns.stop(t+1.4);
    },
    talent(ac){
      const t=ac.currentTime;[_E5,_A4*2,_C5*2,_E5*2].forEach((freq,i)=>{const d=i*.04;[1,2.76,5.4].forEach((h,j)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=freq*h;g.gain.setValueAtTime(.28/(i+1)/(j+1),t+d);g.gain.exponentialRampToValueAtTime(.001,t+d+1.1-j*.3);o.connect(g);g.connect(ac.destination);o.start(t+d);o.stop(t+d+1.3);});});
    },
    milestone(ac){
      const t=ac.currentTime;[[_D4,.18],[_F4,.18],[_A4,.18],[_D5,.55]].forEach(([freq,dur],i)=>{const d=i*.2;const o=ac.createOscillator(),g=ac.createGain();o.type='square';const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=2000;o.frequency.value=freq;g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.32,t+d+.02);g.gain.setValueAtTime(.32,t+d+dur-.04);g.gain.linearRampToValueAtTime(0,t+d+dur);o.connect(f);f.connect(g);g.connect(ac.destination);o.start(t+d);o.stop(t+d+dur+.05);});
      const t2=t+.6;[_D4,_A4,_D5].forEach((freq,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.18/(i+1),t2);g.gain.exponentialRampToValueAtTime(.001,t2+1);o.connect(g);g.connect(ac.destination);o.start(t2);o.stop(t2+1.1);});
    },
  };
  // ── BGM 播放器 ──
  const bgm={current:null,playing:false,timer:null,next:0};
  function _runBGM(which){
    const ac=getAC();
    bgm.current=which;bgm.playing=true;bgm.next=ac.currentTime+.05;
    const fn=which==='main'?scheduleMain:scheduleTalent;
    const tick=()=>{
      if(!bgm.playing) return;
      while(bgm.next<ac.currentTime+.4) bgm.next+=fn(ac,ac.destination,bgm.next);
      bgm.timer=setTimeout(tick,120);
    };
    tick();
  }
  return {
    start(){ if(!bgm.playing) _runBGM('main'); },
    switchBGM(which){ if(bgm.current===which&&bgm.playing) return; clearTimeout(bgm.timer);bgm.playing=false; _runBGM(which); },
    sfx(name){ try{ const ac=getAC(); SFX[name]?.(ac); }catch(_){} },
  };
})();

// ═══════════════════════════════════════════════════════
// CUSTOM CURSOR（手形）
// ═══════════════════════════════════════════════════════
function drawCursor(mx,my,down){
  const dx=down?3:0, dy=down?3:0;
  ctx.save();
  ctx.translate(Math.round(mx+dx),Math.round(my+dy));
  ctx.rotate(-Math.PI/4);
  ctx.lineJoin='round'; ctx.lineCap='round';

  const W_='#ffffff', DK='#cccccc', OL='#333333';
  function fill(lw){
    ctx.fillStyle=W_; ctx.fill();
    ctx.strokeStyle=OL; ctx.lineWidth=lw||2; ctx.stroke();
  }

  // 拳頭主體（掌心）
  ctx.beginPath(); ctx.roundRect(0,17,20,15,6); fill();

  // 三個捲指關節凸起
  ctx.beginPath(); ctx.ellipse(3, 16,4,6.5,0,0,Math.PI*2); fill();
  ctx.beginPath(); ctx.ellipse(10,15,4,6.0,0,0,Math.PI*2); fill();
  ctx.beginPath(); ctx.ellipse(17,16,3.5,5.5,0,0,Math.PI*2); fill();

  // 食指
  ctx.beginPath(); ctx.roundRect(-4,0,8,21,[4,4,2,2]); fill();

  // 關節橫紋
  ctx.strokeStyle=DK; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(-2.5,7);  ctx.lineTo(2.5,7);  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-2.5,13); ctx.lineTo(2.5,13); ctx.stroke();

  ctx.restore();
}

function initEvents(){
  canvas.style.cursor='none';
  canvas.addEventListener('mousedown',()=>cursorDown=true);
  document.addEventListener('mouseup',()=>cursorDown=false);
  canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect(),s=W/r.width;mx_=(e.clientX-r.left)*s;my_=(e.clientY-r.top)*s;});
  canvas.addEventListener('click',e=>{
    const r=canvas.getBoundingClientRect(),s=W/r.width,cmx=(e.clientX-r.left)*s,cmy=(e.clientY-r.top)*s;
    if(gs.unlockQueue.length){gs.unlockQueue.shift();return;}
    const res=getClickTarget(cmx,cmy);
    if(res){
      if(res.kind==='tab'){if(res.val!==tab){tab=res.val;scroll=0;}}
      else if(res.kind==='upgrade'){
        const prevLen=gs.unlockQueue.length;
        if(gs.buyUpgrade(res.val,spawnCoin,spawnHelper)){
          gs.save(); AUDIO.sfx('buy');
          if(gs.unlockQueue.length>prevLen) AUDIO.sfx('unlock');
        }
      }
      else if(res.kind==='sacrifice'){
        const pts=gs.sacrifice(rebuild);bgCache=null;gs.save();
        if(pts>0){
          AUDIO.sfx('sacrifice');
          if(gs.prestigeCount===1) setTimeout(()=>AUDIO.sfx('milestone'),700);
          AUDIO.switchBGM('talent');
          gamePaused=true;
          showTalentTree(gs).then(()=>{AUDIO.switchBGM('main');gamePaused=false;rebuild();gs.save();});
        }
      }
      return;
    }
    if(cmx<GAME_W){
      const woken=helpers.find(h=>h.sleeping&&Math.hypot(h.x-cmx,h.y-cmy)<30);
      if(woken){woken.sleeping=false;woken.sleepTimer=0;return;}
      let best=null,bd=Infinity;for(const c of coins){if(c.isClicked(cmx,cmy)){const d=(c.x-cmx)**2+(c.y-cmy)**2;if(d<bd){bd=d;best=c;}}}if(best) best.triggerFlip(gs,true);
    }
  });
  canvas.addEventListener('wheel',e=>{if(mx_>=GAME_W){const vis=visUpgrades(gs),tot=vis.length*62,max=Math.max(0,tot-(H-HUD_H-4));scroll=Math.max(0,Math.min(max,scroll+e.deltaY*.5));}e.preventDefault();},{passive:false});
  document.addEventListener('keydown',e=>{if(e.key==='Escape') gs.save();});
  window.addEventListener('beforeunload',()=>{if(gs) gs.save();});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&gs) gs.save();});
}

function loop(ts){
  if(gamePaused){lastTs=ts;requestAnimationFrame(loop);return;}
  const dt=Math.min(.05,(ts-lastTs)/1e3); lastTs=ts;
  for(const c of coins) c.update(dt,gs);
  for(const h of helpers) h.update(dt,coins,gs);
  gs.tickNotifications(dt);
  for(const c of coins) c.hover=c.isClicked(mx_,my_);
  saveTimer+=dt; if(saveTimer>=5){saveTimer=0;gs.save();}

  if(!bgCache) bgCache=buildBG();
  ctx.drawImage(bgCache,0,0);
  for(const h of helpers) h.draw();
  for(const c of coins) c.draw();
  drawHUD(gs);
  drawPanel(gs);
  drawNotifs(gs);
  if(gs.unlockQueue.length) drawUnlock(gs);
  drawCursor(mx_,my_,cursorDown);
  requestAnimationFrame(loop);
}

async function init(){
  const slot=await showSlotScreen();
  gs=new GameState(); gs.load(slot);
  let name=GameState.getGlobalName();
  if(!name){ name=await showNameScreen(''); GameState.setGlobalName(name); }
  gs.playerName=name;
  rebuild(); initEvents(); lastTs=performance.now();
  canvas.addEventListener('click',()=>AUDIO.start(),{once:true});
  requestAnimationFrame(loop);
}
init();
</script>
